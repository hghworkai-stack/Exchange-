<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="دفتر صرافی" />
  <title>دفتر صرافی هوشمند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
--bg: #eef2f6;
--bg-accent: radial-gradient(circle at top right, rgba(15, 118, 110, 0.08), transparent 45%);
--surface: #ffffff;
--surface-2: #f8fafc;
--surface-hover: #f1f5f9;
--border: #e2e8f0;
--border-strong: #cbd5e1;
--text: #0f172a;
--text-secondary: #334155;
--text-muted: #64748b;
--primary: #0d9488;
--primary-dark: #0f766e;
--primary-light: #ccfbf1;
--primary-soft: rgba(13, 148, 136, 0.12);
--credit: #059669;
--credit-bg: #ecfdf5;
--credit-border: #a7f3d0;
--debit: #dc2626;
--debit-bg: #fef2f2;
--debit-border: #fecaca;
--amber: #d97706;
--amber-bg: #fffbeb;
--amber-border: #fde68a;
--amber-text: #92400e;
--blue: #2563eb;
--blue-bg: #eff6ff;
--blue-border: #bfdbfe;
--purple: #7c3aed;
--purple-bg: #f5f3ff;
--purple-border: #ddd6fe;
--topbar-bg: rgba(15, 23, 42, 0.94);
--nav-bg: rgba(255, 255, 255, 0.92);
--dark-card: linear-gradient(135deg, #0b1220 0%, #16243d 52%, #0f4c4a 100%);
--radius: 18px;
--radius-sm: 12px;
--shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
--shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
--shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.16);
--nav-height: 68px;
}
body.dark-theme {
--bg: #090e1a;
--bg-accent: radial-gradient(circle at top right, rgba(20, 184, 166, 0.10), transparent 48%);
--surface: #111827;
--surface-2: #1a2334;
--surface-hover: #222e44;
--border: rgba(148, 163, 184, 0.16);
--border-strong: rgba(148, 163, 184, 0.28);
--text: #f1f5f9;
--text-secondary: #cbd5e1;
--text-muted: #94a3b8;
--primary: #14b8a6;
--primary-dark: #0d9488;
--primary-light: rgba(20, 184, 166, 0.18);
--primary-soft: rgba(20, 184, 166, 0.15);
--credit: #34d399;
--credit-bg: rgba(16, 185, 129, 0.13);
--credit-border: rgba(52, 211, 153, 0.30);
--debit: #f87171;
--debit-bg: rgba(239, 68, 68, 0.13);
--debit-border: rgba(248, 113, 113, 0.30);
--amber: #fbbf24;
--amber-bg: rgba(245, 158, 11, 0.13);
--amber-border: rgba(251, 191, 36, 0.30);
--amber-text: #fde68a;
--blue: #60a5fa;
--blue-bg: rgba(59, 130, 246, 0.14);
--blue-border: rgba(96, 165, 250, 0.30);
--purple: #a78bfa;
--purple-bg: rgba(139, 92, 246, 0.15);
--purple-border: rgba(167, 139, 250, 0.30);
--topbar-bg: rgba(9, 14, 26, 0.94);
--nav-bg: rgba(17, 24, 39, 0.94);
--dark-card: linear-gradient(135deg, #0d1b2a 0%, #152a45 50%, #0f4c4a 100%);
--shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
--shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
--shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.55);
}
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}
html, body {
margin: 0;
padding: 0;
font-family: 'Vazirmatn', 'IRANSans', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
background-color: var(--bg);
background-image: var(--bg-accent);
background-attachment: fixed;
color: var(--text);
font-size: 14px;
line-height: 1.65;
min-height: 100vh;
transition: background-color 0.2s ease, color 0.2s ease;
}
body.modal-open {
overflow: hidden;
}
button, input, select, textarea {
font-family: inherit;
font-size: inherit;
}
svg.ico-svg {
width: 18px;
height: 18px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
flex-shrink: 0;
}
svg.ico-svg-sm { width: 15px; height: 15px; }
svg.ico-svg-lg { width: 22px; height: 22px; }
.app-shell {
max-width: 680px;
margin: 0 auto;
min-height: 100vh;
padding-bottom: calc(var(--nav-height) + 88px + env(safe-area-inset-bottom, 0px));
}
.topbar {
position: sticky;
top: 0;
z-index: 40;
background: var(--topbar-bg);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
color: #fff;
padding: 11px 14px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
border-bottom: 1px solid rgba(255,255,255,0.08);
box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
}
.topbar-title {
display: flex;
align-items: center;
gap: 9px;
min-width: 0;
flex: 1;
}
.topbar-brand-dot {
width: 34px;
height: 34px;
border-radius: 11px;
background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
display: inline-flex;
align-items: center;
justify-content: center;
color: #fff;
flex-shrink: 0;
box-shadow: 0 4px 12px rgba(20, 184, 166, 0.35);
}
.topbar-title-text {
min-width: 0;
}
.topbar-title h1 {
margin: 0;
font-size: 15.5px;
font-weight: 800;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
letter-spacing: -0.01em;
}
.topbar-subtitle {
font-size: 11px;
color: #94a3b8;
display: block;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.topbar-actions {
display: flex;
align-items: center;
gap: 5px;
flex-shrink: 0;
}
.btn-icon {
border: 1px solid rgba(255,255,255,0.10);
background: rgba(255,255,255,0.09);
color: #e2e8f0;
width: 36px;
height: 36px;
border-radius: 11px;
display: inline-flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
font-size: 15px;
transition: background 0.15s, transform 0.1s;
}
.btn-icon:hover { background: rgba(255,255,255,0.16); color: #fff; }
.btn-icon:active { transform: scale(0.93); }
.sync-pill {
font-size: 10.5px;
font-weight: 700;
padding: 4px 8px;
border-radius: 999px;
background: rgba(16, 185, 129, 0.16);
border: 1px solid rgba(52, 211, 153, 0.25);
color: #6ee7b7;
white-space: nowrap;
display: inline-flex;
align-items: center;
gap: 4px;
}
.sync-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: #34d399;
box-shadow: 0 0 6px #34d399;
}
@media (max-width: 400px) {
.sync-pill #sync-status-text { display: none; }
.sync-pill { padding: 6px; }
}
.backup-banner {
background: var(--amber-bg);
border: 1px solid var(--amber-border);
color: var(--amber-text);
border-radius: 14px;
padding: 10px 12px;
margin-bottom: 12px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
flex-wrap: wrap;
font-size: 12px;
}
.backup-banner-actions {
display: flex;
gap: 6px;
align-items: center;
}
.container {
padding: 14px 14px 10px;
animation: fadeInView 0.16s ease-out;
}
@keyframes fadeInView {
from { opacity: 0.75; transform: translateY(4px); }
to { opacity: 1; transform: translateY(0); }
}
.card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 14px;
box-shadow: var(--shadow-sm);
margin-bottom: 12px;
}
.section-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 12px;
gap: 8px;
}
.section-title {
margin: 0;
font-size: 15px;
font-weight: 800;
color: var(--text);
display: inline-flex;
align-items: center;
gap: 6px;
}
.btn {
border: none;
border-radius: var(--radius-sm);
padding: 10px 14px;
min-height: 40px;
font-weight: 700;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
font-size: 13px;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
color: #fff;
box-shadow: 0 4px 12px rgba(13, 148, 136, 0.24);
}
.btn-primary:hover { filter: brightness(1.04); }
.btn-secondary {
background: var(--surface-2);
color: var(--text);
border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-hover); }
.btn-danger { background: var(--debit-bg); color: var(--debit); border: 1px solid var(--debit-border); }
.btn-credit { background: var(--credit-bg); color: var(--credit); border: 1px solid var(--credit-border); }
.btn-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.btn-amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.btn-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.btn-sm { padding: 6px 10px; min-height: 34px; font-size: 12px; border-radius: 9px; }
.btn-xs { padding: 4px 9px; min-height: 29px; font-size: 11px; border-radius: 8px; }
.btn-block { width: 100%; }
.form-group {
margin-bottom: 12px;
}
.form-label {
display: flex;
align-items: center;
justify-content: space-between;
font-size: 12px;
font-weight: 700;
color: var(--text-secondary);
margin-bottom: 5px;
gap: 6px;
}
.form-control {
width: 100%;
padding: 10px 12px;
min-height: 42px;
border: 1.5px solid var(--border);
border-radius: var(--radius-sm);
background: var(--surface);
color: var(--text);
outline: none;
transition: border-color 0.15s, box-shadow 0.15s;
}
.form-control:focus {
border-color: var(--primary);
box-shadow: 0 0 0 3px var(--primary-soft);
}
.form-control.invalid {
border-color: var(--debit);
background: var(--debit-bg);
}
.input-ltr {
direction: ltr;
text-align: left;
font-variant-numeric: tabular-nums;
}
.date-hint {
font-size: 11px;
margin-top: 3px;
min-height: 16px;
}
.date-hint.err { color: var(--debit); font-weight: 700; }
.date-hint.ok { color: var(--credit); }
.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.grid-3 {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
}
.search-box {
position: relative;
margin-bottom: 12px;
}
.search-box input {
padding-right: 38px;
padding-left: 34px;
border-radius: 14px;
background: var(--surface);
}
.search-box .search-ico {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
color: var(--text-muted);
pointer-events: none;
display: inline-flex;
}
.search-clear-btn {
position: absolute;
left: 8px;
top: 50%;
transform: translateY(-50%);
width: 24px;
height: 24px;
border-radius: 50%;
border: none;
background: var(--surface-hover);
color: var(--text-muted);
font-size: 12px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
}
.kpi-strip {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-bottom: 12px;
}
.kpi-mini {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 9px 10px;
text-align: center;
box-shadow: var(--shadow-sm);
}
.kpi-mini-val {
font-size: 15px;
font-weight: 800;
color: var(--text);
font-variant-numeric: tabular-nums;
line-height: 1.3;
}
.kpi-mini-lbl {
font-size: 10.5px;
color: var(--text-muted);
font-weight: 600;
}
.cp-item {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 13px 14px;
margin-bottom: 10px;
cursor: pointer;
box-shadow: var(--shadow-sm);
transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
}
.cp-item:hover {
border-color: var(--border-strong);
box-shadow: var(--shadow);
}
.cp-item:active { transform: scale(0.988); border-color: var(--primary); }
.cp-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
gap: 10px;
}
.cp-ident {
display: flex;
align-items: center;
gap: 10px;
min-width: 0;
}
.cp-avatar {
width: 40px;
height: 40px;
border-radius: 13px;
color: #fff;
font-size: 16px;
font-weight: 800;
display: inline-flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
}
.cp-name {
font-size: 14.5px;
font-weight: 800;
color: var(--text);
line-height: 1.35;
}
.cp-meta {
font-size: 11px;
color: var(--text-muted);
}
.chip-list {
display: flex;
flex-wrap: wrap;
gap: 6px;
}
.balance-chip {
font-size: 12px;
font-weight: 700;
padding: 4px 9px;
border-radius: 9px;
display: inline-flex;
align-items: center;
gap: 5px;
font-variant-numeric: tabular-nums;
}
.balance-chip.credit { background: var(--credit-bg); color: var(--credit); border: 1px solid var(--credit-border); }
.balance-chip.debit { background: var(--debit-bg); color: var(--debit); border: 1px solid var(--debit-border); }
.balance-chip.zero { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.hero-card {
background: var(--dark-card);
color: #fff;
border-radius: 22px;
padding: 18px 16px 16px;
margin-bottom: 12px;
box-shadow: var(--shadow-lg);
position: relative;
overflow: hidden;
}
.hero-card::before {
content: '';
position: absolute;
top: -40px;
left: -40px;
width: 140px;
height: 140px;
border-radius: 50%;
background: radial-gradient(circle, rgba(45, 212, 191, 0.18), transparent 70%);
pointer-events: none;
}
.hero-card::after {
content: '';
position: absolute;
bottom: -50px;
right: -30px;
width: 160px;
height: 160px;
border-radius: 50%;
background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
pointer-events: none;
}
.hero-top {
position: relative;
z-index: 1;
display: flex;
justify-content: space-between;
align-items: flex-start;
border-bottom: 1px solid rgba(255,255,255,0.12);
padding-bottom: 12px;
margin-bottom: 12px;
gap: 10px;
}
.hero-name {
font-size: 18px;
font-weight: 800;
margin: 0;
}
.hero-date {
font-size: 11px;
color: #94a3b8;
margin-top: 2px;
}
.hero-badge {
font-size: 10.5px;
font-weight: 700;
background: rgba(255,255,255,0.11);
border: 1px solid rgba(255,255,255,0.14);
padding: 4px 10px;
border-radius: 999px;
color: #e2e8f0;
white-space: nowrap;
}
.hero-row {
position: relative;
z-index: 1;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 12px;
border-radius: 13px;
background: rgba(255,255,255,0.075);
border: 1px solid rgba(255,255,255,0.08);
margin-bottom: 7px;
gap: 8px;
}
.hero-row:last-child { margin-bottom: 0; }
.hero-cur {
font-weight: 700;
font-size: 13.5px;
color: #f8fafc;
}
.hero-val {
text-align: left;
direction: ltr;
font-weight: 800;
font-size: 16px;
font-variant-numeric: tabular-nums;
letter-spacing: 0.01em;
}
.hero-status {
font-size: 10.5px;
padding: 2px 8px;
border-radius: 7px;
font-weight: 700;
margin-right: 6px;
}
.hero-status.credit { background: rgba(16, 185, 129, 0.22); color: #6ee7b7; }
.hero-status.debit { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
.hero-status.zero { background: rgba(148, 163, 184, 0.20); color: #cbd5e1; }
.export-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 7px;
margin-bottom: 11px;
}
.export-btn {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 9px 4px;
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
cursor: pointer;
font-size: 11px;
font-weight: 700;
color: var(--text);
box-shadow: var(--shadow-sm);
transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
.export-btn:hover { border-color: var(--primary); background: var(--surface-2); }
.export-btn:active { transform: scale(0.95); }
.export-btn .exp-ico-wrap {
width: 30px;
height: 30px;
border-radius: 9px;
display: inline-flex;
align-items: center;
justify-content: center;
background: var(--primary-soft);
color: var(--primary);
}
.hscroll-bar {
display: flex;
align-items: center;
gap: 6px;
overflow-x: auto;
padding: 2px 1px 6px;
margin-bottom: 8px;
scrollbar-width: none;
-ms-overflow-style: none;
}
.hscroll-bar::-webkit-scrollbar { display: none; }
.hscroll-bar > * { flex-shrink: 0; }
.filter-toolbar {
display: flex;
align-items: center;
gap: 7px;
margin-bottom: 10px;
}
.filter-toolbar .search-box {
flex: 1;
margin-bottom: 0;
}
.filter-toggle-btn {
height: 42px;
padding: 0 12px;
border-radius: 14px;
border: 1.5px solid var(--border);
background: var(--surface);
color: var(--text);
font-size: 12px;
font-weight: 700;
display: inline-flex;
align-items: center;
gap: 5px;
cursor: pointer;
white-space: nowrap;
flex-shrink: 0;
}
.filter-toggle-btn.active {
border-color: var(--primary);
background: var(--primary-soft);
color: var(--primary);
}
.tx-card {
background: var(--surface);
border: 1px solid var(--border);
border-right: 3.5px solid var(--border-strong);
border-radius: 15px;
padding: 12px 13px;
margin-bottom: 10px;
position: relative;
box-shadow: var(--shadow-sm);
}
.tx-card.deal-card { border-right-color: var(--blue); }
.tx-card.transfer-card { border-right-color: var(--primary); }
.tx-card.opening-card { border-right-color: var(--amber); }
.tx-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 7px;
gap: 6px;
flex-wrap: wrap;
}
.tx-tag {
font-size: 11px;
font-weight: 800;
padding: 3px 9px;
border-radius: 8px;
display: inline-flex;
align-items: center;
gap: 4px;
}
.tx-tag.deal { background: var(--blue-bg); color: var(--blue); }
.tx-tag.transfer { background: var(--primary-soft); color: var(--primary); }
.tx-tag.opening { background: var(--amber-bg); color: var(--amber); }
.tx-id {
font-size: 11px;
color: var(--text-muted);
font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
direction: ltr;
}
.tx-desc {
font-size: 13.5px;
font-weight: 700;
margin-bottom: 7px;
color: var(--text);
line-height: 1.55;
}
.tx-effects {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 6px;
}
.tx-note {
font-size: 12px;
color: var(--text-secondary);
background: var(--surface-2);
border: 1px solid var(--border);
padding: 6px 10px;
border-radius: 9px;
margin-top: 6px;
}
.tx-actions {
display: flex;
justify-content: flex-end;
gap: 6px;
margin-top: 9px;
padding-top: 8px;
border-top: 1px dashed var(--border);
}
.segmented {
display: grid;
grid-template-columns: 1fr 1fr;
background: var(--surface-2);
border: 1px solid var(--border);
border-radius: 13px;
padding: 4px;
gap: 4px;
margin-bottom: 12px;
}
.seg-btn {
border: none;
background: transparent;
padding: 9px 8px;
border-radius: 10px;
font-weight: 700;
font-size: 12.5px;
color: var(--text-muted);
cursor: pointer;
transition: all 0.15s ease;
}
.seg-btn.active {
background: var(--primary);
color: #fff;
box-shadow: 0 3px 10px rgba(13, 148, 136, 0.28);
}
.seg-btn.active.sell { background: #0f766e; }
.seg-btn.active.buy { background: #1d4ed8; }
.seg-btn.active.receive { background: var(--credit); }
.seg-btn.active.pay { background: var(--debit); }
.preview-box {

saveState(countAsDataChange = false) {

}
const writeToStorage = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
try {
writeToStorage();
} catch (e) {
try {
if (Array.isArray(this.state.logs) && this.state.logs.length > 120) {
const recent = this.state.logs.slice(0, 120);
const olderDeletes = this.state.logs.slice(120).filter(l => l.action === 'delete' && !l.restored).slice(0, 40);
this.state.logs = recent.concat(olderDeletes);
writeToStorage();
this.toast('فضای حافظه فشرده‌سازی شد و اطلاعات ذخیره گردید.');
} else {
throw e;
}
} catch (e2) {
this.toast('خطا در ذخیره حافظه مرورگر! لطفاً فوراً پشتیبان JSON بگیرید.', true);
return false;
}

if (el) el.textContent = 'ذخیره شد ✓';

if (el) el.textContent = 'ذخیره محلی';
}, 1600);
return true;
},
shouldShowBackupBanner() {
const s = this.state.settings || {};
const now = Date.now();
if (s.backupSnoozeUntil && now < s.backupSnoozeUntil) return null;
const activeTxCount = this.state.transactions.filter(t => !t.deleted).length;
const activeCpCount = this.state.counterparties.filter(c => !c.deleted).length;
if (activeTxCount === 0 && activeCpCount === 0) return null;
const changes = s.changesSinceBackup || 0;
const changeLimit = s.backupReminderChanges || 10;
const hoursLimit = s.backupReminderHours || 48;
if (changes >= changeLimit) {
return `${changes} تغییر جدید از آخرین پشتیبان‌گیری ثبت شده است. برای جلوگیری از از دست رفتن اطلاعات، فایل پشتیبان بگیرید.`;
}
if (s.lastBackupAt > 0) {
const diffHours = (now - s.lastBackupAt) / (1000 * 60 * 60);
if (diffHours >= hoursLimit && changes > 0) {
return `بیش از ${Math.floor(diffHours)} ساعت از آخرین پشتیبان‌گیری گذشته و ${changes} تغییر جدید دارید.`;
}
} else if (activeTxCount >= 5) {
return `تاکنون فایل پشتیبان دانلود نکرده‌اید (${activeTxCount} تراکنش ثبت شده). همین الان یک نسخه پشتیبان ذخیره کنید.`;
}
return null;
},

addLog(action, title, details, snapshot = null, entityType = 'tx', meta = {}) {
const clone = (obj) => obj ? JSON.parse(JSON.stringify(obj)) : null;
const snapClone = clone(snapshot);
const beforeClone = clone(meta && meta.beforeSnapshot ? meta.beforeSnapshot : null);
const cpSet = new Set();
const addIdsFrom = (obj) => {
if (!obj) return;
if (Array.isArray(obj)) {
obj.forEach(item => {
if (item && item.cpId) cpSet.add(item.cpId);
if (item && item.offsetPeerCpId) cpSet.add(item.offsetPeerCpId);
});
} else {
if (entityType === 'cp' && obj.id) cpSet.add(obj.id);
if (obj.cpId) cpSet.add(obj.cpId);
if (obj.offsetPeerCpId) cpSet.add(obj.offsetPeerCpId);
}
};
if (meta && Array.isArray(meta.cpIds)) {
meta.cpIds.forEach(id => { if (id) cpSet.add(id); });
}
addIdsFrom(snapClone);
addIdsFrom(beforeClone);
this.state.logs.unshift({
id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
at: Jalali.nowDateTimeStr(),
action, // create | edit | delete | restore
title,
details,
entityType,
cpIds: Array.from(cpSet),
snapshot: snapClone,
beforeSnapshot: beforeClone,
editScope: (meta && meta.editScope) ? meta.editScope : '',
restored: false,
undone: false
});
if (this.state.logs.length > 500) this.state.logs.length = 500;
},
sortTransactions(txList, direction = 'desc') {
return [...txList].sort((a, b) => {
const ka = Jalali.toSortKey(a.date);
const kb = Jalali.toSortKey(b.date);
if (ka !== kb) {
return direction === 'desc' ? (kb - ka) : (ka - kb);
}
const typeRankA = a.type === 'opening' ? 0 : 1;
const typeRankB = b.type === 'opening' ? 0 : 1;
if (typeRankA !== typeRankB) {
return direction === 'desc' ? (typeRankB - typeRankA) : (typeRankA - typeRankB);
}
const ca = a.createdAt || 0;
const cb = b.createdAt || 0;
return direction === 'desc' ? (cb - ca) : (ca - cb);
});
},
orderBalanceMap(map, includeZeroCodes = null) {
const ordered = [];
const seen = new Set();
for (const cur of this.state.currencies) {
seen.add(cur.code);
const val = map[cur.code] ?? 0n;
const forceInclude = includeZeroCodes && includeZeroCodes.has(cur.code);
if (val !== 0n || forceInclude) {
ordered.push({ code: cur.code, micro: val });
}
}
for (const code of Object.keys(map)) {
if (!seen.has(code)) {
const val = map[code] ?? 0n;
const forceInclude = includeZeroCodes && includeZeroCodes.has(code);
if (val !== 0n || forceInclude) {
ordered.push({ code, micro: val });
}
}
}
return ordered;
},
getCounterpartyBalances(cpId) {
const map = {}; // code -> BigInt micro
const txs = this.state.transactions.filter(t => t.cpId === cpId && !t.deleted);
for (const tx of txs) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
map[ef.currency] = (map[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
return this.orderBalanceMap(map);
},
buildCounterpartyStatement(cpId) {
const allAsc = this.sortTransactions(
this.state.transactions.filter(t => t.cpId === cpId && !t.deleted),
'asc'
);
const runningMap = {};
const touchedRunningById = {};
const fullRunningById = {};
let lastSettlementIdx = -1;
allAsc.forEach((tx, idx) => {
if (tx.type === 'settlement') lastSettlementIdx = idx;
const touchedSet = new Set();
if (Array.isArray(tx.effects)) {
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
runningMap[ef.currency] = (runningMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
touchedSet.add(ef.currency);
}
}
const touchedMap = {};
touchedSet.forEach(c => { touchedMap[c] = runningMap[c] ?? 0n; });
touchedRunningById[tx.id] = this.orderBalanceMap(touchedMap, touchedSet);
fullRunningById[tx.id] = this.orderBalanceMap(runningMap);
});
const currentBalances = this.orderBalanceMap(runningMap);
const hasSettlement = lastSettlementIdx !== -1;
const lastSettlement = hasSettlement ? allAsc[lastSettlementIdx] : null;
let mode = this.ui.periodMode || 'all';
if (mode === 'since_settlement' && !hasSettlement) mode = 'all';
let beforePeriod = [];
let inPeriodAsc = allAsc;
let periodLabel = 'کل تاریخچه حساب';
let isFiltered = false;
if (mode === 'since_settlement' && hasSettlement) {
beforePeriod = allAsc.slice(0, lastSettlementIdx + 1);
inPeriodAsc = allAsc.slice(lastSettlementIdx + 1);
periodLabel = `از آخرین تسویه (${lastSettlement.date} • ${lastSettlement.id})`;
isFiltered = true;
} else if (mode === 'today' || mode === '7d' || mode === '30d' || mode === 'custom') {
let fromStr = '';
let toStr = '';
if (mode === 'today') {
fromStr = Jalali.todayStr();
toStr = fromStr;
periodLabel = `امروز (${fromStr})`;
} else if (mode === '7d') {
fromStr = Jalali.daysAgoStr(6);
toStr = Jalali.todayStr();
periodLabel = `۷ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === '30d') {
fromStr = Jalali.daysAgoStr(29);
toStr = Jalali.todayStr();
periodLabel = `۳۰ روز اخیر (${fromStr} تا ${toStr})`;
} else {
fromStr = Jalali.normalizeDate(this.ui.dateFrom) || '';
toStr = Jalali.normalizeDate(this.ui.dateTo) || '';
if (fromStr && toStr) periodLabel = `از ${fromStr} تا ${toStr}`;
else if (fromStr) periodLabel = `از تاریخ ${fromStr} به بعد`;
else if (toStr) periodLabel = `تا تاریخ ${toStr}`;
else periodLabel = 'بازه دلخواه (همه تاریخ‌ها)';
}
const fromKey = fromStr ? Jalali.toSortKey(fromStr) : 0;
const toKey = toStr ? Jalali.toSortKey(toStr) : 99999999;
if (fromKey > 0 || toKey < 99999999) {
isFiltered = true;
beforePeriod = allAsc.filter(t => Jalali.toSortKey(t.date) < fromKey);
inPeriodAsc = allAsc.filter(t => {
const k = Jalali.toSortKey(t.date);
return k >= fromKey && k <= toKey;
});
}
}
const bfMap = {};
for (const tx of beforePeriod) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
bfMap[ef.currency] = (bfMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
const broughtForward = this.orderBalanceMap(bfMap);
const endMap = { ...bfMap };
for (const tx of inPeriodAsc) {
if (!Array.isArray(tx.effects)) continue;
for (const ef of tx.effects) {
if (!ef || !ef.currency) continue;
endMap[ef.currency] = (endMap[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
const periodEndingBalances = this.orderBalanceMap(endMap);
return {
allAsc,
inPeriodAsc,
inPeriodDesc: [...inPeriodAsc].reverse(),
touchedRunningById,
fullRunningById,
currentBalances,
broughtForward,
periodEndingBalances,
hasSettlement,
lastSettlement,
isFiltered,
periodMode: mode,
periodLabel
};
},
setPeriodMode(mode) {
this.ui.periodMode = mode;
if (mode === 'custom') {
if (!this.ui.dateFrom) this.ui.dateFrom = Jalali.daysAgoStr(29);
if (!this.ui.dateTo) this.ui.dateTo = Jalali.todayStr();
}
this.render();
},
applyCustomPeriod() {
const fromEl = document.getElementById('flt-date-from');
const toEl = document.getElementById('flt-date-to');
const rawFrom = fromEl ? fromEl.value.trim() : '';
const rawTo = toEl ? toEl.value.trim() : '';
if (rawFrom && !Jalali.normalizeDate(rawFrom)) {
this.toast('تاریخ «از» معتبر نیست (مثلاً 1405/08/01).');
return;
}
if (rawTo && !Jalali.normalizeDate(rawTo)) {
this.toast('تاریخ «تا» معتبر نیست (مثلاً 1405/08/29).');
return;
}
const normFrom = rawFrom ? Jalali.normalizeDate(rawFrom) : '';
const normTo = rawTo ? Jalali.normalizeDate(rawTo) : '';
if (normFrom && normTo && Jalali.toSortKey(normFrom) > Jalali.toSortKey(normTo)) {
this.toast('تاریخ شروع نمی‌تواند بعد از تاریخ پایان باشد.');
return;
}
this.ui.periodMode = 'custom';
this.ui.dateFrom = normFrom;
this.ui.dateTo = normTo;
this.render();
},
getStatusText(val) {
const m = Dec.toMicro(val);
if (m > 0n) return 'طلبکار';
if (m < 0n) return 'بدهکار';
return 'تسویه';
},
getStatusClass(val) {
const m = Dec.toMicro(val);
if (m > 0n) return 'credit';
if (m < 0n) return 'debit';
return 'zero';
},
switchTab(tab) {
if (this.isClientMode()) return;
this.ui.activeTab = tab;
this.ui.selectedCpId = null;
this.render();
},
openCounterparty(cpId, initialTxSearch = '') {
if (!this.canAccessCounterparty(cpId)) return;
const targetCp = this.state.counterparties.find(c => c.id === cpId && !c.deleted);
if (!targetCp) {
this.toast('این طرف حساب حذف شده است (از تب لاگ تغییرات قابل بازیابی است).', true);
return;
}
this.ui.selectedCpId = cpId;
this.ui.txFilter = 'all';
this.ui.txSearchQuery = initialTxSearch || '';
this.ui.periodMode = 'all';
this.ui.showDetailFilters = false;
this.ui.dateFrom = '';
this.ui.dateTo = '';
this.render();
},
goBack() {
if (this.isClientMode()) return;
this.ui.selectedCpId = null;
this.render();
},
isClientMode() {
return this.session && this.session.role === 'client';
},
render() {
this.applyPrivacyClass();
const authScreen = document.getElementById('auth-screen');
const shell = document.getElementById('app-shell');
const nav = document.getElementById('bottom-nav');
const fab = document.getElementById('fab-quick');
const backBtn = document.getElementById('btn-back');
const lockBtn = document.getElementById('btn-lock');
const logoutBtn = document.getElementById('btn-logout-client');
const syncPill = document.getElementById('sync-status');

const subEl = document.getElementById('topbar-subtitle');
if (this.session.role === 'locked') {
this.renderAuthScreen();
return;
}
authScreen.classList.remove('open');
authScreen.innerHTML = '';
shell.style.display = 'block';
if (this.isClientMode()) {
const cp = this.state.counterparties.find(c => c.id === this.session.cpId && !c.deleted);
if (!cp) {
this.logoutSession();
return;
}
nav.style.display = 'none';
if (fab) fab.style.display = 'none';
backBtn.style.display = 'none';
const bmC = document.getElementById('brand-mark'); if (bmC) bmC.style.display = 'inline-flex';
lockBtn.style.display = 'none';
logoutBtn.style.display = 'inline-flex';
syncPill.style.display = 'none';
titleEl.textContent = cp.name;
subEl.textContent = `${this.state.settings.shopTitle || 'دفتر صرافی هوشمند'} • پورتال اختصاصی`;
this.renderCounterpartyDetail(cp, true);
return;
}
nav.style.display = 'flex';
if (fab) fab.style.display = 'inline-flex';
logoutBtn.style.display = 'none';
syncPill.style.display = 'inline-flex';
lockBtn.style.display = this.state.settings.adminPinHash ? 'inline-flex' : 'none';
document.querySelectorAll('.nav-item').forEach(btn => {
btn.classList.toggle('active', btn.dataset.tab === this.ui.activeTab && !this.ui.selectedCpId);
});
if (this.ui.selectedCpId) {
const cp = this.state.counterparties.find(c => c.id === this.ui.selectedCpId && !c.deleted);
if (!cp) {
this.ui.selectedCpId = null;
return this.render();
}
backBtn.style.display = 'inline-flex';
const bm = document.getElementById('brand-mark'); if (bm) bm.style.display = 'none';
titleEl.textContent = cp.name;
subEl.textContent = cp.phone ? `تلفن: ${cp.phone}` : 'پنل اختصاصی طرف حساب';
this.renderCounterpartyDetail(cp, false);
return;
}
backBtn.style.display = 'none';
const bm2 = document.getElementById('brand-mark'); if (bm2) bm2.style.display = 'inline-flex';
titleEl.textContent = this.state.settings.shopTitle || 'دفتر صرافی هوشمند';
if (this.ui.activeTab === 'accounts') {
subEl.textContent = `امروز ${Jalali.todayStr()}`;
this.renderAccountsList();
} else if (this.ui.activeTab === 'dashboard') {
subEl.textContent = 'تراز کل همه طرفین حساب';
this.renderDashboard();
} else if (this.ui.activeTab === 'logs') {
subEl.textContent = 'تاریخچه ثبت، ویرایش و حذف';
this.renderLogs();
} else if (this.ui.activeTab === 'settings') {
subEl.textContent = 'ارزها، امنیت، پورتال مشتریان و پشتیبان‌گیری';
this.renderSettings();
}
},

const activeTxCount = this.state.transactions.filter(t => !t.deleted).length;
const todayStr = Jalali.todayStr();

let html = `
${this.renderPrivacyBannerHtml()}
${this.renderBackupBannerHtml()}
${activeCps.length ? `
<div class="kpi-strip">

</div>

<div class="kpi-mini-lbl">ثبت‌های امروز</div>
</div>

<div class="kpi-mini-val">${activeTxCount}</div>

</div>
</div>
` : ''}
<div class="section-header">
<h2 class="section-title">طرفین حساب (${activeCps.length})</h2>
<div style="display:flex; gap:6px;">
${activeCps.length >= 2 ? `<button class="btn btn-sm btn-purple" onclick="app.openOffsetModal()" title="جابه‌جایی بین دو طرف حساب">🔄 تهاتر</button>` : ''}
<button class="btn btn-sm btn-primary" onclick="app.openNewCounterpartyModal()">＋ طرف حساب جدید</button>
</div>
</div>
<div class="search-box">
<span class="search-ico">${Icons.search}</span>
<input type="text" id="acc-search-input" class="form-control" placeholder="جستجوی نام، شماره تماس یا کد پیگیری فیش..." value="${escapeHtml(this.ui.searchQuery)}" oninput="app.ui.searchQuery=this.value; app.renderAccountsListOnly(); app.syncClearBtn('acc-search-clear', this.value)" />
<button type="button" id="acc-search-clear" class="search-clear-btn" style="display:${this.ui.searchQuery?'inline-flex':'none'}" onclick="app.ui.searchQuery=''; const el=document.getElementById('acc-search-input'); if(el){el.value=''; el.focus();} app.syncClearBtn('acc-search-clear',''); app.renderAccountsListOnly()">✕</button>
</div>
<div id="cp-list-wrap">
${this.buildAccountsSearchOutput()}
</div>
`;
document.getElementById('main-content').innerHTML = html;
},
syncClearBtn(btnId, val) {
const b = document.getElementById(btnId);
if (b) b.style.display = (val && val.length) ? 'inline-flex' : 'none';
},
renderAccountsListOnly() {
const wrap = document.getElementById('cp-list-wrap');
if (wrap) wrap.innerHTML = this.buildAccountsSearchOutput();
},
buildAccountsSearchOutput() {
const activeCps = this.state.counterparties.filter(c => !c.deleted);
const rawQ = (this.ui.searchQuery || '').trim();
const q = Num.toEnDigits(rawQ).toLowerCase();
const qOrig = rawQ.toLowerCase();
const filteredCps = !rawQ
? activeCps
: activeCps.filter(c =>
c.name.toLowerCase().includes(qOrig) ||
Num.toEnDigits(c.phone || '').toLowerCase().includes(q) ||
(c.note || '').toLowerCase().includes(qOrig)
);
let txMatchesHtml = '';
if (rawQ.length >= 2) {
const cpMap = {};
activeCps.forEach(c => { cpMap[c.id] = c; });
const matchedTxs = this.sortTransactions(
this.state.transactions.filter(t => {
if (t.deleted || !cpMap[t.cpId]) return false;
const ref = Num.toEnDigits(t.refCode || '').toLowerCase();
const tid = (t.id || '').toLowerCase();
const sum = (t.summary || '').toLowerCase();
const nt = (t.note || '').toLowerCase();
return ref.includes(q) || tid.includes(q) || sum.includes(qOrig) || nt.includes(qOrig);
}),
'desc'
).slice(0, 15);
if (matchedTxs.length) {
txMatchesHtml = `
<div style="margin-top:14px;">
<div style="font-size:12.5px; font-weight:800; color:#1e40af; margin-bottom:7px;">🧾 تراکنش‌ها و فیش‌های مرتبط (${matchedTxs.length}):</div>
${matchedTxs.map(t => {
const cp = cpMap[t.cpId];
const jumpKey = String(t.refCode || t.id || '').replace(/['"\\]/g, '');
return `
<div class="global-tx-match" onclick="app.openCounterparty('${cp.id}', '${escapeHtml(jumpKey)}')">
<div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:3px;">
<strong style="font-size:13px;">${escapeHtml(cp.name)}</strong>
<span class="tx-id">${escapeHtml(t.id)} • ${escapeHtml(t.date)}</span>
</div>
${t.refCode ? `<div class="tx-ref-badge" style="margin-bottom:3px;">🧾 پیگیری: ${escapeHtml(t.refCode)}</div>` : ''}
<div style="font-size:12px; color:var(--text-secondary);">${escapeHtml(t.summary)}</div>
</div>
`;
}).join('')}
</div>
`;
}
}
if (!filteredCps.length && txMatchesHtml) {
return txMatchesHtml;
}
return this.buildAccountsListHtml(filteredCps) + txMatchesHtml;
},
buildAccountsListHtml(list) {
if (!list.length) {
return `
<div class="card empty-state">
<div class="big-ico">📒</div>
<div style="font-weight:800; color:var(--text); margin-bottom:4px;">هنوز طرف حسابی ثبت نشده است</div>
<div style="font-size:12.5px; margin-bottom:14px;">برای شروع، اولین طرف حساب را تعریف کنید (حتی می‌توانید مانده اولیه او را همان لحظه ثبت کنید).</div>
<button class="btn btn-primary" onclick="app.openNewCounterpartyModal()">＋ تعریف اولین طرف حساب</button>
</div>
`;
}
return list.map(cp => {
const balances = this.getCounterpartyBalances(cp.id);
const txCount = this.state.transactions.filter(t => t.cpId === cp.id && !t.deleted).length;
const chips = balances.length
? balances.map(b => {
const cur = this.getCurrency(b.code);
const cls = this.getStatusClass(b.micro);
const st = this.getStatusText(b.micro);
return `<span class="balance-chip ${cls}">
<span>${escapeHtml(cur.name)}:</span>

<span style="font-size:10.5px; opacity:0.85">(${st})</span>
</span>`;
}).join('')
: `<span class="balance-chip zero">تسویه (بدون مانده)</span>`;
return `
<div class="cp-item" onclick="app.openCounterparty('${cp.id}')">
<div class="cp-header">
<div class="cp-ident">
<span class="cp-avatar" style="background:${Avatar.bgFor(cp.name)}">${escapeHtml(Avatar.initial(cp.name))}</span>
<div style="min-width:0;">
<div class="cp-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
<span>${escapeHtml(cp.name)}</span>
${cp.portal && cp.portal.enabled ? `<span class="portal-badge">🔑 پورتال</span>` : ''}
</div>
<div class="cp-meta">${txCount} ثبت فعال ${cp.phone ? ' • ' + escapeHtml(cp.phone) : ''}</div>

</div>
<span style="color:var(--text-muted); display:inline-flex;">${Icons.chevLeft}</span>
</div>
<div class="chip-list">${chips}</div>
</div>
`;
}).join('');
},
renderCounterpartyDetail(cp, readOnly = false) {
const stmt = this.buildCounterpartyStatement(cp.id);
const balances = stmt.currentBalances;
const periodTxs = stmt.inPeriodDesc;
let filteredTxs = this.ui.txFilter === 'all'
? periodTxs
: periodTxs.filter(t => t.type === this.ui.txFilter);

const tid = (t.id || '').toLowerCase();
const dt = Num.toEnDigits(t.date || '').toLowerCase();
const nt = (t.note || '').toLowerCase();

});

: `<div class="hero-row" style="justify-content:center; color:#cbd5e1;">همه حساب‌ها تسویه (صفر) است</div>`;

if (stmt.isFiltered) {
const bfChips = stmt.broughtForward.length
? stmt.broughtForward.map(b => {

return `<span class="balance-chip ${cls}">

<span style="font-size:10px;">(${st})</span>
</span>`;
}).join('')
: `<span class="balance-chip zero">صفر (تسویه در ابتدای بازه)</span>`;
bfHtml = `
<div class="brought-forward-card">

getBaseCurrencyCode() {
const pref = this.state.settings.baseCurrency || 'IRT';
if (this.state.currencies.some(c => c.code === pref)) return pref;
return this.state.currencies[0]?.code || 'IRT';
},
getMarketRateMicro(curCode, baseCode = null) {
const base = baseCode || this.getBaseCurrencyCode();
if (curCode === base) return Dec.SCALE; // 1.000000
const mr = this.state.marketRates || {};
const direct = mr[`${base}__${curCode}`];
if (direct && Dec.toMicro(direct.rate) > 0n) {
return Dec.toMicro(direct.rate);
}
return 0n;
},
convertToBaseMicro(amountMicro, curCode, baseCode = null) {
const base = baseCode || this.getBaseCurrencyCode();
if (curCode === base) return { ok: true, baseMicro: amountMicro, rateMicro: Dec.SCALE };
const rateMicro = this.getMarketRateMicro(curCode, base);
if (rateMicro <= 0n) return { ok: false, baseMicro: 0n, rateMicro: 0n };
return { ok: true, baseMicro: Dec.mulMicro(amountMicro, rateMicro), rateMicro };
},
computeDashboardData() {
const baseCode = this.getBaseCurrencyCode();
const activeCps = this.state.counterparties.filter(c => !c.deleted);
const totals = {};
for (const cur of this.state.currencies) {
totals[cur.code] = { receivables: 0n, payables: 0n, net: 0n };
}
for (const cp of activeCps) {
const balances = this.getCounterpartyBalances(cp.id);
for (const b of balances) {
if (!totals[b.code]) totals[b.code] = { receivables: 0n, payables: 0n, net: 0n };
if (b.micro < 0n) {
totals[b.code].receivables += Dec.abs(b.micro);
} else if (b.micro > 0n) {
totals[b.code].payables += b.micro;
}
totals[b.code].net = totals[b.code].receivables - totals[b.code].payables;
}
}
let totalRecBase = 0n;
let totalPayBase = 0n;
let totalNetBase = 0n;
const missingRateCodes = [];
for (const code of Object.keys(totals)) {
const t = totals[code];
const hasActivity = t.receivables !== 0n || t.payables !== 0n;
const convRec = this.convertToBaseMicro(t.receivables, code, baseCode);
const convPay = this.convertToBaseMicro(t.payables, code, baseCode);
const convNet = this.convertToBaseMicro(t.net, code, baseCode);
t.hasRate = convNet.ok;
t.rateMicro = convNet.rateMicro;
t.netBase = convNet.baseMicro;
if (hasActivity) {
if (convNet.ok) {
totalRecBase += convRec.baseMicro;
totalPayBase += convPay.baseMicro;
totalNetBase += convNet.baseMicro;
} else {
missingRateCodes.push(code);
}
}
}
return { baseCode, totals, totalRecBase, totalPayBase, totalNetBase, missingRateCodes, activeCpCount: activeCps.length };
},
computeFeeAndSpreadReport() {
const baseCode = this.getBaseCurrencyCode();
const activeCpSet = new Set(this.state.counterparties.filter(c => !c.deleted).map(c => c.id));
const mode = this.ui.reportPeriodMode || 'all';
let fromStr = '';
let toStr = '';
let periodLabel = 'کل تاریخچه';
if (mode === 'today') {
fromStr = Jalali.todayStr();
toStr = fromStr;
periodLabel = `امروز (${fromStr})`;
} else if (mode === '7d') {
fromStr = Jalali.daysAgoStr(6);
toStr = Jalali.todayStr();
periodLabel = `۷ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === '30d') {
fromStr = Jalali.daysAgoStr(29);
toStr = Jalali.todayStr();
periodLabel = `۳۰ روز اخیر (${fromStr} تا ${toStr})`;
} else if (mode === 'custom') {
fromStr = Jalali.normalizeDate(this.ui.reportDateFrom) || '';
toStr = Jalali.normalizeDate(this.ui.reportDateTo) || '';
if (fromStr && toStr) periodLabel = `از ${fromStr} تا ${toStr}`;
else if (fromStr) periodLabel = `از ${fromStr} به بعد`;
else if (toStr) periodLabel = `تا ${toStr}`;
else periodLabel = 'بازه دلخواه (همه تاریخ‌ها)';
}
const fromKey = fromStr ? Jalali.toSortKey(fromStr) : 0;
const toKey = toStr ? Jalali.toSortKey(toStr) : 99999999;
const txs = this.state.transactions.filter(t => {
if (t.deleted || !activeCpSet.has(t.cpId)) return false;
if (fromKey > 0 || toKey < 99999999) {
const k = Jalali.toSortKey(t.date);
if (k < fromKey || k > toKey) return false;
}
return true;
});
const feesByCur = {}; // code -> { totalMicro, count }
const pairStats = {}; // cur1__cur2 -> { cur1, cur2, sellVol1, sellVol2, sellCount, buyVol1, buyVol2, buyCount }
let dealCount = 0;
let transferCount = 0;
let offsetCount = 0;
for (const tx of txs) {
if (tx.type === 'deal') dealCount++;
else if (tx.type === 'transfer') transferCount++;
else if (tx.type === 'offset' && tx.offsetRole === 'from') offsetCount++;
const feeMicro = Dec.toMicro(tx.fee || 0);
if (feeMicro > 0n && (tx.type === 'deal' || tx.type === 'transfer')) {
const fCur = tx.feeCurrency || tx.currency1;
if (fCur) {
if (!feesByCur[fCur]) feesByCur[fCur] = { totalMicro: 0n, count: 0 };
feesByCur[fCur].totalMicro += feeMicro;
feesByCur[fCur].count += 1;
}
}
if (tx.type === 'deal' && tx.currency1 && tx.currency2) {
const amt1 = Dec.toMicro(tx.amount1 || 0);
const rateM = Dec.toMicro(tx.rate || 0);
if (amt1 > 0n && rateM > 0n) {
const base2 = tx.op === 'div' ? Dec.divMicro(amt1, rateM) : Dec.mulMicro(amt1, rateM);
const idx1 = this.state.currencies.findIndex(c => c.code === tx.currency1);
const idx2 = this.state.currencies.findIndex(c => c.code === tx.currency2);
const ord1 = idx1 === -1 ? 999 : idx1;
const ord2 = idx2 === -1 ? 999 : idx2;
const flip = ord1 > ord2 || (ord1 === ord2 && tx.currency1 > tx.currency2);
const c1 = flip ? tx.currency2 : tx.currency1;
const c2 = flip ? tx.currency1 : tx.currency2;
const vol1 = flip ? base2 : amt1;
const vol2 = flip ? amt1 : base2;
const effSide = flip ? (tx.side === 'sell' ? 'buy' : 'sell') : tx.side;
const key = `${c1}__${c2}`;
if (!pairStats[key]) {
pairStats[key] = {
cur1: c1,
cur2: c2,
sellVol1: 0n, sellVol2: 0n, sellCount: 0,
buyVol1: 0n, buyVol2: 0n, buyCount: 0
};
}
const ps = pairStats[key];
if (effSide === 'sell') {
ps.sellVol1 += vol1;
ps.sellVol2 += vol2;
ps.sellCount += 1;
} else {
ps.buyVol1 += vol1;
ps.buyVol2 += vol2;
ps.buyCount += 1;
}
}
}
}
let totalFeesBase = 0n;
let missingFeeRates = 0;
const feeRows = Object.keys(feesByCur).map(code => {
const item = feesByCur[code];
const conv = this.convertToBaseMicro(item.totalMicro, code, baseCode);
if (conv.ok) totalFeesBase += conv.baseMicro;
else missingFeeRates++;
return { code, totalMicro: item.totalMicro, count: item.count, hasRate: conv.ok, baseMicro: conv.baseMicro };
});
let totalSpreadBase = 0n;
let missingSpreadRates = 0;
const pairRows = Object.values(pairStats).map(ps => {
const avgSell = ps.sellVol1 > 0n ? Dec.divMicro(ps.sellVol2, ps.sellVol1) : 0n;
const avgBuy = ps.buyVol1 > 0n ? Dec.divMicro(ps.buyVol2, ps.buyVol1) : 0n;
const matchedVol1 = (ps.sellVol1 > 0n && ps.buyVol1 > 0n)
? (ps.sellVol1 < ps.buyVol1 ? ps.sellVol1 : ps.buyVol1)
: 0n;
const spreadProfitCur2 = matchedVol1 > 0n ? Dec.mulMicro(matchedVol1, avgSell - avgBuy) : 0n;
const convSpread = this.convertToBaseMicro(spreadProfitCur2, ps.cur2, baseCode);
if (matchedVol1 > 0n) {
if (convSpread.ok) totalSpreadBase += convSpread.baseMicro;
else missingSpreadRates++;
}
return {
...ps,
avgSell,
avgBuy,
matchedVol1,
spreadProfitCur2,
hasSpreadBase: convSpread.ok,
spreadBase: convSpread.baseMicro
};
});
return {
baseCode,
periodMode: mode,
periodLabel,
dealCount,
transferCount,
offsetCount,
feeRows,
totalFeesBase,
missingFeeRates,
pairRows,
totalSpreadBase,
missingSpreadRates,
combinedProfitBase: totalFeesBase + totalSpreadBase
};

logMatchesCounterparty(log, cpId) {
if (!cpId || cpId === 'all') return true;
if (Array.isArray(log.cpIds) && log.cpIds.includes(cpId)) return true;
if (log.snapshot) {
if (Array.isArray(log.snapshot) && log.snapshot.some(s => s && (s.cpId === cpId || s.offsetPeerCpId === cpId))) return true;
if (log.entityType === 'cp' && log.snapshot.id === cpId) return true;
if (log.snapshot.cpId === cpId || log.snapshot.offsetPeerCpId === cpId) return true;
}
const cp = this.state.counterparties.find(c => c.id === cpId);
if (cp && cp.name) {
const haystack = `${log.title || ''} ${log.details || ''}`;
if (haystack.includes(cp.name)) return true;
}
return false;
},
getFilteredLogs() {
const allLogs = this.state.logs || [];
const act = this.ui.logFilterAction || 'all';
const cpId = this.ui.logFilterCpId || 'all';
const qRaw = (this.ui.logSearchQuery || '').trim();
const qEn = Num.toEnDigits(qRaw).toLowerCase();
const qOrig = qRaw.toLowerCase();
return allLogs.filter(log => {
if (act !== 'all' && log.action !== act) return false;
if (!this.logMatchesCounterparty(log, cpId)) return false;
if (qRaw) {
const hay = `${log.title || ''} ${log.details || ''} ${log.at || ''} ${log.id || ''}`;
const hayLower = hay.toLowerCase();
const hayEn = Num.toEnDigits(hay).toLowerCase();
if (!hayLower.includes(qOrig) && !hayEn.includes(qEn)) return false;
}
return true;
});
},
formatSnapBrief(snap, entityType) {
if (!snap) return '';
if (entityType === 'offset_pair' && Array.isArray(snap)) {
const legA = snap.find(s => s.offsetRole === 'from') || snap[0];
if (!legA) return '';
const extras = [
legA.date ? `تاریخ: ${legA.date}` : '',
legA.refCode ? `پیگیری: ${legA.refCode}` : '',
legA.note ? `شرح: ${legA.note}` : ''
].filter(Boolean).join(' • ');
return `${legA.summary || ''}${extras ? ` (${extras})` : ''}`;
}
if (entityType === 'cp') {
const parts = [
`نام: ${snap.name || '—'}`,
snap.phone ? `تلفن: ${snap.phone}` : '',
snap.note ? `توضیح: ${snap.note}` : '',
snap.portal ? `پورتال: ${snap.portal.enabled ? 'فعال (' + (snap.portal.username || '') + ')' : 'غیرفعال'}` : ''
].filter(Boolean);
return parts.join(' • ');
}
const extras = [
snap.date ? `تاریخ: ${snap.date}` : '',
snap.refCode ? `پیگیری: ${snap.refCode}` : '',
snap.note ? `توضیح: ${snap.note}` : ''
].filter(Boolean).join(' • ');
return `${snap.summary || ''}${extras ? ` (${extras})` : ''}`;
},
buildLogsListHtml(filtered) {

}
return filtered.map(log => {
const b = badgeMap[log.action] || { text: log.action, cls: 'zero' };
const canRestoreDelete = log.action === 'delete' && !log.restored && log.snapshot;

let diffHtml = '';
if (log.action === 'edit' && log.beforeSnapshot && log.snapshot) {

</div>
` : ''}
${log.restored ? `<div style="margin-top:6px; font-size:11px; color:var(--credit); font-weight:700;">✓ این مورد حذف‌شده قبلاً بازیابی شده است</div>` : ''}

</div>

}).join('');
},

undoEditFromLog(logId) {
if (!this.requireAdmin()) return;
const log = this.state.logs.find(l => l.id === logId);
if (!log || log.action !== 'edit' || !log.beforeSnapshot || log.undone) return;
const before = JSON.parse(JSON.stringify(log.beforeSnapshot));
if (log.entityType === 'tx') {
const idx = this.state.transactions.findIndex(t => t.id === before.id);
if (idx !== -1 && this.state.transactions[idx].deleted) {
this.toast('این تراکنش پس از ویرایش حذف شده است؛ ابتدا از همین تب آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا این ویرایش به نسخه قبلی خود برگردانده شود؟ مانده حساب‌ها به‌طور خودکار اصلاح می‌شوند.')) return;
const currentSnap = idx !== -1 ? JSON.parse(JSON.stringify(this.state.transactions[idx])) : null;
if (idx !== -1) {
this.state.transactions[idx] = before;
} else {
this.state.transactions.push(before);
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش ${before.id}`,
`برگردانده شد به نسخه قبل: ${before.summary || ''}`,
before,
'tx',
{ beforeSnapshot: currentSnap, cpIds: [before.cpId] }
);
this.saveState(true);
this.toast('ویرایش با موفقیت به نسخه قبل برگردانده شد و بالانس اصلاح گردید.');
this.renderLogs();
} else if (log.entityType === 'offset_pair' && Array.isArray(before)) {
const anyDeleted = before.some(leg => {
const cur = this.state.transactions.find(t => t.id === leg.id);
return cur && cur.deleted;
});
if (anyDeleted) {
this.toast('این تهاتر سه‌جانبه حذف شده است؛ ابتدا آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا هر دو طرف این تهاتر به نسخه قبل از ویرایش برگردانده شوند؟')) return;
const cpIds = new Set();
const currentPair = [];
for (const legBefore of before) {
if (legBefore.cpId) cpIds.add(legBefore.cpId);
const idx = this.state.transactions.findIndex(t => t.id === legBefore.id);
if (idx !== -1) {
currentPair.push(JSON.parse(JSON.stringify(this.state.transactions[idx])));
if (this.state.transactions[idx].cpId) cpIds.add(this.state.transactions[idx].cpId);
this.state.transactions[idx] = legBefore;
} else {
this.state.transactions.push(legBefore);
}
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش تهاتر ${before[0]?.offsetGroupId || ''}`,
`هر دو طرف تهاتر به نسخه قبل برگردانده شدند.`,
before,
'offset_pair',
{ beforeSnapshot: currentPair, cpIds: Array.from(cpIds) }
);
this.saveState(true);
this.toast('هر دو طرف تهاتر سه‌جانبه به نسخه قبل از ویرایش برگردانده شدند.');
this.renderLogs();
} else if (log.entityType === 'cp') {
const idx = this.state.counterparties.findIndex(c => c.id === before.id);
if (idx !== -1 && this.state.counterparties[idx].deleted) {
this.toast('این طرف حساب حذف شده است؛ ابتدا آن را بازیابی کنید.', true);
return;
}
if (!confirm('آیا این ویرایش طرف حساب به نسخه قبل برگردانده شود؟')) return;
const currentSnap = idx !== -1 ? JSON.parse(JSON.stringify(this.state.counterparties[idx])) : null;
if (idx !== -1) {
if (log.editScope === 'profile') {
this.state.counterparties[idx].name = before.name;
this.state.counterparties[idx].phone = before.phone;
this.state.counterparties[idx].note = before.note;
} else if (log.editScope === 'portal') {
this.state.counterparties[idx].portal = before.portal || undefined;
} else {
this.state.counterparties[idx] = before;
}
} else {
this.state.counterparties.push(before);
}
log.undone = true;
this.addLog(
'restore',
`بازگشت ویرایش طرف حساب: ${before.name}`,
`به نسخه قبل برگردانده شد.`,
idx !== -1 ? this.state.counterparties[idx] : before,
'cp',
{ beforeSnapshot: currentSnap, cpIds: [before.id] }
);
this.saveState(true);
this.toast('تغییر طرف حساب به نسخه قبل برگردانده شد.');
this.renderLogs();
}
},
restoreFromLog(logId) {
if (!this.requireAdmin()) return;
const log = this.state.logs.find(l => l.id === logId);
if (!log || !log.snapshot) return;
if (log.entityType === 'tx') {
const existing = this.state.transactions.find(t => t.id === log.snapshot.id);
if (existing) {
existing.deleted = false;
} else {
const restoredTx = JSON.parse(JSON.stringify(log.snapshot));
restoredTx.deleted = false;
this.state.transactions.push(restoredTx);
}
log.restored = true;
this.addLog('restore', `بازیابی تراکنش ${log.snapshot.id}`, log.snapshot.summary || '', log.snapshot, 'tx', { cpIds: [log.snapshot.cpId] });
this.saveState(true);
this.toast('تراکنش با موفقیت بازیابی شد و بالانس به‌روزرسانی شد.');
this.renderLogs();
} else if (log.entityType === 'offset_pair' && Array.isArray(log.snapshot)) {
const cpIds = [];
for (const snap of log.snapshot) {
if (snap.cpId) cpIds.push(snap.cpId);
const existing = this.state.transactions.find(t => t.id === snap.id);
if (existing) {
existing.deleted = false;
} else {
const copy = JSON.parse(JSON.stringify(snap));
copy.deleted = false;
this.state.transactions.push(copy);
}
}
log.restored = true;
this.addLog('restore', `بازیابی تهاتر سه‌جانبه (${log.snapshot[0]?.offsetGroupId || ''})`, log.details || '', log.snapshot, 'offset_pair', { cpIds });
this.saveState(true);
this.toast('هر دو طرف تهاتر سه‌جانبه بازیابی شد.');
this.renderLogs();
} else if (log.entityType === 'cp') {
const existing = this.state.counterparties.find(c => c.id === log.snapshot.id);
if (existing) {
existing.deleted = false;
} else {
const restoredCp = JSON.parse(JSON.stringify(log.snapshot));
restoredCp.deleted = false;
this.state.counterparties.push(restoredCp);
}
log.restored = true;
this.addLog('restore', `بازیابی طرف حساب: ${log.snapshot.name}`, '', log.snapshot, 'cp', { cpIds: [log.snapshot.id] });
this.saveState(true);
this.toast('طرف حساب با موفقیت بازیابی شد.');
this.renderLogs();
}

exportBackupJson() {
if (!this.requireAdmin()) return;

const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `sarafi-backup-${Jalali.todayStr().replace(/\//g, '-')}.json`;
a.click();
URL.revokeObjectURL(url);
this.toast('فایل پشتیبان دانلود شد و شمارنده پشتیبان صفر شد.');
this.render();
},
importBackupJson(event) {
if (!this.requireAdmin()) return;
const input = event.target;
const file = input && input.files ? input.files[0] : null;
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
try {
const parsed = JSON.parse(e.target.result);
if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.counterparties) || !Array.isArray(parsed.transactions)) {
throw new Error('فرمت فایل معتبر نیست');
}
if (!confirm('با بازیابی این فایل، اطلاعات فعلی با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟')) return;
const def = createDefaultState();
const validCurs = Array.isArray(parsed.currencies) && parsed.currencies.length
? parsed.currencies.filter(c => c && typeof c.code === 'string' && c.code.trim() && typeof c.name === 'string' && c.name.trim())
: def.currencies;
this.state = Object.assign(def, parsed);
this.state.currencies = validCurs.length ? validCurs : def.currencies;
this.state.logs = Array.isArray(parsed.logs) ? parsed.logs : [];
this.state.settings = Object.assign(def.settings, parsed.settings || {});
this.state.seq = Object.assign(def.seq, parsed.seq || {});
this.state.lastRates = Object.assign({}, parsed.lastRates || {});
this.state.marketRates = Object.assign({}, parsed.marketRates || {});
this.state.settings.changesSinceBackup = 0;
this.state.settings.lastBackupAt = Date.now();
this.applyThemeClass();
this.saveState(false);
this.toast('پشتیبان با موفقیت بازیابی شد.');
this.switchTab('accounts');
} catch (err) {
this.toast('فایل پشتیبان نامعتبر یا خراب است.', true);
} finally {
if (input) input.value = '';
}
};
reader.onerror = () => {
if (input) input.value = '';
this.toast('خطا در خواندن فایل پشتیبان.', true);
};
reader.readAsText(file);
},
resetAllData() {
if (!this.requireAdmin()) return;
if (!confirm('آیا مطمئن هستید که کل اطلاعات پاک شود؟')) return;

this.state = createDefaultState();

note,

};

this.addLog('create', `تعریف طرف حساب جدید: ${name}`, phone ? `تلفن: ${phone}` : '', cp, 'cp');

const curCode = row.querySelector('.ob-cur').value;
const amtMicro = Dec.toMicro(row.querySelector('.ob-amt').value);
const dir = row.querySelector('.ob-dir').value;
if (amtMicro > 0n) {
const deltaMicro = dir === 'credit' ? amtMicro : -amtMicro;
const cur = this.getCurrency(curCode);
const tx = {
id: this.nextId('opening'),
cpId: cp.id,
type: 'opening',
side: dir,
date: today,
createdAt: Date.now() + Math.floor(Math.random() * 100),
currency1: curCode,
amount1: Dec.toStoredVal(amtMicro),
effects: [{ currency: curCode, delta: Dec.toStoredVal(deltaMicro) }],
summary: `مانده اولیه ${cur.name}: ${Num.formatMicro(amtMicro)} (${dir === 'credit' ? 'طلبکار' : 'بدهکار'})`,
note: 'نقطه شروع حساب',
deleted: false
};
this.state.transactions.push(tx);
this.addLog('create', `ثبت مانده اولیه (${name}) - ${tx.id}`, tx.summary, tx, 'tx');
}
});

saveEditCounterparty(cpId) {
if (!this.requireAdmin()) return;
const cp = this.state.counterparties.find(c => c.id === cpId);
if (!cp) return;
const beforeCp = JSON.parse(JSON.stringify(cp));
const oldName = cp.name;
const newName = document.getElementById('edit-cp-name').value.trim();
if (!newName) { this.toast('نام نمی‌تواند خالی باشد.'); return; }
cp.name = newName;
cp.phone = Num.toEnDigits(document.getElementById('edit-cp-phone').value).trim();
cp.note = document.getElementById('edit-cp-note').value.trim();
const diffLines = [];
if (beforeCp.name !== cp.name) diffLines.push(`نام: ${beforeCp.name} ← ${cp.name}`);
if ((beforeCp.phone || '') !== (cp.phone || '')) diffLines.push(`تلفن: ${beforeCp.phone || '—'} ← ${cp.phone || '—'}`);
if ((beforeCp.note || '') !== (cp.note || '')) diffLines.push(`توضیح: ${beforeCp.note || '—'} ← ${cp.note || '—'}`);
this.addLog('edit', `ویرایش طرف حساب: ${oldName}${oldName !== newName ? ' ← ' + newName : ''}`, diffLines.join('\n'), cp, 'cp', { beforeSnapshot: beforeCp, cpIds: [cp.id], editScope: 'profile' });
this.saveState(true);
this.closeModal();
this.toast('مشخصات ذخیره شد.');
this.render();

deleteCounterparty(cpId) {

const cp = this.state.counterparties.find(c => c.id === cpId && !c.deleted);

const openBals = this.getCounterpartyBalances(cp.id);
const balWarn = openBals.length
? `\n⚠️ توجه: این حساب هنوز ${openBals.length} ارز با مانده غیرصفر دارد!`
: '';
if (!confirm(`آیا طرف حساب «${cp.name}» حذف شود؟${balWarn}\n(از بخش لاگ تغییرات قابل بازیابی است)`)) return;
cp.deleted = true;
this.addLog('delete', `حذف طرف حساب: ${cp.name}`, 'قابل بازیابی از تب لاگ تغییرات', cp, 'cp');
this.saveState(true);

computeTxDraft() {
const f = this._txForm;
if (f.type === 'deal') {
const cur1 = document.getElementById('tx-cur1').value;
const cur2 = document.getElementById('tx-cur2').value;
const amt1Micro = Dec.toMicro(document.getElementById('tx-amt1').value);
const rateMicro = Dec.toMicro(document.getElementById('tx-rate').value);
const feeMicro = Dec.toMicro(document.getElementById('tx-fee').value);
const feeCur = document.getElementById('tx-fee-cur').value;
const smartRoundEnabled = document.getElementById('tx-smart-round').checked;
if (amt1Micro <= 0n || rateMicro <= 0n) return { valid: false, reason: 'مقدار ارز اول و نرخ تبدیل را وارد کنید.' };
if (cur1 === cur2) return { valid: false, reason: 'در معامله دو ارزی، ارز اول و ارز دوم باید متفاوت باشند.' };
const c1Obj = this.getCurrency(cur1);
const c2Obj = this.getCurrency(cur2);
const feeObj = this.getCurrency(feeCur);
const base2Micro = f.op === 'mul'
? Dec.mulMicro(amt1Micro, rateMicro)
: Dec.divMicro(amt1Micro, rateMicro);
const sign1 = f.dealSide === 'sell' ? 1 : -1;
const sign2 = f.dealSide === 'sell' ? -1 : 1;
let total2Micro = base2Micro;
let feeSeparate = false;
if (feeMicro > 0n) {
if (feeCur === cur2) {
total2Micro = (f.dealSide === 'sell') ? (base2Micro + feeMicro) : (base2Micro - feeMicro);
} else {
feeSeparate = true;
}
}
let finalAmt2AbsMicro = Dec.abs(total2Micro);
let finalSign2 = total2Micro >= 0n ? sign2 : -sign2;
let roundingNote = '';
if (smartRoundEnabled && !c2Obj.exact) {
const th = this.state.settings.roundingThreshold ?? 0.1;
const rr = Num.smartRoundMicro(finalAmt2AbsMicro, finalSign2, th);
if (rr.rounded) {
roundingNote = `گرد کردن هوشمند به نفع طرف حساب: مبلغ دقیق ${Num.formatMicro(rr.rawMicro)} ${c2Obj.name} ← ثبت نهایی ${Num.formatMicro(rr.finalMicro)} ${c2Obj.name}`;
finalAmt2AbsMicro = rr.finalMicro;
}
}
const delta1Micro = sign1 > 0 ? amt1Micro : -amt1Micro;
const delta2Micro = finalSign2 > 0 ? finalAmt2AbsMicro : -finalAmt2AbsMicro;
const effectsMicro = [
{ currency: cur1, deltaMicro: delta1Micro },
{ currency: cur2, deltaMicro: delta2Micro }
];
if (feeSeparate && feeMicro > 0n) {
const existing = effectsMicro.find(e => e.currency === feeCur);
if (existing) {
existing.deltaMicro -= feeMicro;
} else {
effectsMicro.push({ currency: feeCur, deltaMicro: -feeMicro });
}
}
const effects = effectsMicro.map(e => ({
currency: e.currency,
delta: Dec.toStoredVal(e.deltaMicro),
deltaMicro: e.deltaMicro
}));
const opChar = f.op === 'mul' ? '×' : '÷';
const sideTitle = f.dealSide === 'sell' ? 'فروش' : 'خرید';
const feeText = feeMicro > 0n ? ` (کارمزد: ${Num.formatMicro(feeMicro)} ${feeObj.name})` : '';
const summary = `${sideTitle} ${Num.formatMicro(amt1Micro)} ${c1Obj.name} با نرخ ${Num.formatMicro(rateMicro, 6)} (${opChar}) معادل ${Num.formatMicro(finalAmt2AbsMicro)} ${c2Obj.name}${feeText}`;
return {
valid: true,
type: 'deal',
side: f.dealSide,
op: f.op,
currency1: cur1,
amount1: Dec.toStoredVal(amt1Micro),
currency2: cur2,
rate: Dec.toStoredVal(rateMicro),
fee: Dec.toStoredVal(feeMicro),
feeCurrency: feeCur,
smartRound: smartRoundEnabled,
roundingNote,
effects,
summary
};
} else {
const cur = document.getElementById('trf-cur').value;
const amtMicro = Dec.toMicro(document.getElementById('trf-amt').value);
const feeMicro = Dec.toMicro(document.getElementById('trf-fee').value);
if (amtMicro <= 0n) return { valid: false, reason: 'مبلغ انتقال را وارد کنید.' };
const cObj = this.getCurrency(cur);
const deltaMicro = f.transferSide === 'receive'
? (amtMicro - feeMicro)
: -(amtMicro + feeMicro);
const sideText = f.transferSide === 'receive' ? 'دریافت از طرف حساب' : 'پرداخت به طرف حساب';
const feeText = feeMicro > 0n ? ` (کارمزد: ${Num.formatMicro(feeMicro)} ${cObj.name})` : '';
const summary = `${sideText}: ${Num.formatMicro(amtMicro)} ${cObj.name}${feeText}`;
return {
valid: true,
type: 'transfer',
side: f.transferSide,
currency1: cur,
amount1: Dec.toStoredVal(amtMicro),
fee: Dec.toStoredVal(feeMicro),
feeCurrency: cur,
roundingNote: '',
effects: [{ currency: cur, delta: Dec.toStoredVal(deltaMicro), deltaMicro }],
summary
};
}
},
updateTxPreview() {
const box = document.getElementById('tx-preview-box');
if (!box) return;
const d = this.computeTxDraft();
if (!d.valid) {
box.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); text-align:center;">${escapeHtml(d.reason)}</div>`;
return;
}
const lines = d.effects.map(ef => {
const cur = this.getCurrency(ef.currency);
const cls = this.getStatusClass(ef.deltaMicro);
const st = this.getStatusText(ef.deltaMicro);
return `
<div class="preview-line">
<span>تأثیر روی حساب <strong>${escapeHtml(cur.name)}</strong> طرف حساب:</span>
<span class="balance-chip ${cls}" style="direction:ltr">${Num.formatSigned(ef.deltaMicro)} (${st})</span>
</div>
`;
}).join('');
box.innerHTML = `
<div class="preview-title">📌 پیش‌نمایش اثر دقیق روی بالانس طرف حساب:</div>
${lines}
${d.roundingNote ? `<div class="rounding-alert">⚖️ ${escapeHtml(d.roundingNote)}</div>` : ''}
`;
},
saveTx() {
if (!this.requireAdmin()) return;
if (this._submitting) return;
const d = this.computeTxDraft();
if (!d.valid) {
this.toast(d.reason, true);
return;
}
const normDate = this.validateDateInput('tx-date');
if (!normDate) {
this.toast('تاریخ شمسی معتبر نیست (فرمت صحیح: 1405/08/29).', true);
return;
}
this._submitting = true;
setTimeout(() => { this._submitting = false; }, 350);
const cpSelEl = document.getElementById('tx-cp-select');
if (cpSelEl && cpSelEl.value) this._txForm.cpId = cpSelEl.value;
const refCode = Num.toEnDigits(document.getElementById('tx-ref')?.value || '').trim();
const note = document.getElementById('tx-note').value.trim();
const cp = this.state.counterparties.find(c => c.id === this._txForm.cpId);
if (d.type === 'deal') {
this.recordLastRate(d.currency1, d.currency2, d.rate, d.op);
}
const cleanEffects = d.effects.map(e => ({ currency: e.currency, delta: e.delta }));
if (this._txForm.editTxId) {
const tx = this.state.transactions.find(t => t.id === this._txForm.editTxId);
if (!tx) return;
const beforeTx = JSON.parse(JSON.stringify(tx));
const oldSummary = tx.summary;
Object.assign(tx, {
type: d.type,
side: d.side,
date: normDate,
refCode,
note,
currency1: d.currency1,
amount1: d.amount1,
fee: d.fee,
feeCurrency: d.feeCurrency,
roundingNote: d.roundingNote,
effects: cleanEffects,
summary: d.summary
});
if (d.type === 'deal') {
tx.op = d.op;
tx.currency2 = d.currency2;
tx.rate = d.rate;
tx.smartRound = d.smartRound;
} else {
delete tx.op;
delete tx.currency2;
delete tx.rate;
delete tx.smartRound;
}

getBalanceCardCurrencyMeta(cur) {
const code = (cur && cur.code) ? cur.code : '';
if (code === 'USD_W') return { label: 'USD_H', sub: '(Havaleh)' };
if (code === 'IRT') return { label: 'TMN', sub: '' };
if (code === 'USD') return { label: 'USD', sub: '' };
if (code === 'EUR') return { label: 'EUR', sub: '' };
if (code === 'USDT') return { label: 'USDT', sub: '(Tether)' };
if (code === 'AED') return { label: 'AED', sub: '' };
if (code === 'OMR') return { label: 'OMR', sub: '' };
if (code === 'CNY') return { label: 'CNY', sub: '' };
return { label: code || (cur ? cur.name : ''), sub: cur && cur.name && cur.name !== code ? `(${cur.name})` : '' };

getAvatarMonogram(name) {
const clean = String(name || '').trim();
if (!clean) return 'AC';
const parts = clean.split(/\s+/).filter(Boolean);
const isLatin = /^[A-Za-z0-9]/.test(clean);
if (isLatin) {
if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
return clean.slice(0, 2).toUpperCase();
}
if (parts.length >= 2) return `${parts[0][0]}‌${parts[1][0]}`;
return clean[0];

for (const ef of tx.effects) {

touched.add(ef.currency);
map[ef.currency] = (map[ef.currency] || 0n) + Dec.toMicro(ef.delta);
}
}
return this.orderBalanceMap(map, includeZeroTouched ? touched : null);

ctx.fillStyle = '#475569';
ctx.font = `500 15px ${fontBase}`;
ctx.fillText(' ' + meta.sub, cardX + 82 + lw, cy + 1);
}
ctx.restore();
const isCredit = b.micro > 0n;
const isDebit = b.micro < 0n;
const pillBg = isCredit ? '#dcfce7' : (isDebit ? '#fee2e2' : '#f1f5f9');
const dotColor = isCredit ? '#22c55e' : (isDebit ? '#ef4444' : '#64748b');
const txtColor = isCredit ? '#15803d' : (isDebit ? '#b91c1c' : '#334155');
const faStatus = isCredit ? 'طلبکار' : (isDebit ? 'بدهکار' : 'تسویه');
const enStatus = isCredit ? 'Creditor' : (isDebit ? 'Debtor' : 'Settled');
const pillW = 212;
const pillH = 44;
const pillX = col2Cx - pillW / 2;
const pillY = cy - pillH / 2;
this.drawRoundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2, pillBg);
ctx.save();
ctx.beginPath();
ctx.arc(pillX + 24, cy, 6.2, 0, Math.PI * 2);
ctx.fillStyle = dotColor;
ctx.fill();
ctx.direction = 'ltr';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillStyle = txtColor;
ctx.font = `800 16px ${fontBase}`;
const faW = ctx.measureText(faStatus).width;
ctx.font = `600 15px ${fontBase}`;
const enW = ctx.measureText(' / ' + enStatus).width;
const textAreaCenter = pillX + 36 + (pillW - 46) / 2;
const textStartX = textAreaCenter - (faW + enW) / 2;
ctx.font = `800 16px ${fontBase}`;
ctx.fillText(faStatus, textStartX, cy + 1);
ctx.font = `600 15px ${fontBase}`;
ctx.fillText(' / ' + enStatus, textStartX + faW, cy + 1);
ctx.restore();
const amtStr = Num.formatMicro(Dec.abs(b.micro));
ctx.save();
ctx.direction = 'ltr';
ctx.textAlign = 'right';
ctx.textBaseline = 'middle';
ctx.fillStyle = '#0f172a';
let amtFontSize = 25;
ctx.font = `800 ${amtFontSize}px ${fontBase}`;
while (amtFontSize > 13 && ctx.measureText(amtStr).width > 224) {
amtFontSize -= 1.5;
ctx.font = `800 ${amtFontSize}px ${fontBase}`;
}
ctx.fillText(amtStr, cardX + cardW - 30, cy + 1);
ctx.restore();
});
}
ctx.save();
ctx.fillStyle = '#64748b';
ctx.textBaseline = 'middle';
const footY = cardY + cardH + 40;
ctx.direction = 'rtl';
ctx.textAlign = 'right';
ctx.font = `600 13px ${fontBase}`;
ctx.fillText(this.state.settings.shopTitle || 'دفتر صرافی هوشمند', cardX + cardW - 6, footY);
ctx.direction = 'ltr';
ctx.textAlign = 'left';
ctx.font = `500 13px ${fontBase}`;
ctx.fillText(Jalali.nowDateTimeStr(), cardX + 6, footY);
ctx.restore();
return canvas.toDataURL('image/png');
},
drawRoundRect(ctx, x, y, w, h, r, fill) {
ctx.fillStyle = fill;
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
ctx.fill();
},

copyTextStatement(cpId) {
if (!this.canAccessCounterparty(cpId)) return;
const cp = this.state.counterparties.find(c => c.id === cpId);
const stmt = this.buildCounterpartyStatement(cpId);
const balances = stmt.isFiltered ? stmt.periodEndingBalances : stmt.currentBalances;
const txs = stmt.inPeriodAsc;
const lines = [];
lines.push(`📌 صورت وضعیت حساب: ${cp.name}`);
lines.push(`📅 تاریخ گزارش: ${Jalali.nowDateTimeStr()}`);
if (stmt.isFiltered) lines.push(`🔎 بازه گزارش: ${stmt.periodLabel}`);
lines.push(`━━━━━━━━━━━━━━━━━━━━`);
lines.push(`🔹 خلاصه نهایی بالانس (از دید طرف حساب):`);
if (!balances.length) {
lines.push(`• همه ارزها تسویه (صفر) است.`);
} else {
for (const b of balances) {
const cur = this.getCurrency(b.code);
const icon = b.micro > 0n ? '🟢' : '🔴';
const st = b.micro > 0n ? 'طلبکار' : 'بدهکار';
lines.push(`${icon} ${cur.name}: ${Num.formatSigned(b.micro)} (${st})`);
}
}
if (stmt.isFiltered) {
lines.push(`━━━━━━━━━━━━━━━━━━━━`);
lines.push(`⏩ مانده انتقالی (ابتدای این بازه):`);
if (!stmt.broughtForward.length) {
lines.push(`• تسویه (صفر)`);
} else {
for (const b of stmt.broughtForward) {
const cur = this.getCurrency(b.code);
lines.push(`• ${cur.name}: ${Num.formatSigned(b.micro)} (${this.getStatusText(b.micro)})`);
}
}
}
lines.push(`━━━━━━━━━━━━━━━━━━━━`);
lines.push(`📋 ریز تراکنش‌ها به ترتیب تاریخ شمسی (${txs.length} مورد):`);
if (!txs.length) {
lines.push(`• تراکنشی در این بازه ثبت نشده است.`);
} else {
txs.forEach((tx, idx) => {
if (tx.type === 'settlement') {
lines.push(`${idx + 1}. ✅ [${tx.date}] (${tx.id}) ${tx.summary}`);
lines.push(`   ↳ مانده تأییدشده: ${this.formatRunningTextForTx(tx, stmt)}`);
if (tx.note) lines.push(`   💬 ${tx.note}`);
return;
}
const efTxt = (tx.effects || []).map(ef => {
const c = this.getCurrency(ef.currency);
return `${c.name}: ${Num.formatSigned(ef.delta)}`;
}).join(' | ');
const runTxt = this.formatRunningTextForTx(tx, stmt);
const dispSum = this.getTxDisplaySummary(tx, this.isClientMode());
lines.push(`${idx + 1}. [${tx.date}] (${tx.id}) ${dispSum}`);
if (tx.refCode) lines.push(`   🧾 شماره فیش / پیگیری: ${tx.refCode}`);
lines.push(`   ↳ اثر: ${efTxt}`);
lines.push(`   📊 مانده لحظه‌ای: ${runTxt}`);
if (tx.roundingNote) lines.push(`   ⚖️ ${tx.roundingNote}`);
if (tx.note) lines.push(`   💬 ${tx.note}`);
});
}
const text = lines.join('\n');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text).then(() => {
this.toast('گزارش متنی (همراه با مانده لحظه‌ای) کپی شد.');
}).catch(() => this.fallbackCopyText(text));
} else {
this.fallbackCopyText(text);
}
},
fallbackCopyText(text) {
const ta = document.createElement('textarea');
ta.value = text;
ta.setAttribute('readonly', '');
ta.style.position = 'fixed';
ta.style.top = '-9999px';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
try {
document.execCommand('copy');
this.toast('متن با موفقیت کپی شد.');
} catch (e) {
this.toast('کپی خودکار انجام نشد؛ لطفاً متن را دستی کپی کنید.', true);
}
ta.remove();
},

exportCsvStatement(cpId) {
if (!this.canAccessCounterparty(cpId)) return;
const cp = this.state.counterparties.find(c => c.id === cpId);
const stmt = this.buildCounterpartyStatement(cpId);
const balances = stmt.isFiltered ? stmt.periodEndingBalances : stmt.currentBalances;
const txs = stmt.inPeriodAsc;
const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const rows = [];
rows.push([esc('صورت‌حساب'), esc(cp.name), esc('تاریخ گزارش'), esc(Jalali.nowDateTimeStr()), esc('بازه گزارش'), esc(stmt.periodLabel)].join(','));
rows.push('');
rows.push([esc('خلاصه بالانس نهایی'), esc('ارز'), esc('مبلغ'), esc('وضعیت')].join(','));
if (!balances.length) {
rows.push([esc(''), esc('همه ارزها'), esc('0'), esc('تسویه')].join(','));
} else {
for (const b of balances) {
const cur = this.getCurrency(b.code);
rows.push([esc(''), esc(cur.name), esc(Dec.toCanonicalStr(b.micro)), esc(this.getStatusText(b.micro))].join(','));
}
}
if (stmt.isFiltered) {
rows.push('');
rows.push([esc('مانده انتقالی ابتدای دوره'), esc('ارز'), esc('مبلغ'), esc('وضعیت')].join(','));
if (!stmt.broughtForward.length) {
rows.push([esc(''), esc('همه ارزها'), esc('0'), esc('تسویه')].join(','));
} else {
for (const b of stmt.broughtForward) {
const cur = this.getCurrency(b.code);
rows.push([esc(''), esc(cur.name), esc(Dec.toCanonicalStr(b.micro)), esc(this.getStatusText(b.micro))].join(','));
}
}
}
rows.push('');
rows.push([esc('ردیف'), esc('شناسه'), esc('تاریخ'), esc('نوع'), esc('شماره فیش / پیگیری'), esc('شرح'), esc('تأثیر روی حساب'), esc('مانده لحظه‌ای'), esc('توضیحات')].join(','));
txs.forEach((tx, i) => {
const efTxt = tx.type === 'settlement'
? 'نقطه تسویه'
: (tx.effects || []).map(ef => {
const c = this.getCurrency(ef.currency);
return `${c.name}: ${Num.formatSigned(ef.delta)}`;
}).join(' | ');
const runTxt = this.formatRunningTextForTx(tx, stmt);
const dispSum = this.getTxDisplaySummary(tx, this.isClientMode());
const typeFa = tx.type === 'deal' ? 'معامله'
: (tx.type === 'opening' ? 'مانده اولیه'
: (tx.type === 'settlement' ? 'نقطه تسویه'
: (tx.type === 'offset' ? (this.isClientMode() ? 'انتقال حواله‌ای' : 'تهاتر سه‌جانبه') : 'انتقال')));
const notes = [tx.roundingNote, tx.note].filter(Boolean).join(' - ');
rows.push([esc(i + 1), esc(tx.id), esc(tx.date), esc(typeFa), esc(tx.refCode || ''), esc(dispSum), esc(efTxt), esc(runTxt), esc(notes)].join(','));
});
const csvContent = '\uFEFF' + rows.join('\r\n');
const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `statement-${safeFilename(cp.name)}-${Jalali.todayStr().replace(/\//g, '-')}.csv`;
a.click();
URL.revokeObjectURL(url);
this.toast('فایل اکسل (CSV) همراه با مانده لحظه‌ای دانلود شد.');

if (!this.requireAdmin()) return;
const hasPin = !!this.state.settings.adminPinHash;
if (hasPin) {
const oldPin = Num.toEnDigits(document.getElementById('pin-old').value).trim();
if (Sec.hashSecret(oldPin, 'pin') !== this.state.settings.adminPinHash) {
this.toast('رمز PIN فعلی اشتباه است.');
return;
}
}

const p2 = Num.toEnDigits(document.getElementById('pin-new2').value).trim();
if (!/^\d{4,8}$/.test(p1)) {
this.toast('رمز PIN باید بین ۴ تا ۸ رقم عددی باشد.');
return;
}
if (p1 !== p2) {
this.toast('رمز جدید و تکرار آن یکسان نیستند.');
return;
}
this.state.settings.adminPinHash = Sec.hashSecret(p1, 'pin');
this.saveState(false);
this.closeModal();

}
