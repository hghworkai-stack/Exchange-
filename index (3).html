saveOffset() {
if (!this.requireAdmin()) return;
if (this._submitting) return;
const fromId = document.getElementById('ofs-from').value;
const toId = document.getElementById('ofs-to').value;
const curCode = document.getElementById('ofs-cur').value;
const amtMicro = Dec.toMicro(document.getElementById('ofs-amt').value);
const normDate = this.validateDateInput('ofs-date');
const refCode = Num.toEnDigits(document.getElementById('ofs-ref')?.value || '').trim();
const note = document.getElementById('ofs-note').value.trim();
if (!fromId || !toId || fromId === toId) {
this.toast('تحویل‌دهنده و تحویل‌گیرنده باید متفاوت باشند.', true);
return;
}
if (amtMicro <= 0n) {
this.toast('مبلغ جابه‌جایی باید بزرگ‌تر از صفر باشد.', true);
return;
}
if (!normDate) {
this.toast('تاریخ شمسی معتبر نیست (مثلاً 1405/08/29).', true);
return;
}
this._submitting = true;
setTimeout(() => { this._submitting = false; }, 350);
const fromCp = this.state.counterparties.find(c => c.id === fromId);
const toCp = this.state.counterparties.find(c => c.id === toId);
const cur = this.getCurrency(curCode);
const storedAmt = Dec.toStoredVal(amtMicro);
const storedNeg = Dec.toStoredVal(-amtMicro);
const amtText = Num.formatMicro(amtMicro);
const fromSummary = `تهاتر سه‌جانبه: تحویل ${amtText} ${cur.name} به «${toCp.name}»`;
const toSummary = `تهاتر سه‌جانبه: دریافت ${amtText} ${cur.name} از «${fromCp.name}»`;
const fromClientSummary = `واریز / تحویل حواله‌ای: ${amtText} ${cur.name}`;
const toClientSummary = `دریافت حواله‌ای: ${amtText} ${cur.name}`;
if (this._offsetEditGroupId) {
const gid = this._offsetEditGroupId;
const pair = this.state.transactions.filter(t => t.offsetGroupId === gid && !t.deleted);
const legA = pair.find(t => t.offsetRole === 'from');
const legB = pair.find(t => t.offsetRole === 'to');
if (!legA || !legB) return;
const beforePair = [JSON.parse(JSON.stringify(legA)), JSON.parse(JSON.stringify(legB))];
const oldDesc = `${legA.summary}`;
Object.assign(legA, {
cpId: fromId,
offsetPeerCpId: toId,
date: normDate,
currency1: curCode,
amount1: storedAmt,
effects: [{ currency: curCode, delta: storedAmt }],
summary: fromSummary,
clientSummary: fromClientSummary,
refCode,
note
});
Object.assign(legB, {
cpId: toId,
offsetPeerCpId: fromId,
date: normDate,
currency1: curCode,
amount1: storedAmt,
effects: [{ currency: curCode, delta: storedNeg }],
summary: toSummary,
clientSummary: toClientSummary,
refCode,
note
});
this.addLog('edit', `ویرایش تهاتر سه‌جانبه ${gid}`, `قبل: ${oldDesc}\nبعد: ${fromCp.name} ← ${toCp.name} (${amtText} ${cur.name})`, [legA, legB], 'offset_pair', { beforeSnapshot: beforePair, cpIds: [beforePair[0].cpId, beforePair[1].cpId, fromId, toId] });
this.toast('هر دو طرف تهاتر سه‌جانبه به‌روزرسانی شد.');
} else {
const gid = this.nextId('offset');
const nowTs = Date.now();
const legA = {
id: `${gid}-A`,
cpId: fromId,
type: 'offset',
offsetGroupId: gid,
offsetRole: 'from',
offsetPeerCpId: toId,
date: normDate,
createdAt: nowTs,
currency1: curCode,
amount1: storedAmt,
effects: [{ currency: curCode, delta: storedAmt }],
summary: fromSummary,
clientSummary: fromClientSummary,
refCode,
note,
deleted: false
};
const legB = {
id: `${gid}-B`,
cpId: toId,
type: 'offset',
offsetGroupId: gid,
offsetRole: 'to',
offsetPeerCpId: fromId,
date: normDate,
createdAt: nowTs + 1,
currency1: curCode,
amount1: storedAmt,
effects: [{ currency: curCode, delta: storedNeg }],
summary: toSummary,
clientSummary: toClientSummary,
refCode,
note,
deleted: false
};
this.state.transactions.push(legA, legB);
this.addLog('create', `ثبت تهاتر سه‌جانبه ${gid}`, `${fromCp.name} ← ${toCp.name}: ${amtText} ${cur.name}${refCode ? ` (پیگیری: ${refCode})` : ''}`, [legA, legB], 'offset_pair');
this.toast(`تهاتر سه‌جانبه (${gid}) همزمان در هر دو حساب ثبت شد.`);
}
this.saveState(true);
this.closeModal();
this.render();
},
openCounterpartyToolsModal(cpId) {
if (this.isClientMode()) return;
const cp = this.state.counterparties.find(c => c.id === cpId && !c.deleted);
if (!cp) return;
const portalActive = !!(cp.portal && cp.portal.enabled);
this.openModal(`مدیریت و امکانات حساب: ${cp.name}`, `
<button type="button" class="quick-menu-item" onclick="app.openOpeningBalanceModal('${cp.id}')">
<span class="quick-menu-ico" style="background:var(--amber-bg); color:var(--amber);">🏁</span>
<div>
<div style="font-weight:800; font-size:13.5px;">ثبت مانده اولیه (نقطه شروع)</div>
<div style="font-size:11.5px; color:var(--text-muted);">افزودن مانده قبلی برای هر ارز</div>
</div>
</button>
<button type="button" class="quick-menu-item" onclick="app.openSettlementModal('${cp.id}')">
<span class="quick-menu-ico" style="background:var(--credit-bg); color:var(--credit);">✅</span>
<div>
<div style="font-weight:800; font-size:13.5px;">بستن دوره و ثبت نقطه تسویه</div>
<div style="font-size:11.5px; color:var(--text-muted);">قطع صورت‌حساب بدون تغییر در اعداد برای گزارش‌های بعدی</div>
</div>
</button>
<button type="button" class="quick-menu-item" onclick="app.openClientPortalModal('${cp.id}')">
<span class="quick-menu-ico" style="background:var(--blue-bg); color:var(--blue);">🔑</span>
<div>
<div style="font-weight:800; font-size:13.5px;">یوزر و پسورد پورتال مشتری ${portalActive ? '✓' : ''}</div>
<div style="font-size:11.5px; color:var(--text-muted);">${portalActive ? `فعال • نام کاربری: ${escapeHtml(cp.portal.username)}` : 'ساخت دسترسی فقط‌خواندنی و ایزوله برای این مشتری'}</div>
</div>
</button>
<div class="grid-2" style="margin-top:6px;">
<button type="button" class="btn btn-secondary" onclick="app.openEditCounterpartyModal('${cp.id}')">✏️ ویرایش مشخصات</button>
<button type="button" class="btn btn-danger" onclick="app.closeModal(); app.deleteCounterparty('${cp.id}')">🗑️ حذف طرف حساب</button>
</div>
`);
},
openModal(title, bodyHtml) {
document.getElementById('modal-title').textContent = title;
document.getElementById('modal-body').innerHTML = bodyHtml;
document.getElementById('modal-backdrop').classList.add('open');
document.body.classList.add('modal-open');
},
closeModal() {
document.getElementById('modal-backdrop').classList.remove('open');
document.body.classList.remove('modal-open');
}
};
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
