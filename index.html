                this.updateLivePreview();
            }

            setTxDraftMode(mode) {
                this._txDraft.mode = mode;
                this._txDraft.side = mode === 'deal' ? 'sell' : 'receive';
                this._txDraft.feeMode = mode === 'deal' ? 'add' : 'sub';
                this._txDraft.feeCurr = mode === 'deal' ? this._txDraft.curr2 : this._txDraft.curr1;
                this.renderTransactionModal();
            }

            setTxDraftSide(side) {
                this._txDraft.side = side;
                if (this._txDraft.mode === 'deal') {
                    this._txDraft.feeMode = 'add';
                }
                this.renderTransactionModal();
            }

            updateTxDraftCurr2(newCurr2) {
                const prevCurr2 = this._txDraft.curr2;
                this._txDraft.curr2 = newCurr2;
                if (!this._txDraft.feeCurr || this._txDraft.feeCurr === prevCurr2) {
                    this._txDraft.feeCurr = newCurr2;
                }
                this.renderTransactionModal();
            }

            updateTxDraftNumericField(field, inputEl) {
                const formatted = applyLiveThousandSeparator(inputEl);
                this._txDraft[field] = formatted;
                this.updateLivePreview();
            }

            updateTxDraftField(field, value, rerenderModal = false) {
                this._txDraft[field] = value;
                if (rerenderModal) {
                    this.renderTransactionModal();
                } else {
                    this.updateLivePreview();
                }
            }

            updateLivePreview() {
                const box = document.getElementById('txLivePreview');
                if (!box) return;
                const d = this._txDraft;
                const amt1 = parseNumericInput(d.amt1);
                const rate = parseNumericInput(d.rate);
                const fee = d.fee.trim() === '' ? 0 : parseNumericInput(d.fee);

                if (isNaN(amt1) || amt1 <= 0 || (d.mode === 'deal' && (isNaN(rate) || rate <= 0))) {
                    box.innerHTML = `<div class="text-xs text-slate-500 text-center py-1">برای مشاهده پیش‌نمایش اثر روی بالانس طرف حساب، مبلغ ${d.mode === 'deal' ? 'و نرخ ' : ''}را وارد کنید.</div>`;
                    return;
                }

                if (isNaN(fee) || fee < 0) {
                    box.innerHTML = `<div class="text-xs text-rose-400">مقدار کارمزد نامعتبر است.</div>`;
                    return;
                }

                const calc = calculateTransactionEffects({
                    mode: d.mode,
                    side: d.side,
                    curr1: d.curr1,
                    amt1,
                    op: d.op,
                    rate,
                    curr2: d.curr2,
                    fee,
                    feeCurr: d.mode === 'deal' ? (d.feeCurr || d.curr2) : d.curr1,
                    feeMode: d.feeMode,
                    applyRounding: d.applyRounding
                }, this.state.currencies, this.state.settings.roundingThreshold);

                if (calc.error) {
                    box.innerHTML = `<div class="text-xs text-rose-400 font-medium">${escapeHtml(calc.error)}</div>`;
                    return;
                }

                const c2 = this.getCurrency(d.mode === 'deal' ? d.curr2 : d.curr1);
                const feeInC2 = d.mode === 'deal' && (calc.feeCurr === d.curr2);
                const formulaSummary = d.mode === 'deal'
                    ? `<div class="flex items-center justify-between text-xs pb-2 border-b border-slate-800/80">
                           <span class="text-slate-400">محاسبه دقیق (${d.op === 'div' ? 'تقسیم' : 'ضرب'}${fee > 0 && feeInC2 ? ' + کارمزد' : ''}):</span>
                           <span dir="ltr" class="font-num font-bold text-white">${formatNum(calc.baseTotal, 6)}${fee > 0 && feeInC2 ? ` + ${formatNum(fee, 4)} = ${formatNum(calc.finalExact, 6)}` : ''} ${escapeHtml(c2.symbol)}</span>
                       </div>`
                    : (fee > 0 ? `<div class="flex items-center justify-between text-xs pb-2 border-b border-slate-800/80">
                           <span class="text-slate-400">خالص پس از کارمزد:</span>
                           <span dir="ltr" class="font-num font-bold text-white">${formatNum(calc.finalExact, 6)} ${escapeHtml(c2.symbol)}</span>
                       </div>` : '');

                const effectsHtml = calc.legs.map(leg => {
                    const curr = this.getCurrency(leg.currencyId);
                    const isPos = leg.effectiveDelta > 0;
                    return `
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-300 font-medium">${escapeHtml(curr.name)}${leg.isFeeLeg ? ' (کارمزد)' : ''}</span>
                            <div class="flex items-center gap-1.5">
                                <span dir="ltr" class="font-num font-extrabold text-sm ${isPos ? 'text-emerald-400' : 'text-rose-400'}">${formatSignedNum(leg.effectiveDelta, 4)}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded-md ${isPos ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300'}">${isPos ? 'طلبکار می‌شود' : 'بدهکار می‌شود'}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                const roundWarn = calc.roundingNotes.length > 0
                    ? `<div class="text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-xl px-2.5 py-1.5 leading-relaxed">${calc.roundingNotes.map(n => escapeHtml(n)).join('<br>')}</div>`
                    : '';

                box.innerHTML = `
                    <div class="text-[11px] font-bold text-emerald-400 mb-1">پیش‌نمایش اثر روی بالانس طرف حساب:</div>
                    ${formulaSummary}
                    <div class="space-y-1.5">${effectsHtml}</div>
                    ${roundWarn}
                `;
            }

            submitTransactionForm(e) {
                e.preventDefault();
                const d = this._txDraft;
                const amt1 = parseNumericInput(d.amt1);
                const rate = d.mode === 'deal' ? parseNumericInput(d.rate) : 1;
                const fee = d.fee.trim() === '' ? 0 : parseNumericInput(d.fee);

                if (isNaN(fee) || fee < 0) {
                    showToast('مقدار کارمزد نامعتبر است.', 'error');
                    return;
                }
                if (!JalaliDate.isValidJalaliString(d.dateJalali)) {
                    showToast('فرمت تاریخ شمسی نامعتبر است (مثال: 1405/08/28).', 'error');
                    return;
                }

                const calc = calculateTransactionEffects({
                    mode: d.mode,
                    side: d.side,
                    curr1: d.curr1,
                    amt1,
                    op: d.op,
                    rate,
                    curr2: d.curr2,
                    fee,
                    feeCurr: d.mode === 'deal' ? (d.feeCurr || d.curr2) : d.curr1,
                    feeMode: d.feeMode,
                    applyRounding: d.applyRounding
                }, this.state.currencies, this.state.settings.roundingThreshold);

                if (calc.error) {
                    showToast(calc.error, 'error');
                    return;
                }

                const cp = this.getCounterparty(d.counterpartyId);
                const normalizedDate = JalaliDate.formatJalaliNormalized(d.dateJalali);

                if (d.editTxId) {
                    const idx = this.state.transactions.findIndex(t => t.id === d.editTxId);
                    if (idx === -1) return;
                    const oldTx = structuredClone(this.state.transactions[idx]);
                    const updatedTx = {
                        ...oldTx,
                        mode: d.mode,
                        side: d.side,
                        curr1: d.curr1,
                        amt1: cleanFloat(amt1),
                        op: d.mode === 'deal' ? d.op : null,
                        rate: d.mode === 'deal' ? cleanFloat(rate) : null,
                        curr2: d.mode === 'deal' ? d.curr2 : null,
                        fee: cleanFloat(fee),
                        feeCurr: calc.feeCurr,
                        feeMode: calc.feeMode,
                        baseTotal: calc.baseTotal,
                        finalExact: calc.finalExact,
                        applyRounding: d.applyRounding,
                        legs: calc.legs,
                        roundingNotes: calc.roundingNotes,
                        dateJalali: normalizedDate,
                        description: d.description.trim(),
                        updatedAt: Date.now()
                    };
                    this.state.transactions[idx] = updatedTx;

                    // ثبت لاگ تغییرناپذیر ویرایش
                    this.state.auditLogs.push({
                        id: generateId('log'),
                        timestampJalali: JalaliDate.nowDateTimeStr(),
                        timestampMs: Date.now(),
                        counterpartyId: d.counterpartyId,
                        counterpartyName: cp?.name || 'نامشخص',
                        txId: oldTx.id,
                        txCode: oldTx.code,
                        action: 'edit',
                        before: oldTx,
                        after: structuredClone(updatedTx)
                    });

                    showToast(`تراکنش ${oldTx.code} ویرایش و در لاگ ثبت شد.`, 'success');
                } else {
                    const code = `TRX-${this.state.nextTxSeq++}`;
                    const newTx = {
                        id: generateId('tx'),
                        code,
                        counterpartyId: d.counterpartyId,
                        mode: d.mode,
                        side: d.side,
                        curr1: d.curr1,
                        amt1: cleanFloat(amt1),
                        op: d.mode === 'deal' ? d.op : null,
                        rate: d.mode === 'deal' ? cleanFloat(rate) : null,
                        curr2: d.mode === 'deal' ? d.curr2 : null,
                        fee: cleanFloat(fee),
                        feeCurr: calc.feeCurr,
                        feeMode: calc.feeMode,
                        baseTotal: calc.baseTotal,
                        finalExact: calc.finalExact,
                        applyRounding: d.applyRounding,
                        legs: calc.legs,
                        roundingNotes: calc.roundingNotes,
                        dateJalali: normalizedDate,
                        timeStr: JalaliDate.nowTimeStr(),
                        description: d.description.trim(),
                        createdAt: Date.now()
                    };
                    this.state.transactions.push(newTx);
                    this.state.auditLogs.push({
                        id: generateId('log'),
                        timestampJalali: JalaliDate.nowDateTimeStr(),
                        timestampMs: Date.now(),
                        counterpartyId: d.counterpartyId,
                        counterpartyName: cp?.name || 'نامشخص',
                        txId: newTx.id,
                        txCode: newTx.code,
                        action: 'create',
                        before: null,
                        after: structuredClone(newTx)
                    });
                    if (cp) cp.lastActivityAt = Date.now();
                    showToast(`تراکنش ${code} با موفقیت ثبت شد.`, 'success');
                }

                this.saveState();
                this.closeModal();
                this.render();
            }

            confirmDeleteTransaction(txId) {
                const tx = this.state.transactions.find(t => t.id === txId);
                if (!tx) return;
                const cp = this.getCounterparty(tx.counterpartyId);
                this.openConfirmModal({
                    title: `حذف تراکنش ${tx.code}`,
                    message: 'این تراکنش حذف شده و مانده حساب اصلاح می‌شود. نسخه کامل آن در «لاگ تغییرات» جهت بازیابی احتمالی ذخیره خواهد شد.',
                    confirmText: 'حذف تراکنش',
                    danger: true,
                    onConfirm: () => {
                        const snapshot = structuredClone(tx);
                        this.state.transactions = this.state.transactions.filter(t => t.id !== txId);
                        this.state.auditLogs.push({
                            id: generateId('log'),
                            timestampJalali: JalaliDate.nowDateTimeStr(),
                            timestampMs: Date.now(),
                            counterpartyId: tx.counterpartyId,
                            counterpartyName: cp?.name || 'نامشخص',
                            txId: tx.id,
                            txCode: tx.code,
                            action: 'delete',
                            before: snapshot,
                            after: null,
                            restored: false
                        });
                        this.saveState();
                        this.render();
                        showToast(`تراکنش ${tx.code} حذف و در لاگ ذخیره شد.`, 'info');
                    }
                });
            }

            // =========================================================================
            // 8. خروجی‌های حرفه‌ای (تصویر Canvas PNG / متن آماده / PDF / اکسل CSV / JSON)
            // =========================================================================
            async openBalancePngModal(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;

                try {
                    await document.fonts.ready;
                } catch (_) {}

                const balances = this.getCounterpartyBalances(cpId);
                const rows = this.ui.showZeroBalancesCard ? balances : balances.filter(b => b.balance !== 0);

                // رسم کارت با کیفیت Retina 2x روی HTML5 Canvas (کاملاً آفلاین بدون خطای CORS)
                const dpr = 2;
                const width = 760;
                const headerH = 165;
                const rowH = 74;
                const footerH = 74;
                const contentH = rows.length > 0 ? (rows.length * rowH + 24) : 110;
                const height = headerH + contentH + footerH;

                const canvas = document.createElement('canvas');
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);

                // تابع مستطیل گوشه‌گرد
                const roundRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                };

                // پس‌زمینه گرادیانت فین‌تک
                const bgGrad = ctx.createLinearGradient(0, 0, width, height);
                bgGrad.addColorStop(0, '#070c18');
                bgGrad.addColorStop(0.6, '#0f172a');
                bgGrad.addColorStop(1, '#062c22');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                // کادر ظریف خارجی
                roundRect(18, 18, width - 36, height - 36, 26);
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // هدر کارت
                ctx.direction = 'rtl';
                ctx.textAlign = 'right';
                ctx.fillStyle = '#34d399';
                ctx.font = '600 18px Vazirmatn, Tahoma, sans-serif';
                ctx.fillText('تراز وضعیت بالانس حساب', width - 48, 66);

                ctx.fillStyle = '#ffffff';
                ctx.font = '800 32px Vazirmatn, Tahoma, sans-serif';
                ctx.fillText(cp.name, width - 48, 114);

                // تاریخ شمسی سمت چپ
                ctx.direction = 'ltr';
                ctx.textAlign = 'left';
                const nowStr = JalaliDate.nowDateTimeStr();
                roundRect(48, 48, 215, 42, 12);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.fillStyle = '#cbd5e1';
                ctx.font = '600 16px Inter, Vazirmatn, sans-serif';
                ctx.fillText(nowStr, 68, 75);

                // خط جداکننده
                ctx.beginPath();
                ctx.moveTo(48, 144);
                ctx.lineTo(width - 48, 144);
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // سطرهای مانده ارزها
                if (rows.length === 0) {
                    roundRect(48, headerH + 8, width - 96, 76, 18);
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
                    ctx.fill();
                    ctx.direction = 'rtl';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#34d399';
                    ctx.font = '700 22px Vazirmatn, Tahoma, sans-serif';
                    ctx.fillText('کل حساب در تمام ارزها تسویه (۰) است', width / 2, headerH + 54);
                } else {
                    rows.forEach((b, i) => {
                        const y = headerH + i * rowH;
                        const isPos = b.balance > 0;
                        const isNeg = b.balance < 0;

                        roundRect(48, y, width - 96, 62, 16);
                        ctx.fillStyle = 'rgba(7, 11, 20, 0.72)';
                        ctx.fill();
                        ctx.strokeStyle = isPos ? 'rgba(16, 185, 129, 0.28)' : (isNeg ? 'rgba(244, 63, 94, 0.28)' : 'rgba(148, 163, 184, 0.2)');
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        // نام ارز (راست)
                        ctx.direction = 'rtl';
                        ctx.textAlign = 'right';
                        ctx.fillStyle = '#f8fafc';
                        ctx.font = '700 21px Vazirmatn, Tahoma, sans-serif';
                        ctx.fillText(`${b.currency.name} (${b.currency.symbol})`, width - 70, y + 38);

                        // نشانگر وضعیت (وسط-راست)
                        const statusTxt = isPos ? 'طلبکار' : (isNeg ? 'بدهکار' : 'تسویه');
                        const pillX = width - 355;
                        roundRect(pillX, y + 16, 94, 30, 10);
                        ctx.fillStyle = isPos ? 'rgba(16, 185, 129, 0.18)' : (isNeg ? 'rgba(244, 63, 94, 0.18)' : 'rgba(100, 116, 139, 0.25)');
                        ctx.fill();
                        ctx.textAlign = 'center';
                        ctx.fillStyle = isPos ? '#6ee7b7' : (isNeg ? '#fda4af' : '#cbd5e1');
                        ctx.font = '700 15px Vazirmatn, Tahoma, sans-serif';
                        ctx.fillText(statusTxt, pillX + 47, y + 36);

                        // مبلغ عددی (چپ)
                        ctx.direction = 'ltr';
                        ctx.textAlign = 'left';
                        ctx.fillStyle = isPos ? '#34d399' : (isNeg ? '#fb7185' : '#94a3b8');
                        ctx.font = '800 25px Inter, Vazirmatn, sans-serif';
                        ctx.fillText(formatSignedNum(b.balance), 70, y + 40);
                    });
                }

                // فوتر کارت
                ctx.direction = 'rtl';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#64748b';
                ctx.font = '500 14px Vazirmatn, Tahoma, sans-serif';
                ctx.fillText('گزارش وضعیت از دید طرف حساب  •  دفتر صرافی هوشمند', width / 2, height - 38);

                const dataUrl = canvas.toDataURL('image/png');
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                const safeDate = JalaliDate.nowDateStr().replace(/\//g, '-');
                this.ui.lastPngDataUrl = dataUrl;
                this.ui.lastPngBlob = blob;
                this.ui.lastPngFileName = `balance-${cp.name}-${safeDate}.png`;

                const canShareFile = !!(navigator.canShare && blob && navigator.canShare({
                    files: [new File([blob], this.ui.lastPngFileName, { type: 'image/png' })]
                }));

                const root = document.getElementById('modal-root');
                root.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" onclick="if(event.target===this) app.closeModal()">
                        <div class="w-full sm:max-w-lg max-h-[92vh] overflow-y-auto bg-navy-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-3xl p-4 sm:p-5 shadow-2xl animate-slide-up space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm sm:text-base font-bold text-white">پیش‌نمایش تصویر بالانس</h3>
                                <button onclick="app.closeModal()" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">✕</button>
                            </div>
                            <div class="rounded-2xl overflow-hidden border border-slate-700/80 bg-navy-950">
                                <img src="${dataUrl}" alt="کارت بالانس" class="w-full h-auto block">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <button onclick="app.downloadLastPng()" class="h-11 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-extrabold text-xs transition">
                                    دانلود تصویر PNG
                                </button>
                                <button onclick="app.copyLastPng()" class="h-11 rounded-2xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/30 text-sky-200 font-bold text-xs transition">
                                    کپی تصویر
                                </button>
                                ${canShareFile ? `
                                    <button onclick="app.shareLastPng('${escapeHtml(cp.name)}')" class="h-11 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-200 font-bold text-xs transition">
                                        اشتراک‌گذاری سریع
                                    </button>
                                ` : `
                                    <button onclick="app.closeModal()" class="h-11 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition">
                                        بستن
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            downloadLastPng() {
                if (!this.ui.lastPngDataUrl) return;
                const a = document.createElement('a');
                a.href = this.ui.lastPngDataUrl;
                a.download = this.ui.lastPngFileName || 'balance.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('تصویر بالانس دانلود شد.', 'success');
            }

            async copyLastPng() {
                if (!this.ui.lastPngBlob) return;
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': this.ui.lastPngBlob })]);
                        showToast('تصویر در حافظه کپی شد؛ آماده ارسال در واتساپ/تلگرام!', 'success');
                        return;
                    }
                } catch (_) {}
                showToast('مرورگر از کپی مستقیم تصویر پشتیبانی نکرد؛ لطفاً از «دانلود تصویر PNG» استفاده کنید.', 'info');
            }

            async shareLastPng(cpName) {
                if (!this.ui.lastPngBlob) return;
                try {
                    const file = new File([this.ui.lastPngBlob], this.ui.lastPngFileName, { type: 'image/png' });
                    await navigator.share({
                        title: `وضعیت بالانس ${cpName}`,
                        text: `صورت‌حساب و تراز بالانس ${cpName} (${JalaliDate.nowDateStr()})`,
                        files: [file]
                    });
                } catch (_) {}
            }

            // کپی متن آماده گزارش (ابتدا خلاصه بالانس نهایی، سپس ریز تراکنش‌ها)
            async copyTextReport(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const balances = this.getCounterpartyBalances(cpId).filter(b => b.balance !== 0);
                const txs = this.getCounterpartyTransactions(cpId);

                let lines = [];
                lines.push(`📊 صورت‌حساب: ${cp.name}`);
                lines.push(`🗓 تاریخ: ${JalaliDate.nowDateTimeStr()}`);
                lines.push('');
                lines.push('📌 خلاصه بالانس نهایی (از دید طرف حساب):');
                if (balances.length === 0) {
                    lines.push('✅ کل حساب در تمام ارزها تسویه (۰) است.');
                } else {
                    for (const b of balances) {
                        const status = b.balance > 0 ? 'طلبکار' : 'بدهکار';
                        lines.push(`• ${b.currency.name}: ${formatSignedNum(b.balance)} (${status})`);
                    }
                }

                lines.push('');
                lines.push('───────────────');
                lines.push(`📋 ریز تراکنش‌ها (${txs.length} مورد):`);

                if (txs.length === 0) {
                    lines.push('تراکنشی ثبت نشده است.');
                } else {
                    for (const tx of txs) {
                        lines.push('');
                        let head = `[${tx.code}] ${tx.dateJalali}`;
                        if (tx.mode === 'opening') {
                            const c1 = this.getCurrency(tx.curr1);
                            const dir = tx.side === 'credit' ? 'طلبکار' : 'بدهکار';
                            lines.push(`${head} | مانده اولیه (نقطه شروع)`);
                            lines.push(`  مبلغ شروع: ${formatNum(tx.amt1, 6)} ${c1.name} (${dir})`);
                        } else if (tx.mode === 'deal') {
                            const c1 = this.getCurrency(tx.curr1);
                            const c2 = this.getCurrency(tx.curr2);
                            const cFee = this.getCurrency(tx.feeCurr || tx.curr2);
                            const verb = tx.side === 'sell' ? 'معامله (خرید شما)' : 'معامله (فروش شما)';
                            const op = tx.op === 'div' ? '÷' : '×';
                            lines.push(`${head} | ${verb}`);
                            lines.push(`  ${formatNum(tx.amt1, 6)} ${c1.name} ${op} ${formatNum(tx.rate, 6)} = ${formatNum(tx.baseTotal, 6)} ${c2.name}${tx.fee > 0 ? ` | کارمزد: ${formatNum(tx.fee)} ${cFee.name}${cFee.id === c2.id ? ` ← نهایی: ${formatNum(tx.finalExact, 6)}` : ''}` : ''}`);
                        } else {
                            const c1 = this.getCurrency(tx.curr1);
                            const verb = tx.side === 'receive' ? 'انتقال (واریز شما)' : 'انتقال (دریافت شما)';
                            lines.push(`${head} | ${verb}`);
                            lines.push(`  مبلغ: ${formatNum(tx.amt1, 6)} ${c1.name}${tx.fee > 0 ? ` | کارمزد: ${formatNum(tx.fee)} ← خالص: ${formatNum(tx.finalExact, 6)}` : ''}`);
                        }
                        const legStr = tx.legs.map(l => {
                            const c = this.getCurrency(l.currencyId);
                            return `${formatSignedNum(l.effectiveDelta)} ${c.name}`;
                        }).join(' | ');
                        lines.push(`  اثر حساب: ${legStr}`);
                        if (tx.roundingNotes?.length) {
                            tx.roundingNotes.forEach(n => lines.push(`  ℹ️ ${n}`));
                        }
                        if (tx.description) {
                            lines.push(`  📝 ${tx.description}`);
                        }
                    }
                }

                const ok = await copyTextSafe(lines.join('\n'));
                showToast(ok ? 'متن کامل گزارش (بالانس در ابتدا + ریز تراکنش‌ها) کپی شد!' : 'خطا در کپی متن.', ok ? 'success' : 'error');
            }

            // خروجی PDF رسمی قابل چاپ
            exportPdfStatement(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const balances = this.getCounterpartyBalances(cpId).filter(b => b.balance !== 0);
                const txs = this.getCounterpartyTransactions(cpId);

                const summaryRows = balances.length === 0
                    ? `<tr><td colspan="3" style="text-align:center;">کل حساب تسویه (۰) است</td></tr>`
                    : balances.map(b => `
                        <tr>
                            <td>${escapeHtml(b.currency.name)} (${escapeHtml(b.currency.code)})</td>
                            <td dir="ltr" style="font-family:Inter,sans-serif;text-align:left;" class="${b.balance > 0 ? 'print-badge-pos' : 'print-badge-neg'}">${formatSignedNum(b.balance)}</td>
                            <td class="${b.balance > 0 ? 'print-badge-pos' : 'print-badge-neg'}">${b.balance > 0 ? 'طلبکار (بستانکار)' : 'بدهکار'}</td>
                        </tr>
                    `).join('');

                const txRows = txs.length === 0
                    ? `<tr><td colspan="6" style="text-align:center;">تراکنشی ثبت نشده است</td></tr>`
                    : txs.map(tx => {
                        let typeTxt = '';
                        let detailTxt = '';
                        if (tx.mode === 'opening') {
                            const c1 = this.getCurrency(tx.curr1);
                            typeTxt = 'مانده اولیه';
                            detailTxt = `مانده شروع: ${formatNum(tx.amt1, 6)} ${c1.name} (${tx.side === 'credit' ? 'طلبکار' : 'بدهکار'})`;
                        } else if (tx.mode === 'deal') {
                            const c1 = this.getCurrency(tx.curr1);
                            const c2 = this.getCurrency(tx.curr2);
                            const cFee = this.getCurrency(tx.feeCurr || tx.curr2);
                            typeTxt = tx.side === 'sell' ? 'معامله فروش' : 'معامله خرید';
                            detailTxt = `${formatNum(tx.amt1, 6)} ${c1.name} ${tx.op === 'div' ? '÷' : '×'} ${formatNum(tx.rate, 6)} = ${formatNum(tx.finalExact, 6)} ${c2.name}${tx.fee > 0 ? ` (کارمزد ${formatNum(tx.fee)} ${cFee.name})` : ''}`;
                        } else {
                            const c1 = this.getCurrency(tx.curr1);
                            typeTxt = tx.side === 'receive' ? 'دریافت (واریز طرف حساب)' : 'پرداخت (واریز صرافی)';
                            detailTxt = `${formatNum(tx.amt1, 6)} ${c1.name}${tx.fee > 0 ? ` (کارمزد ${formatNum(tx.fee)})` : ''}`;
                        }
                        const impactHtml = tx.legs.map(l => {
                            const c = this.getCurrency(l.currencyId);
                            return `<div dir="ltr" style="font-family:Inter,sans-serif;text-align:left;" class="${l.effectiveDelta > 0 ? 'print-badge-pos' : 'print-badge-neg'}">${formatSignedNum(l.effectiveDelta)} ${escapeHtml(c.code)}</div>`;
                        }).join('');
                        const notes = [...(tx.roundingNotes || []), tx.description].filter(Boolean).join(' — ');
                        return `
                            <tr>
                                <td dir="ltr" style="font-family:Inter,sans-serif;">${escapeHtml(tx.code)}</td>
                                <td dir="ltr" style="font-family:Inter,sans-serif;">${escapeHtml(tx.dateJalali)}</td>
                                <td>${typeTxt}</td>
                                <td>${escapeHtml(detailTxt)}</td>
                                <td>${impactHtml}</td>
                                <td>${escapeHtml(notes || '—')}</td>
                            </tr>
                        `;
                    }).join('');

                document.getElementById('print-area').innerHTML = `
                    <div style="border-bottom:2px solid #0f172a;padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <h1 style="font-size:20px;font-weight:800;margin:0;">صورت‌حساب رسمی ارزی</h1>
                            <div style="font-size:13px;margin-top:4px;">طرف حساب: <strong>${escapeHtml(cp.name)}</strong> ${cp.note ? `(${escapeHtml(cp.note)})` : ''}</div>
                        </div>
                        <div style="text-align:left;font-size:12px;">
                            <div>تاریخ گزارش: <span dir="ltr" style="font-family:Inter,sans-serif;">${JalaliDate.nowDateTimeStr()}</span></div>
                            <div style="color:#475569;margin-top:2px;">وضعیت از دید طرف حساب</div>
                        </div>
                    </div>

                    <h2 style="font-size:14px;font-weight:700;margin:0 0 6px 0;">۱. خلاصه بالانس نهایی</h2>
                    <table class="print-table" style="margin-bottom:20px;">
                        <thead>
                            <tr>
                                <th>ارز</th>
                                <th>مانده نهایی</th>
                                <th>وضعیت طرف حساب</th>
                            </tr>
                        </thead>
                        <tbody>${summaryRows}</tbody>
                    </table>

                    <h2 style="font-size:14px;font-weight:700;margin:0 0 6px 0;">۲. ریز تراکنش‌ها (${txs.length} مورد)</h2>
                    <table class="print-table">
                        <thead>
                            <tr>
                                <th>شناسه</th>
                                <th>تاریخ شمسی</th>
                                <th>نوع</th>
                                <th>جزئیات محاسبه</th>
                                <th>اثر روی حساب</th>
                                <th>توضیحات / گرد کردن</th>
                            </tr>
                        </thead>
                        <tbody>${txRows}</tbody>
                    </table>
                `;

                setTimeout(() => window.print(), 100);
            }

            // خروجی اکسل (CSV با UTF-8 BOM برای نمایش صحیح فارسی در Excel)
            exportCsvStatement(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const balances = this.getCounterpartyBalances(cpId).filter(b => b.balance !== 0);
                const txs = this.getCounterpartyTransactions(cpId);

                const csvCell = (val) => {
                    const s = String(val === null || val === undefined ? '' : val);
                    return `"${s.replace(/"/g, '""')}"`;
                };

                const rows = [];
                rows.push(['صورت‌حساب طرف حساب', cp.name, 'تاریخ گزارش', JalaliDate.nowDateTimeStr()]);
                rows.push([]);
                rows.push(['خلاصه بالانس نهایی (از دید طرف حساب)']);
                rows.push(['ارز', 'کد ارز', 'مانده نهایی', 'وضعیت']);
                if (balances.length === 0) {
                    rows.push(['همه ارزها', '-', '0', 'تسویه']);
                } else {
                    for (const b of balances) {
                        rows.push([b.currency.name, b.currency.code, b.balance, b.balance > 0 ? 'طلبکار' : 'بدهکار']);
                    }
                }

                rows.push([]);
                rows.push(['ریز تراکنش‌ها']);
                rows.push(['شناسه', 'تاریخ شمسی', 'ساعت', 'نوع تراکنش', 'ارز ۱', 'مبلغ ۱', 'عملیات', 'نرخ', 'ارز ۲', 'کارمزد', 'مبلغ دقیق نهایی', 'اثر مؤثر روی حساب', 'یادداشت گرد کردن', 'توضیحات']);

                for (const tx of txs) {
                    const c1 = this.getCurrency(tx.curr1);
                    const c2 = tx.curr2 ? this.getCurrency(tx.curr2) : null;
                    const typeMap = {
                        deal_sell: 'معامله فروش',
                        deal_buy: 'معامله خرید',
                        transfer_receive: 'دریافت (تک ارزی)',
                        transfer_pay: 'پرداخت (تک ارزی)',
                        opening_credit: 'مانده اولیه (طلبکار)',
                        opening_debit: 'مانده اولیه (بدهکار)'
                    };
                    const impact = tx.legs.map(l => `${formatSignedNum(l.effectiveDelta)} ${this.getCurrency(l.currencyId).code}`).join(' | ');
                    rows.push([
                        tx.code,
                        tx.dateJalali,
                        tx.timeStr || '',
                        typeMap[`${tx.mode}_${tx.side}`] || '',
                        c1.name,
                        tx.amt1,
                        tx.mode === 'deal' ? (tx.op === 'div' ? 'تقسیم' : 'ضرب') : '-',
                        tx.rate || '-',
                        c2 ? c2.name : '-',
                        tx.fee || 0,
                        tx.finalExact,
                        impact,
                        (tx.roundingNotes || []).join(' | '),
                        tx.description || ''
                    ]);
                }

                const csvContent = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `statement-${cp.name}-${JalaliDate.nowDateStr().replace(/\//g, '-')}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('فایل اکسل (CSV) با موفقیت دانلود شد.', 'success');
            }

            // پشتیبان‌گیری و بازیابی JSON
            downloadBackupJson() {
                const jsonStr = JSON.stringify(this.state, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sarrafi-backup-${JalaliDate.nowDateStr().replace(/\//g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('فایل پشتیبان JSON دانلود شد.', 'success');
            }

            handleBackupUpload(event) {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || !Array.isArray(parsed.currencies) || !Array.isArray(parsed.counterparties) || !Array.isArray(parsed.transactions)) {
                            showToast('ساختار فایل پشتیبان معتبر نیست.', 'error');
                            return;
                        }
                        this.openConfirmModal({
                            title: 'بازیابی نسخه پشتیبان',
                            message: `فایل شامل ${parsed.counterparties.length} طرف حساب و ${parsed.transactions.length} تراکنش است. بازیابی، جایگزین اطلاعات فعلی خواهد شد. ادامه می‌دهید؟`,
                            confirmText: 'بازیابی اطلاعات',
                            danger: false,
                            onConfirm: () => {
                                this.state = {
                                    version: 1,
                                    updatedAt: Date.now(),
                                    nextTxSeq: parsed.nextTxSeq || 1001,
                                    nextObSeq: parsed.nextObSeq || 1001,
                                    settings: {
                                        roundingThreshold: typeof parsed.settings?.roundingThreshold === 'number' ? parsed.settings.roundingThreshold : 0.1
                                    },
                                    currencies: parsed.currencies,
                                    counterparties: parsed.counterparties,
                                    transactions: parsed.transactions,
                                    auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : []
                                };
                                this.ui.selectedCounterpartyId = null;
                                this.saveState();
                                this.render();
                                showToast('نسخه پشتیبان با موفقیت بازیابی شد.', 'success');
                            }
                        });
                    } catch (_) {
                        showToast('خطا در خواندن فایل JSON.', 'error');
                    }
                };
                reader.readAsText(file);
            }
        }

        // راه‌اندازی اپلیکیشن و اتصال سراسری
        window.app = new LedgerApp();
    </script>
</body>
</html>
