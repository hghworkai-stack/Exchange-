    <!-- منطق اصلی نرم‌افزار + همگام‌سازی ابری Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 1. الگوریتم دقیق تبدیل تاریخ میلادی و شمسی (Borkowski / Jalaali-JS)
        // =========================================================================
        const JalaliDate = (() => {
            const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

            function div(a, b) { return ~~(a / b); }
            function mod(a, b) { return a - ~~(a / b) * b; }

            function jalCal(jy) {
                let bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump, leap, n, i;
                if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
                for (i = 1; i < bl; i += 1) {
                    jm = breaks[i];
                    jump = jm - jp;
                    if (jy < jm) break;
                    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
                    jp = jm;
                }
                n = jy - jp;
                leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
                if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
                const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
                const march = 20 + leapJ - leapG;
                if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
                leap = mod(mod(n + 1, 33) - 1, 4);
                if (leap === -1) leap = 4;
                return { leap, gy, march };
            }

            function g2d(gy, gm, gd) {
                let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
                    + div(153 * mod(gm + 9, 12) + 2, 5)
                    + gd - 34840408;
                d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
                return d;
            }

            function d2g(jdn) {
                let j = 4 * jdn + 139361631;
                j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
                const i = div(mod(j, 1461), 4) * 5 + 308;
                const gd = div(mod(i, 153), 5) + 1;
                const gm = mod(div(i, 153), 12) + 1;
                const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
                return { gy, gm, gd };
            }

            function j2d(jy, jm, jd) {
                const r = jalCal(jy);
                return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
            }

            function d2j(jdn) {
                const gy = d2g(jdn).gy;
                let jy = gy - 621;
                const r = jalCal(jy);
                const jdn1f = g2d(gy, 3, r.march);
                let jd, jm, k = jdn - jdn1f;
                if (k >= 0) {
                    if (k <= 185) {
                        jm = 1 + div(k, 31);
                        jd = mod(k, 31) + 1;
                        return { jy, jm, jd };
                    } else {
                        k -= 186;
                    }
                } else {
                    jy -= 1;
                    k += 179;
                    if (r.leap === 1) k += 1;
                }
                jm = 7 + div(k, 30);
                jd = mod(k, 30) + 1;
                return { jy, jm, jd };
            }

            function toJalaali(gy, gm, gd) {
                return d2j(g2d(gy, gm, gd));
            }

            function pad2(n) { return String(n).padStart(2, '0'); }

            function nowDateStr(dateObj = new Date()) {
                const j = toJalaali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
                return `${j.jy}/${pad2(j.jm)}/${pad2(j.jd)}`;
            }

            function nowTimeStr(dateObj = new Date()) {
                return `${pad2(dateObj.getHours())}:${pad2(dateObj.getMinutes())}`;
            }

            function nowDateTimeStr(dateObj = new Date()) {
                return `${nowDateStr(dateObj)} - ${nowTimeStr(dateObj)}`;
            }

            function isValidJalaliString(str) {
                const clean = normalizeDigits(str || '').trim();
                const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(clean);
                if (!m) return false;
                const jy = parseInt(m[1], 10), jm = parseInt(m[2], 10), jd = parseInt(m[3], 10);
                if (jy < 1300 || jy > 1550 || jm < 1 || jm > 12 || jd < 1) return false;
                const maxDay = jm <= 6 ? 31 : (jm <= 11 ? 30 : 30);
                return jd <= maxDay;
            }

            function formatJalaliNormalized(str) {
                const clean = normalizeDigits(str || '').trim();
                const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(clean);
                if (!m) return nowDateStr();
                return `${m[1]}/${pad2(m[2])}/${pad2(m[3])}`;
            }

            return { toJalaali, nowDateStr, nowTimeStr, nowDateTimeStr, isValidJalaliString, formatJalaliNormalized };
        })();

        // =========================================================================
        // 2. توابع کمکی اعداد، نرمال‌سازی، دقت ممیز شناور و امنیت HTML
        // =========================================================================
        const PERSIAN_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
        const ARABIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';

        function normalizeDigits(str) {
            if (str === null || str === undefined) return '';
            let s = String(str);
            for (let i = 0; i < 10; i++) {
                s = s.replaceAll(PERSIAN_DIGITS[i], String(i));
                s = s.replaceAll(ARABIC_DIGITS[i], String(i));
            }
            // تبدیل ممیز فارسی به نقطه
            s = s.replace(/٫/g, '.');
            return s;
        }

        function parseNumericInput(str) {
            const cleaned = normalizeDigits(str).replace(/[,٬\s]/g, '');
            if (cleaned === '' || cleaned === '-' || cleaned === '.') return NaN;
            return Number(cleaned);
        }

        // قالب‌بندی زنده ورودی عددی با جداکننده هزارگان هنگام تایپ (پشتیبانی از اعشار و ارقام فارسی/انگلیسی)
        function formatInputNumberString(rawStr) {
            let s = normalizeDigits(rawStr).replace(/[^0-9.]/g, '');
            const firstDot = s.indexOf('.');
            if (firstDot !== -1) {
                s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
            }
            if (!s) return '';
            const parts = s.split('.');
            const intPart = parts[0].replace(/^0+(?=\d)/, '');
            const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            if (parts.length > 1) {
                return `${formattedInt || '0'}.${parts[1]}`;
            }
            return formattedInt;
        }

        function applyLiveThousandSeparator(inputEl) {
            if (!inputEl) return '';
            const rawVal = inputEl.value;
            const selStart = inputEl.selectionStart ?? rawVal.length;
            const digitsBeforeCursor = normalizeDigits(rawVal.slice(0, selStart)).replace(/[^0-9.]/g, '').length;
            const formatted = formatInputNumberString(rawVal);
            if (inputEl.value !== formatted) {
                inputEl.value = formatted;
                let count = 0;
                let newPos = formatted.length;
                for (let i = 0; i < formatted.length; i++) {
                    if (/[0-9.]/.test(formatted[i])) count++;
                    if (count >= digitsBeforeCursor) {
                        newPos = i + 1;
                        break;
                    }
                }
                if (digitsBeforeCursor === 0) newPos = 0;
                try { inputEl.setSelectionRange(newPos, newPos); } catch (_) {}
            }
            return formatted;
        }

        // حذف نویز ممیز شناور IEEE-754 با حفظ دقت مالی کامل
        function cleanFloat(num) {
            if (!Number.isFinite(num)) return 0;
            if (Math.abs(num) < 1e-9) return 0;
            return parseFloat(num.toPrecision(13));
        }

        function formatNum(val, maxDecimals = 4) {
            const num = cleanFloat(Number(val) || 0);
            if (num === 0) return '0';
            const absVal = Math.abs(num);
            const sign = num < 0 ? '-' : '';
            const formatted = absVal.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: maxDecimals
            });
            return sign + formatted;
        }

        function formatSignedNum(val, maxDecimals = 4) {
            const num = cleanFloat(Number(val) || 0);
            if (num === 0) return '0';
            return (num > 0 ? '+' : '-') + formatNum(Math.abs(num), maxDecimals);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function generateId(prefix = 'id') {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        }

        // کپی ایمن متن (سازگار با iFrame و مرورگرهای موبایل)
        async function copyTextSafe(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (_) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (_) {
                return false;
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const styles = {
                success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200',
                error: 'bg-rose-950/95 border-rose-500/50 text-rose-200',
                info: 'bg-slate-900/95 border-slate-600 text-slate-100'
            };
            el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl border shadow-2xl text-xs sm:text-sm font-medium animate-slide-up backdrop-blur-md ${styles[type] || styles.info}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.25s ease';
                setTimeout(() => el.remove(), 260);
            }, 2600);
        }

        // =========================================================================
        // 3. منطق دقیق حسابداری و گرد کردن هوشمند به نفع طرف حساب
        // =========================================================================
        const DEFAULT_CURRENCIES = [
            { id: 'USD',   code: 'USD',   name: 'دلار',       symbol: '$',     exactNoRound: false },
            { id: 'IRT',   code: 'IRT',   name: 'تومان',      symbol: 'تومان', exactNoRound: true  },
            { id: 'USD_H', code: 'USD_H', name: 'دلار حواله', symbol: '$H',    exactNoRound: false },
            { id: 'EUR',   code: 'EUR',   name: 'یورو',       symbol: '€',     exactNoRound: false },
            { id: 'USDT',  code: 'USDT',  name: 'تتر',        symbol: '₮',     exactNoRound: false },
            { id: 'AED',   code: 'AED',   name: 'درهم',       symbol: 'د.إ',   exactNoRound: false },
            { id: 'CNY',   code: 'CNY',   name: 'یوان',       symbol: '¥',     exactNoRound: false },
            { id: 'OMR',   code: 'OMR',   name: 'ریال عمان',  symbol: 'ر.ع',   exactNoRound: false }
        ];

        /**
         * قانون گرد کردن هوشمند به نفع طرف حساب:
         * - تومان (exactNoRound === true): هرگز گرد نمی‌شود.
         * - ارزهای دیگر:
         *   * اگر تغییر مانده طرف حساب مثبت باشد (+ طلبکار شدن طرف حساب / بدهی شما):
         *     به نفع طرف حساب = گرد به بالا (ceil)، مگر اینکه خرده <= آستانه (0.1) باشد که به پایین گرد می‌شود.
         *     مثال: +10.1 -> +10 | +10.15 -> +11 | +10.8 -> +11
         *   * اگر تغییر مانده طرف حساب منفی باشد (- بدهکار شدن طرف حساب / طلب شما):
         *     به نفع طرف حساب = گرد به پایین در قدرمطلق (بدهی کمتر)، مگر اینکه (1 - خرده) <= آستانه (0.1) باشد که به بالا گرد می‌شود.
         *     مثال: -10.8 -> -10 | -10.2 -> -10 | -10.9 -> -11 | -10.95 -> -11
         */
        function applySmartRounding(exactDelta, currency, applyRounding, threshold = 0.1) {
            const cleanExact = cleanFloat(exactDelta);
            if (!applyRounding || !currency || currency.exactNoRound || cleanExact === 0) {
                return { exact: cleanExact, effective: cleanExact, rounded: false, note: '' };
            }

            const absVal = Math.abs(cleanExact);
            const intPart = Math.floor(absVal);
            const frac = cleanFloat(absVal - intPart);

            if (frac <= 1e-6) {
                return { exact: cleanExact, effective: cleanExact, rounded: false, note: '' };
            }

            let effMag;
            const eps = 1e-7;
            if (cleanExact > 0) {
                // طلبکار شدن طرف حساب: به نفع طرف حساب یعنی گرد به بالا، مگر خرده <= threshold
                effMag = (frac <= threshold + eps) ? intPart : (intPart + 1);
            } else {
                // بدهکار شدن طرف حساب: به نفع طرف حساب یعنی بدهی کمتر (intPart)، مگر (1 - خرده) <= threshold
                effMag = (cleanFloat(1 - frac) <= threshold + eps) ? (intPart + 1) : intPart;
            }

            const effective = cleanExact > 0 ? effMag : -effMag;
            const note = `گرد کردن: مبلغ دقیق ${formatNum(absVal, 6)} ${currency.name} به ${formatNum(Math.abs(effective), 0)} ${currency.name} (به نفع طرف حساب)`;

            return {
                exact: cleanExact,
                effective: cleanFloat(effective),
                rounded: true,
                note
            };
        }

        // محاسبه کامل یک تراکنش (چه برای پیش‌نمایش زنده، چه برای ثبت نهایی)
        function calculateTransactionEffects(input, currencies, roundingThreshold) {
            const getCurr = (id) => currencies.find(c => c.id === id);

            if (input.mode === 'opening') {
                const c1 = getCurr(input.curr1);
                const amt1 = cleanFloat(input.amt1);
                if (!c1) return { error: 'لطفاً ارز مانده اولیه را انتخاب کنید.' };
                if (!(amt1 > 0)) return { error: 'مبلغ مانده اولیه باید بزرگ‌تر از صفر باشد.' };
                const delta = input.side === 'credit' ? amt1 : cleanFloat(-amt1);
                return {
                    error: null,
                    baseTotal: amt1,
                    finalExact: amt1,
                    feeCurr: c1.id,
                    feeMode: null,
                    legs: [
                        { currencyId: c1.id, exactDelta: delta, effectiveDelta: delta, rounded: false, roundingNote: '' }
                    ],
                    roundingNotes: []
                };
            }

            if (input.mode === 'deal') {
                const c1 = getCurr(input.curr1);
                const c2 = getCurr(input.curr2);
                const feeCurrId = input.feeCurr || input.curr2;
                const cFee = getCurr(feeCurrId) || c2;
                const amt1 = cleanFloat(input.amt1);
                const rate = cleanFloat(input.rate);
                const fee = cleanFloat(input.fee || 0);

                if (!c1 || !c2) return { error: 'لطفاً هر دو ارز را انتخاب کنید.' };
                if (c1.id === c2.id) return { error: 'در معامله دو ارزی، ارز اول و ارز دوم نمی‌توانند یکسان باشند.' };
                if (!(amt1 > 0)) return { error: 'مبلغ ارز اول باید بزرگ‌تر از صفر باشد.' };
                if (!(rate > 0)) return { error: 'نرخ تبدیل باید بزرگ‌تر از صفر باشد.' };
                if (fee < 0) return { error: 'کارمزد نمی‌تواند منفی باشد.' };

                const baseTotal = input.op === 'div' ? cleanFloat(amt1 / rate) : cleanFloat(amt1 * rate);
                const feeInCurr2 = (cFee.id === c2.id);
                const feeMode = input.side === 'sell' ? 'add' : (input.feeMode || 'add');
                const finalExact = (feeInCurr2 && fee > 0)
                    ? (feeMode === 'add' ? cleanFloat(baseTotal + fee) : cleanFloat(baseTotal - fee))
                    : baseTotal;

                if (finalExact < 0) return { error: 'مبلغ نهایی پس از کسر کارمزد نمی‌تواند منفی باشد.' };

                // دیدگاه طرف حساب:
                // فروش شما به طرف حساب => طرف حساب ارز ۱ طلبکار (+amt1) و ارز ۲ بدهکار (-finalExact)
                // خرید شما از طرف حساب => طرف حساب ارز ۱ بدهکار (-amt1) و ارز ۲ طلبکار (+finalExact)
                const rawDelta1 = input.side === 'sell' ? amt1 : -amt1;
                const rawDelta2 = input.side === 'sell' ? -finalExact : finalExact;

                const r1 = applySmartRounding(rawDelta1, c1, input.applyRounding, roundingThreshold);
                const r2 = applySmartRounding(rawDelta2, c2, input.applyRounding, roundingThreshold);

                const legs = [
                    { currencyId: c1.id, exactDelta: r1.exact, effectiveDelta: r1.effective, rounded: r1.rounded, roundingNote: r1.note },
                    { currencyId: c2.id, exactDelta: r2.exact, effectiveDelta: r2.effective, rounded: r2.rounded, roundingNote: r2.note }
                ];
                const roundingNotes = [r1.note, r2.note].filter(Boolean);

                // اگر کارمزد در ارزی غیر از ارز دوم انتخاب شده باشد، به عهده طرف حساب (بدهکار) ثبت می‌شود
                if (!feeInCurr2 && fee > 0) {
                    const rFee = applySmartRounding(-fee, cFee, input.applyRounding, roundingThreshold);
                    legs.push({
                        currencyId: cFee.id,
                        exactDelta: rFee.exact,
                        effectiveDelta: rFee.effective,
                        rounded: rFee.rounded,
                        roundingNote: rFee.note,
                        isFeeLeg: true
                    });
                    if (rFee.note) roundingNotes.push(rFee.note);
                }

                return {
                    error: null,
                    baseTotal,
                    finalExact,
                    feeCurr: cFee.id,
                    feeMode,
                    legs,
                    roundingNotes
                };
            } else {
                // انتقال تک ارزی (Transfer)
                const c1 = getCurr(input.curr1);
                const amt1 = cleanFloat(input.amt1);
                const fee = cleanFloat(input.fee || 0);

                if (!c1) return { error: 'لطفاً ارز را انتخاب کنید.' };
                if (!(amt1 > 0)) return { error: 'مبلغ انتقال باید بزرگ‌تر از صفر باشد.' };
                if (fee < 0) return { error: 'کارمزد نمی‌تواند منفی باشد.' };

                // دریافت از طرف حساب (واریز به شما) => +(amount - fee) به بالانس طرف حساب
                // پرداخت به طرف حساب (واریز شما) => -(amount + fee) به بالانس طرف حساب
                let rawDelta;
                if (input.side === 'receive') {
                    rawDelta = cleanFloat(amt1 - fee);
                    if (rawDelta < 0) return { error: 'کارمزد نمی‌تواند بیشتر از مبلغ دریافتی باشد.' };
                } else {
                    rawDelta = cleanFloat(-(amt1 + fee));
                }

                const r1 = applySmartRounding(rawDelta, c1, input.applyRounding, roundingThreshold);
                const legs = [
                    { currencyId: c1.id, exactDelta: r1.exact, effectiveDelta: r1.effective, rounded: r1.rounded, roundingNote: r1.note }
                ];
                const roundingNotes = r1.note ? [r1.note] : [];

                return {
                    error: null,
                    baseTotal: amt1,
                    finalExact: Math.abs(rawDelta),
                    feeCurr: c1.id,
                    feeMode: input.side === 'receive' ? 'sub' : 'add',
                    legs,
                    roundingNotes
                };
            }
        }

        // =========================================================================
        // 4. مدیریت وضعیت (State)، ذخیره محلی (localStorage) و همگام‌سازی ابری (Firebase)
        // =========================================================================
        const STORAGE_KEY = 'sarrafi_smart_ledger_v1';

        function createInitialState() {
            return {
                version: 1,
                updatedAt: Date.now(),
                nextTxSeq: 1001,
                nextObSeq: 1001,
                settings: {
                    roundingThreshold: 0.1
                },
                currencies: structuredClone(DEFAULT_CURRENCIES),
                counterparties: [],
                transactions: [],
                auditLogs: []
            };
        }

        class LedgerApp {
            constructor() {
                this.state = this.loadLocalState();
                this.ui = {
                    activeTab: 'accounts',          // accounts | dashboard | audit | settings
                    selectedCounterpartyId: null,   // null = list view, id = detail view
                    accountSearch: '',
                    txSearch: '',
                    txFilterType: 'all',            // all | deal | transfer
                    txFilterCurrency: 'all',
                    showZeroBalancesCard: false,
                    showAllDashboardCurrencies: false,
                    auditSearch: '',
                    auditFilterAction: 'all',       // all | edit | delete
                    lastPngDataUrl: null,
                    lastPngBlob: null,
                    lastPngFileName: ''
                };

                // وضعیت Firebase
                this.cloud = {
                    enabled: false,
                    synced: false,
                    db: null,
                    user: null,
                    docRef: null,
                    unsub: null,
                    syncTimer: null
                };

                this.initHeaderClock();
                this.initFirebaseSync();
                this.render();
            }

            loadLocalState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return createInitialState();
                    const parsed = JSON.parse(raw);
                    if (!parsed || !Array.isArray(parsed.currencies)) return createInitialState();
                    return {
                        version: 1,
                        updatedAt: parsed.updatedAt || Date.now(),
                        nextTxSeq: parsed.nextTxSeq || 1001,
                        nextObSeq: parsed.nextObSeq || 1001,
                        settings: {
                            roundingThreshold: typeof parsed.settings?.roundingThreshold === 'number' ? parsed.settings.roundingThreshold : 0.1
                        },
                        currencies: parsed.currencies.length ? parsed.currencies : structuredClone(DEFAULT_CURRENCIES),
                        counterparties: Array.isArray(parsed.counterparties) ? parsed.counterparties : [],
                        transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
                        auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : []
                    };
                } catch (err) {
                    console.error('Error loading local state:', err);
                    return createInitialState();
                }
            }

            saveState(triggerCloud = true) {
                this.state.updatedAt = Date.now();
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                } catch (err) {
                    console.error('LocalStorage write failed:', err);
                    showToast('خطا در ذخیره محلی (ممکن است حافظه پر باشد)', 'error');
                }
                if (triggerCloud && this.cloud.enabled && this.cloud.user && this.cloud.docRef) {
                    this.scheduleCloudPush();
                }
            }

            updateSyncBadge(mode, text) {
                const dot = document.getElementById('syncDot');
                const label = document.getElementById('syncText');
                if (!dot || !label) return;
                label.textContent = text;
                dot.className = 'w-2 h-2 rounded-full ' + (
                    mode === 'cloud' ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]' :
                    mode === 'syncing' ? 'bg-sky-400 animate-pulse' :
                    'bg-amber-400'
                );
            }

            async initFirebaseSync() {
                try {
                    const hasConfig = typeof __firebase_config !== 'undefined' && __firebase_config;
                    if (!hasConfig) {
                        this.updateSyncBadge('local', 'ذخیره محلی');
                        return;
                    }
                    const firebaseConfig = typeof __firebase_config === 'string'
                        ? JSON.parse(__firebase_config)
                        : __firebase_config;

                    if (!firebaseConfig || !firebaseConfig.apiKey) {
                        this.updateSyncBadge('local', 'ذخیره محلی');
                        return;
                    }

                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sarrafi-smart-ledger';
                    const fbApp = initializeApp(firebaseConfig);
                    const auth = getAuth(fbApp);
                    const db = getFirestore(fbApp);

                    this.updateSyncBadge('syncing', 'اتصال ابری...');

                    // احراز هویت پیش از هر عملیات دیتابیس (قاعده الزامی)
                    let cred;
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        cred = await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        cred = await signInAnonymously(auth);
                    }

                    const user = cred?.user || auth.currentUser;
                    if (!user) {
                        this.updateSyncBadge('local', 'ذخیره محلی');
                        return;
                    }

                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'ledger', 'main');
                    this.cloud = { ...this.cloud, enabled: true, db, user, docRef };

                    // گوش دادن به تغییرات ابری با مدیریت خطا
                    this.cloud.unsub = onSnapshot(docRef, (snap) => {
                        if (!snap.exists()) {
                            // اولین بار: ارسال وضعیت محلی به ابر
                            this.pushToCloudNow();
                            return;
                        }
                        const data = snap.data();
                        if (data && data.payload && typeof data.updatedAt === 'number') {
                            if (data.updatedAt > this.state.updatedAt) {
                                try {
                                    const remoteState = JSON.parse(data.payload);
                                    if (remoteState && Array.isArray(remoteState.currencies)) {
                                        this.state = remoteState;
                                        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                                        this.render();
                                    }
                                } catch (e) {
                                    console.error('Failed parsing remote payload:', e);
                                }
                            } else if (this.state.updatedAt > data.updatedAt && (this.state.counterparties.length > 0 || this.state.transactions.length > 0)) {
                                this.pushToCloudNow();
                            }
                        }
                        this.cloud.synced = true;
                        this.updateSyncBadge('cloud', 'همگام‌سازی ابری');
                    }, (err) => {
                        console.warn('Firestore snapshot offline/error:', err);
                        this.updateSyncBadge('local', 'ذخیره محلی');
                    });

                } catch (err) {
                    console.warn('Cloud sync unavailable, running fully offline:', err);
                    this.updateSyncBadge('local', 'ذخیره محلی');
                }
            }

            scheduleCloudPush() {
                if (this.cloud.syncTimer) clearTimeout(this.cloud.syncTimer);
                this.updateSyncBadge('syncing', 'در حال همگام‌سازی...');
                this.cloud.syncTimer = setTimeout(() => this.pushToCloudNow(), 450);
            }

            async pushToCloudNow() {
                if (!this.cloud.enabled || !this.cloud.user || !this.cloud.docRef) return;
                try {
                    await setDoc(this.cloud.docRef, {
                        payload: JSON.stringify(this.state),
                        updatedAt: this.state.updatedAt
                    }, { merge: true });
                    this.cloud.synced = true;
                    this.updateSyncBadge('cloud', 'همگام‌سازی ابری');
                } catch (err) {
                    console.warn('Cloud push deferred (offline):', err);
                    this.updateSyncBadge('local', 'ذخیره محلی');
                }
            }

            initHeaderClock() {
                const update = () => {
                    const el = document.getElementById('headerJalaliDate');
                    if (el) el.textContent = JalaliDate.nowDateTimeStr();
                };
                update();
                setInterval(update, 30000);
            }

            // =========================================================================
            // 5. توابع محاسباتی بالانس‌ها و تراز کل
            // =========================================================================
            getCurrency(id) {
                return this.state.currencies.find(c => c.id === id) || { id, code: id, name: id, symbol: id, exactNoRound: false };
            }

            getCounterparty(id) {
                return this.state.counterparties.find(c => c.id === id);
            }

            // محاسبه مانده هر ارز برای یک طرف حساب (به ترتیب سفارشی ارزها)
            getCounterpartyBalances(counterpartyId) {
                const map = {};
                for (const c of this.state.currencies) {
                    map[c.id] = 0;
                }
                for (const tx of this.state.transactions) {
                    if (tx.counterpartyId !== counterpartyId) continue;
                    for (const leg of tx.legs) {
                        if (!(leg.currencyId in map)) map[leg.currencyId] = 0;
                        map[leg.currencyId] = cleanFloat(map[leg.currencyId] + leg.effectiveDelta);
                    }
                }
                // مرتب‌سازی مطابق ترتیب ارزهای تنظیم‌شده توسط کاربر
                const ordered = [];
                const seen = new Set();
                for (const c of this.state.currencies) {
                    ordered.push({ currency: c, balance: cleanFloat(map[c.id] || 0) });
                    seen.add(c.id);
                }
                for (const [cid, val] of Object.entries(map)) {
                    if (!seen.has(cid) && cleanFloat(val) !== 0) {
                        ordered.push({ currency: this.getCurrency(cid), balance: cleanFloat(val) });
                    }
                }
                return ordered;
            }

            // محاسبه تراز کل در تمام حساب‌ها به تفکیک ارز
            getGlobalDashboardStats() {
                const statsMap = {};
                for (const c of this.state.currencies) {
                    statsMap[c.id] = {
                        currency: c,
                        receivableFromCounterparties: 0, // بدهی طرف‌حساب‌ها (طلب شما)
                        payableToCounterparties: 0,      // طلب طرف‌حساب‌ها (بدهی شما)
                        netYou: 0,                       // خالص شما = طلب شما - بدهی شما
                        activeAccountsCount: 0
                    };
                }

                for (const cp of this.state.counterparties) {
                    const bals = this.getCounterpartyBalances(cp.id);
                    for (const item of bals) {
                        const cid = item.currency.id;
                        if (!statsMap[cid]) {
                            statsMap[cid] = {
                                currency: item.currency,
                                receivableFromCounterparties: 0,
                                payableToCounterparties: 0,
                                netYou: 0,
                                activeAccountsCount: 0
                            };
                        }
                        if (item.balance < 0) {
                            // طرف حساب بدهکار است => طلب شما
                            statsMap[cid].receivableFromCounterparties = cleanFloat(statsMap[cid].receivableFromCounterparties + Math.abs(item.balance));
                            statsMap[cid].activeAccountsCount++;
                        } else if (item.balance > 0) {
                            // طرف حساب طلبکار است => بدهی شما
                            statsMap[cid].payableToCounterparties = cleanFloat(statsMap[cid].payableToCounterparties + item.balance);
                            statsMap[cid].activeAccountsCount++;
                        }
                    }
                }

                const ordered = [];
                const seen = new Set();
                for (const c of this.state.currencies) {
                    const s = statsMap[c.id];
                    s.netYou = cleanFloat(s.receivableFromCounterparties - s.payableToCounterparties);
                    ordered.push(s);
                    seen.add(c.id);
                }
                for (const [cid, s] of Object.entries(statsMap)) {
                    if (!seen.has(cid)) {
                        s.netYou = cleanFloat(s.receivableFromCounterparties - s.payableToCounterparties);
                        ordered.push(s);
                    }
                }
                return ordered;
            }

            getCounterpartyTransactions(counterpartyId) {
                return this.state.transactions
                    .filter(t => t.counterpartyId === counterpartyId)
                    .sort((a, b) => {
                        if (b.dateJalali !== a.dateJalali) return b.dateJalali.localeCompare(a.dateJalali);
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    });
            }

            // =========================================================================
            // 6. ناوبری و رندر صفحات
            // =========================================================================
            switchTab(tab) {
                this.ui.activeTab = tab;
                if (tab !== 'accounts') {
                    this.ui.selectedCounterpartyId = null;
                }
                this.render();
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            openCounterparty(id) {
                this.ui.activeTab = 'accounts';
                this.ui.selectedCounterpartyId = id;
                this.ui.txSearch = '';
                this.ui.txFilterType = 'all';
                this.ui.txFilterCurrency = 'all';
                this.render();
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            backToAccountsList() {
                this.ui.selectedCounterpartyId = null;
                this.render();
            }

            updateNavStyles() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const isActive = btn.dataset.tab === this.ui.activeTab;
                    btn.className = `nav-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl transition min-h-[54px] ${
                        isActive
                            ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent'
                    }`;
                });
            }

            render() {
                this.updateNavStyles();
                const container = document.getElementById('mainContent');
                if (!container) return;

                if (this.ui.activeTab === 'accounts') {
                    if (this.ui.selectedCounterpartyId && this.getCounterparty(this.ui.selectedCounterpartyId)) {
                        container.innerHTML = this.renderCounterpartyDetail(this.ui.selectedCounterpartyId);
                    } else {
                        this.ui.selectedCounterpartyId = null;
                        container.innerHTML = this.renderAccountsList();
                    }
                } else if (this.ui.activeTab === 'dashboard') {
                    container.innerHTML = this.renderDashboard();
                } else if (this.ui.activeTab === 'audit') {
                    container.innerHTML = this.renderAuditLog();
                } else if (this.ui.activeTab === 'settings') {
                    container.innerHTML = this.renderSettings();
                }
            }

            // -------------------------------------------------------------------------
            // صفحه ۱: لیست طرف‌حساب‌ها
            // -------------------------------------------------------------------------
            renderAccountsList() {
                const q = this.ui.accountSearch.trim().toLowerCase();
                const list = this.state.counterparties
                    .filter(cp => !q || cp.name.toLowerCase().includes(q) || (cp.note || '').toLowerCase().includes(q))
                    .sort((a, b) => (b.lastActivityAt || b.createdAt || 0) - (a.lastActivityAt || a.createdAt || 0));

                let cardsHtml = '';
                if (this.state.counterparties.length === 0) {
                    cardsHtml = `
                        <div class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-8 text-center mt-4">
                            <div class="w-16 h-16 mx-auto rounded-3xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                                </svg>
                            </div>
                            <h3 class="text-base font-bold text-white mb-2">هنوز طرف حسابی تعریف نشده است</h3>
                            <p class="text-xs sm:text-sm text-slate-400 mb-5 leading-relaxed">برای شروع ثبت معاملات ارزی و دریافت/پرداخت‌ها، اولین طرف حساب را اضافه کنید.</p>
                            <button onclick="app.openCounterpartyModal()" class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">
                                <span>+ تعریف طرف حساب جدید</span>
                            </button>
                        </div>
                    `;
                } else if (list.length === 0) {
                    cardsHtml = `
                        <div class="bg-navy-900/70 border border-slate-800 rounded-3xl p-6 text-center text-slate-400 text-sm">
                            طرف حسابی با عبارت «${escapeHtml(this.ui.accountSearch)}» پیدا نشد.
                        </div>
                    `;
                } else {
                    cardsHtml = `<div class="space-y-3">` + list.map(cp => {
                        const balances = this.getCounterpartyBalances(cp.id).filter(b => b.balance !== 0);
                        const txCount = this.state.transactions.filter(t => t.counterpartyId === cp.id).length;

                        let balChips = '';
                        if (balances.length === 0) {
                            balChips = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-slate-800/90 text-slate-400 text-xs font-medium">تسویه (۰)</span>`;
                        } else {
                            balChips = balances.map(b => {
                                const isPos = b.balance > 0;
                                return `
                                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs ${
                                        isPos
                                            ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300'
                                            : 'bg-rose-500/10 border-rose-500/25 text-rose-300'
                                    }">
                                        <span class="font-medium">${escapeHtml(b.currency.name)}</span>
                                        <span dir="ltr" class="font-num font-bold">${formatSignedNum(b.balance)}</span>
                                        <span class="text-[10px] opacity-80">${isPos ? 'طلبکار' : 'بدهکار'}</span>
                                    </div>
                                `;
                            }).join('');
                        }

                        return `
                            <div onclick="app.openCounterparty('${cp.id}')" class="cursor-pointer bg-navy-900/90 hover:bg-navy-850 border border-slate-800/90 hover:border-emerald-500/40 rounded-3xl p-4 transition active:scale-[0.99] shadow-lg shadow-black/20">
                                <div class="flex items-start justify-between gap-3 mb-3">
                                    <div class="flex items-center gap-3 min-w-0">
                                        <div class="w-11 h-11 rounded-2xl bg-slate-800 border border-slate-700/80 flex items-center justify-center text-emerald-400 font-bold text-base shrink-0">
                                            ${escapeHtml(cp.name.charAt(0))}
                                        </div>
                                        <div class="min-w-0">
                                            <h3 class="font-bold text-white text-base truncate">${escapeHtml(cp.name)}</h3>
                                            <p class="text-xs text-slate-400 truncate mt-0.5">
                                                ${cp.note ? escapeHtml(cp.note) + ' • ' : ''}<span class="font-num">${txCount}</span> تراکنش
                                            </p>
                                        </div>
                                    </div>
                                    <div class="w-8 h-8 rounded-xl bg-slate-800/70 flex items-center justify-center text-slate-400 shrink-0">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                                        </svg>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${balChips}
                                </div>
                            </div>
                        `;
                    }).join('') + `</div>`;
                }

                return `
                    <div class="space-y-4 animate-fade-in">
                        <!-- نوار جستجو و دکمه افزودن طرف حساب -->
                        <div class="flex items-center gap-2.5">
                            <div class="relative flex-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input type="text" id="accountSearchInput" value="${escapeHtml(this.ui.accountSearch)}"
                                    oninput="app.setAccountSearch(this.value)"
                                    placeholder="جستجوی نام طرف حساب..."
                                    class="w-full h-12 pr-10 pl-4 rounded-2xl bg-navy-900 border border-slate-800 focus:border-emerald-500/60 focus:outline-none text-sm text-white placeholder-slate-500 transition">
                            </div>
                            <button onclick="app.openCounterpartyModal()" class="h-12 px-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-bold text-sm flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 transition shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                <span class="hidden sm:inline">طرف حساب جدید</span>
                                <span class="sm:hidden">جدید</span>
                            </button>
                        </div>

                        ${cardsHtml}
                    </div>
                `;
            }

            setAccountSearch(val) {
                this.ui.accountSearch = val;
                this.render();
                const el = document.getElementById('accountSearchInput');
                if (el) {
                    el.focus();
                    el.setSelectionRange(val.length, val.length);
                }
            }

            // -------------------------------------------------------------------------
            // صفحه ۲: پنل اختصاصی طرف حساب + کارت بصری بالانس + خروجی‌ها + ریز تراکنش‌ها
            // -------------------------------------------------------------------------
            renderCounterpartyDetail(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return '';

                const allBalances = this.getCounterpartyBalances(cpId);
                const visibleBalances = this.ui.showZeroBalancesCard
                    ? allBalances
                    : allBalances.filter(b => b.balance !== 0);

                const allTxs = this.getCounterpartyTransactions(cpId);
                const q = this.ui.txSearch.trim().toLowerCase();
                const filteredTxs = allTxs.filter(tx => {
                    if (this.ui.txFilterType !== 'all' && tx.mode !== this.ui.txFilterType) return false;
                    if (this.ui.txFilterCurrency !== 'all' && !tx.legs.some(l => l.currencyId === this.ui.txFilterCurrency)) return false;
                    if (q) {
                        const hay = `${tx.code} ${tx.description || ''} ${(tx.roundingNotes || []).join(' ')} ${tx.dateJalali}`.toLowerCase();
                        if (!hay.includes(q)) return false;
                    }
                    return true;
                });

                // سطرهای کارت بالانس
                let balanceRowsHtml = '';
                if (visibleBalances.length === 0) {
                    balanceRowsHtml = `
                        <div class="py-5 text-center rounded-2xl bg-navy-950/60 border border-slate-800/70">
                            <span class="inline-flex items-center gap-1.5 text-emerald-400 font-bold text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                کل حساب در تمام ارزها تسویه (۰) است
                            </span>
                        </div>
                    `;
                } else {
                    balanceRowsHtml = `<div class="space-y-2">` + visibleBalances.map(b => {
                        const isPos = b.balance > 0;
                        const isNeg = b.balance < 0;
                        const statusLabel = isPos ? 'طلبکار (بستانکار)' : (isNeg ? 'بدهکار' : 'تسویه');
                        const badgeCls = isPos
                            ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
                            : (isNeg ? 'bg-rose-500/15 text-rose-300 border-rose-500/30' : 'bg-slate-800 text-slate-400 border-slate-700');
                        const numCls = isPos ? 'text-emerald-400' : (isNeg ? 'text-rose-400' : 'text-slate-400');

                        return `
                            <div class="flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl bg-navy-950/75 border border-slate-800/80">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="w-8 h-8 rounded-xl bg-slate-800/90 border border-slate-700/60 flex items-center justify-center text-xs font-bold text-slate-200 shrink-0 font-num">${escapeHtml(b.currency.symbol)}</span>
                                    <div class="min-w-0">
                                        <div class="font-bold text-sm text-white truncate">${escapeHtml(b.currency.name)}</div>
                                        <span class="inline-block mt-0.5 text-[10px] px-2 py-0.5 rounded-lg border font-semibold ${badgeCls}">${statusLabel}</span>
                                    </div>
                                </div>
                                <div dir="ltr" class="font-num text-lg sm:text-xl font-extrabold tracking-tight ${numCls} shrink-0">
                                    ${formatSignedNum(b.balance)}
                                </div>
                            </div>
                        `;
                    }).join('') + `</div>`;
                }

                // رندر لیست تراکنش‌ها
                let txListHtml = '';
                if (allTxs.length === 0) {
                    txListHtml = `
                        <div class="bg-navy-900/70 border border-slate-800/80 rounded-3xl p-7 text-center text-slate-400 text-sm">
                            هنوز هیچ معامله یا انتقالی برای <strong class="text-white">${escapeHtml(cp.name)}</strong> ثبت نشده است.
                        </div>
                    `;
                } else if (filteredTxs.length === 0) {
                    txListHtml = `
                        <div class="bg-navy-900/70 border border-slate-800/80 rounded-3xl p-6 text-center text-slate-400 text-sm">
                            تراکنشی با فیلتر انتخاب‌شده یافت نشد.
                        </div>
                    `;
                } else {
                    txListHtml = `<div class="space-y-3">` + filteredTxs.map(tx => this.renderTransactionCard(tx)).join('') + `</div>`;
                }

                const currFilterOptions = this.state.currencies.map(c =>
                    `<option value="${c.id}" ${this.ui.txFilterCurrency === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
                ).join('');

                return `
                    <div class="space-y-4 animate-fade-in">
                        <!-- هدر بازگشت و ویرایش نام طرف حساب -->
                        <div class="flex items-center justify-between gap-2">
                            <button onclick="app.backToAccountsList()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-navy-900 border border-slate-800 hover:border-slate-700 text-slate-200 text-xs sm:text-sm font-medium transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                                </svg>
                                <span>همه حساب‌ها</span>
                            </button>
                            <div class="flex items-center gap-1.5">
                                <button onclick="app.openCounterpartyModal('${cp.id}')" class="px-3 py-2 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs font-medium transition">
                                    ویرایش حساب
                                </button>
                                <button onclick="app.confirmDeleteCounterparty('${cp.id}')" class="px-3 py-2 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 text-xs font-medium transition">
                                    حذف
                                </button>
                            </div>
                        </div>

                        <!-- کارت بصری وضعیت بالانس (بالای صفحه، آماده مشاهده و اشتراک) -->
                        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-navy-900 to-emerald-950/50 border border-emerald-500/30 p-4 sm:p-5 shadow-2xl shadow-black/40">
                            <div class="flex items-start justify-between gap-3 mb-4 pb-3 border-b border-slate-800/80">
                                <div>
                                    <div class="text-[11px] font-semibold text-emerald-400 tracking-wide mb-1">کارت وضعیت بالانس (از دید طرف حساب)</div>
                                    <h2 class="text-xl sm:text-2xl font-extrabold text-white">${escapeHtml(cp.name)}</h2>
                                    ${cp.note ? `<p class="text-xs text-slate-400 mt-0.5">${escapeHtml(cp.note)}</p>` : ''}
                                </div>
                                <div class="text-left shrink-0">
                                    <div dir="ltr" class="font-num text-xs font-semibold text-slate-300 bg-navy-950/80 border border-slate-800 px-2.5 py-1 rounded-xl">
                                        ${JalaliDate.nowDateTimeStr()}
                                    </div>
                                    <button onclick="app.toggleZeroBalancesCard()" class="mt-2 text-[11px] text-slate-400 hover:text-emerald-300 underline decoration-dotted transition">
                                        ${this.ui.showZeroBalancesCard ? 'مخفی کردن ارزهای صفر' : 'نمایش ارزهای تسویه (۰)'}
                                    </button>
                                </div>
                            </div>

                            ${balanceRowsHtml}
                        </section>

                        <!-- نوار دکمه‌های خروجی سریع (PNG / متن / PDF / اکسل) -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button onclick="app.openBalancePngModal('${cp.id}')" class="min-h-[46px] px-3 py-2.5 rounded-2xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span>تصویر (PNG)</span>
                            </button>
                            <button onclick="app.copyTextReport('${cp.id}')" class="min-h-[46px] px-3 py-2.5 rounded-2xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                </svg>
                                <span>کپی متن گزارش</span>
                            </button>
                            <button onclick="app.exportPdfStatement('${cp.id}')" class="min-h-[46px] px-3 py-2.5 rounded-2xl bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                </svg>
                                <span>خروجی PDF</span>
                            </button>
                            <button onclick="app.exportCsvStatement('${cp.id}')" class="min-h-[46px] px-3 py-2.5 rounded-2xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>اکسل (CSV)</span>
                            </button>
                        </div>

                        <!-- دکمه‌های ثبت معامله / انتقال و مانده اولیه -->
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                            <button onclick="app.openTransactionModal('${cp.id}')" class="sm:col-span-8 py-3.5 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-navy-950 font-extrabold text-sm sm:text-base shadow-xl shadow-emerald-500/20 flex items-center justify-center gap-2 transition active:scale-[0.98]">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                <span>ثبت معامله / انتقال جدید</span>
                            </button>
                            <button onclick="app.openOpeningBalanceModal('${cp.id}')" class="sm:col-span-4 py-3.5 px-4 rounded-2xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/35 text-cyan-200 font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition active:scale-[0.98]">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                                </svg>
                                <span>ثبت / ویرایش مانده اولیه</span>
                            </button>
                        </div>

                        <!-- بخش ریز تراکنش‌ها و فیلترها -->
                        <div class="pt-2 space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-bold text-slate-200">ریز تراکنش‌ها (<span class="font-num">${filteredTxs.length}</span>)</h3>
                            </div>

                            <!-- فیلتر جستجو، نوع و ارز -->
                            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                                <input type="text" id="txSearchInput" value="${escapeHtml(this.ui.txSearch)}"
                                    oninput="app.setTxFilter('txSearch', this.value)"
                                    placeholder="جستجو در شناسه، شرح، تاریخ..."
                                    class="sm:col-span-6 h-10 px-3.5 rounded-xl bg-navy-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:border-emerald-500/50 focus:outline-none">
                                <select onchange="app.setTxFilter('txFilterType', this.value)" class="sm:col-span-3 h-10 px-3 rounded-xl bg-navy-900 border border-slate-800 text-xs text-slate-200 focus:border-emerald-500/50 focus:outline-none">
                                    <option value="all" ${this.ui.txFilterType === 'all' ? 'selected' : ''}>همه نوع‌ها</option>
                                    <option value="deal" ${this.ui.txFilterType === 'deal' ? 'selected' : ''}>فقط معاملات (دو ارزی)</option>
                                    <option value="transfer" ${this.ui.txFilterType === 'transfer' ? 'selected' : ''}>فقط انتقال‌ها (تک ارزی)</option>
                                    <option value="opening" ${this.ui.txFilterType === 'opening' ? 'selected' : ''}>فقط مانده‌های اولیه</option>
                                </select>
                                <select onchange="app.setTxFilter('txFilterCurrency', this.value)" class="sm:col-span-3 h-10 px-3 rounded-xl bg-navy-900 border border-slate-800 text-xs text-slate-200 focus:border-emerald-500/50 focus:outline-none">
                                    <option value="all" ${this.ui.txFilterCurrency === 'all' ? 'selected' : ''}>همه ارزها</option>
                                    ${currFilterOptions}
                                </select>
                            </div>

                            ${txListHtml}
                        </div>
                    </div>
                `;
            }

            setTxFilter(key, val) {
                this.ui[key] = val;
                this.render();
                if (key === 'txSearch') {
                    const el = document.getElementById('txSearchInput');
                    if (el) {
                        el.focus();
                        el.setSelectionRange(val.length, val.length);
                    }
                }
            }

            toggleZeroBalancesCard() {
                this.ui.showZeroBalancesCard = !this.ui.showZeroBalancesCard;
                this.render();
            }

            renderTransactionCard(tx) {
                const badgeMap = {
                    deal_sell:    { text: 'معامله فروش', cls: 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30' },
                    deal_buy:     { text: 'معامله خرید', cls: 'bg-amber-500/15 text-amber-300 border-amber-500/30' },
                    transfer_receive: { text: 'دریافت (واریز به شما)', cls: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' },
                    transfer_pay: { text: 'پرداخت (واریز شما)', cls: 'bg-rose-500/15 text-rose-300 border-rose-500/30' },
                    opening_credit: { text: 'مانده اولیه (نقطه شروع)', cls: 'bg-cyan-500/15 text-cyan-200 border-cyan-400/40' },
                    opening_debit:  { text: 'مانده اولیه (نقطه شروع)', cls: 'bg-cyan-500/15 text-cyan-200 border-cyan-400/40' }
                };
                const badge = badgeMap[`${tx.mode}_${tx.side}`] || { text: 'تراکنش', cls: 'bg-slate-800 text-slate-300 border-slate-700' };
                const isOpening = tx.mode === 'opening';

                let formulaText = '';
                if (isOpening) {
                    const c1 = this.getCurrency(tx.curr1);
                    const dirText = tx.side === 'credit'
                        ? '<span class="text-emerald-300 font-semibold">طلبکار (شما به او بدهکارید)</span>'
                        : '<span class="text-rose-300 font-semibold">بدهکار (او به شما بدهکار است)</span>';
                    formulaText = `مانده شروع حساب: <span dir="ltr" class="font-num font-bold text-white">${formatNum(tx.amt1, 6)}</span> ${escapeHtml(c1.name)} — ${dirText}`;
                } else if (tx.mode === 'deal') {
                    const c1 = this.getCurrency(tx.curr1);
                    const c2 = this.getCurrency(tx.curr2);
                    const cFee = this.getCurrency(tx.feeCurr || tx.curr2);
                    const opSym = tx.op === 'div' ? '÷' : '×';
                    const verb = tx.side === 'sell' ? 'فروش' : 'خرید';
                    formulaText = `${verb} <span dir="ltr" class="font-num font-bold text-white">${formatNum(tx.amt1, 6)}</span> ${escapeHtml(c1.name)} ${opSym} نرخ <span dir="ltr" class="font-num font-bold text-slate-200">${formatNum(tx.rate, 6)}</span> = <span dir="ltr" class="font-num font-bold text-white">${formatNum(tx.baseTotal, 6)}</span> ${escapeHtml(c2.name)}`;
                    if (tx.fee > 0) {
                        const feeVerb = (cFee.id === c2.id && tx.feeMode === 'sub') ? 'کسر کارمزد' : 'کارمزد';
                        formulaText += ` <span class="text-amber-300">(${feeVerb}: <span dir="ltr" class="font-num">${formatNum(tx.fee, 4)}</span> ${escapeHtml(cFee.name)}${cFee.id === c2.id ? ` ← نهایی: <span dir="ltr" class="font-num font-bold">${formatNum(tx.finalExact, 6)}</span>` : ''})</span>`;
                    }
                } else {
                    const c1 = this.getCurrency(tx.curr1);
                    const verb = tx.side === 'receive' ? 'دریافت' : 'پرداخت';
                    formulaText = `${verb} <span dir="ltr" class="font-num font-bold text-white">${formatNum(tx.amt1, 6)}</span> ${escapeHtml(c1.name)}`;
                    if (tx.fee > 0) {
                        formulaText += ` <span class="text-amber-300">(کارمزد: <span dir="ltr" class="font-num">${formatNum(tx.fee, 4)}</span> ${escapeHtml(c1.name)} ← خالص: <span dir="ltr" class="font-num font-bold">${formatNum(tx.finalExact, 6)}</span>)</span>`;
                    }
                }

                const legsHtml = tx.legs.map(leg => {
                    const curr = this.getCurrency(leg.currencyId);
                    const isPos = leg.effectiveDelta > 0;
                    return `
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs ${
                            isPos
                                ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300'
                                : 'bg-rose-500/10 border-rose-500/25 text-rose-300'
                        }">
                            <span dir="ltr" class="font-num font-bold">${formatSignedNum(leg.effectiveDelta, 4)}</span>
                            <span>${escapeHtml(curr.name)}</span>
                            <span class="text-[10px] opacity-80">(${leg.isFeeLeg ? 'کارمزد' : (isPos ? 'طلبکار' : 'بدهکار')})</span>
                        </div>
                    `;
                }).join('');

                const roundingHtml = (tx.roundingNotes && tx.roundingNotes.length > 0)
                    ? `<div class="mt-2 text-[11px] text-amber-300/95 bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 py-1.5 leading-relaxed">${tx.roundingNotes.map(n => escapeHtml(n)).join('<br>')}</div>`
                    : '';

                const descHtml = tx.description
                    ? `<p class="mt-2 text-xs text-slate-300 bg-navy-950/60 border border-slate-800/70 rounded-xl px-3 py-1.5 leading-relaxed">${escapeHtml(tx.description)}</p>`
                    : '';

                const editCall = isOpening
                    ? `app.openOpeningBalanceModal('${tx.counterpartyId}', '${tx.id}')`
                    : `app.openTransactionModal('${tx.counterpartyId}', '${tx.id}')`;

                return `
                    <article class="${isOpening ? 'bg-gradient-to-l from-cyan-950/35 to-navy-900/95 border-cyan-500/35' : 'bg-navy-900/90 border-slate-800/90'} border rounded-3xl p-4 shadow-md">
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="px-2.5 py-1 rounded-xl border text-[11px] font-bold ${badge.cls}">${badge.text}</span>
                                <span dir="ltr" class="font-num text-[11px] font-semibold text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded-lg">${escapeHtml(tx.code)}</span>
                            </div>
                            <div dir="ltr" class="font-num text-[11px] text-slate-400 shrink-0">
                                ${escapeHtml(tx.dateJalali)} ${tx.timeStr ? '• ' + escapeHtml(tx.timeStr) : ''}
                            </div>
                        </div>

                        <div class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-3">
                            ${formulaText}
                        </div>

                        <div class="flex flex-wrap items-center justify-between gap-2 pt-2.5 border-t border-slate-800/70">
                            <div class="flex flex-wrap gap-1.5">
                                ${legsHtml}
                            </div>
                            <div class="flex items-center gap-1.5 mr-auto">
                                <button onclick="${editCall}" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition">
                                    ویرایش
                                </button>
                                <button onclick="app.confirmDeleteTransaction('${tx.id}')" class="px-2.5 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium transition">
                                    حذف
                                </button>
                            </div>
                        </div>

                        ${roundingHtml}
                        ${descHtml}
                    </article>
                `;
            }

            // -------------------------------------------------------------------------
            // صفحه ۳: داشبورد تراز کل صرافی (مجموع طلب‌ها و بدهی‌های شما به تفکیک ارز)
            // -------------------------------------------------------------------------
            renderDashboard() {
                const allStats = this.getGlobalDashboardStats();
                const activeStats = allStats.filter(s => s.receivableFromCounterparties > 0 || s.payableToCounterparties > 0);
                const visibleStats = this.ui.showAllDashboardCurrencies ? allStats : activeStats;

                const totalAccounts = this.state.counterparties.length;
                const totalTxs = this.state.transactions.length;

                let cardsHtml = '';
                if (visibleStats.length === 0) {
                    cardsHtml = `
                        <div class="bg-navy-900/80 border border-slate-800 rounded-3xl p-8 text-center space-y-2">
                            <div class="text-sm font-bold text-white">هنوز مانده بازی در هیچ ارزی وجود ندارد</div>
                            <p class="text-xs text-slate-400 leading-relaxed">
                                با ثبت مانده اولیه یا معاملات برای طرف حساب‌ها، مجموع طلب‌ها، بدهی‌ها و تراز خالص شما به تفکیک هر ارز اینجا نمایش داده می‌شود.
                            </p>
                        </div>
                    `;
                } else {
                    cardsHtml = `<div class="space-y-3">` + visibleStats.map(s => {
                        const isNetPos = s.netYou > 0;
                        const isNetNeg = s.netYou < 0;
                        const netStatusLabel = isNetPos
                            ? 'خالص طلب شما'
                            : (isNetNeg ? 'خالص بدهی شما' : 'تراز (تسویه)');
                        const netBadgeCls = isNetPos
                            ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                            : (isNetNeg ? 'bg-rose-500/15 border-rose-500/30 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-400');
                        const netNumCls = isNetPos
                            ? 'text-emerald-400'
                            : (isNetNeg ? 'text-rose-400' : 'text-slate-400');

                        return `
                            <article class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-4 shadow-lg shadow-black/20 space-y-3">
                                <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-800/80">
                                    <div class="flex items-center gap-2.5 min-w-0">
                                        <span class="w-10 h-10 rounded-2xl bg-slate-800/90 border border-slate-700/70 flex items-center justify-center font-num text-sm font-bold text-emerald-400 shrink-0">
                                            ${escapeHtml(s.currency.symbol)}
                                        </span>
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-1.5 flex-wrap">
                                                <h3 class="font-extrabold text-sm sm:text-base text-white truncate">${escapeHtml(s.currency.name)}</h3>
                                                <span dir="ltr" class="font-num text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded-md">${escapeHtml(s.currency.code)}</span>
                                            </div>
                                            <div class="text-[11px] text-slate-400 mt-0.5">
                                                <span class="font-num">${s.activeAccountsCount}</span> حساب دارای مانده باز
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-left shrink-0">
                                        <div dir="ltr" class="font-num text-lg sm:text-xl font-extrabold ${netNumCls}">
                                            ${formatSignedNum(s.netYou)}
                                        </div>
                                        <span class="inline-block mt-0.5 px-2 py-0.5 rounded-lg border text-[10px] font-bold ${netBadgeCls}">
                                            ${netStatusLabel}
                                        </span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2.5">
                                    <div class="p-3 rounded-2xl bg-emerald-950/25 border border-emerald-500/20">
                                        <div class="text-[11px] text-emerald-300/90 font-medium mb-1">طلب شما (بدهی مشتریان)</div>
                                        <div dir="ltr" class="font-num text-sm sm:text-base font-extrabold text-emerald-400 text-left">
                                            ${formatNum(s.receivableFromCounterparties)}
                                        </div>
                                    </div>
                                    <div class="p-3 rounded-2xl bg-rose-950/25 border border-rose-500/20">
                                        <div class="text-[11px] text-rose-300/90 font-medium mb-1">بدهی شما (طلب مشتریان)</div>
                                        <div dir="ltr" class="font-num text-sm sm:text-base font-extrabold text-rose-400 text-left">
                                            ${formatNum(s.payableToCounterparties)}
                                        </div>
                                    </div>
                                </div>
                            </article>
                        `;
                    }).join('') + `</div>`;
                }

                return `
                    <div class="space-y-4 animate-fade-in">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div>
                                <h2 class="text-sm sm:text-base font-extrabold text-white">تراز کل صرافی (از دید شما)</h2>
                                <p class="text-[11px] text-slate-400 mt-0.5">تجمیع کل طلب‌ها و بدهی‌های شما در تمامی حساب‌ها</p>
                            </div>
                            <button onclick="app.toggleAllDashboardCurrencies()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-200 text-xs font-semibold transition">
                                ${this.ui.showAllDashboardCurrencies ? 'فقط ارزهای فعال' : 'نمایش همه ارزها'}
                            </button>
                        </div>

                        <!-- آمار کلی سریع -->
                        <div class="grid grid-cols-3 gap-2">
                            <div class="p-3 rounded-2xl bg-navy-900/90 border border-slate-800/90 text-center">
                                <div class="font-num text-lg font-extrabold text-white">${totalAccounts}</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">طرف حساب</div>
                            </div>
                            <div class="p-3 rounded-2xl bg-navy-900/90 border border-slate-800/90 text-center">
                                <div class="font-num text-lg font-extrabold text-emerald-400">${activeStats.length}</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">ارز فعال</div>
                            </div>
                            <div class="p-3 rounded-2xl bg-navy-900/90 border border-slate-800/90 text-center">
