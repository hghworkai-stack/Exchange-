                                <div class="font-num text-lg font-extrabold text-sky-400">${totalTxs}</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">کل تراکنش‌ها</div>
                            </div>
                        </div>

                        ${cardsHtml}
                    </div>
                `;
            }

            toggleAllDashboardCurrencies() {
                this.ui.showAllDashboardCurrencies = !this.ui.showAllDashboardCurrencies;
                this.render();
            }

            // -------------------------------------------------------------------------
            // صفحه ۴: لاگ تغییرات (ثبت، ویرایش و حذف + بازیابی)
            // -------------------------------------------------------------------------
            renderAuditLog() {
                const q = this.ui.auditSearch.trim().toLowerCase();
                const logs = [...this.state.auditLogs]
                    .sort((a, b) => (b.timestampMs || 0) - (a.timestampMs || 0))
                    .filter(log => {
                        if (this.ui.auditFilterAction !== 'all') {
                            const normalizedAction = log.action.startsWith('cp_') ? log.action.slice(3) : log.action;
                            if (normalizedAction !== this.ui.auditFilterAction) return false;
                        }
                        if (q) {
                            const hay = `${log.counterpartyName || ''} ${log.txCode || ''} ${log.timestampJalali || ''} ${log.summaryText || ''}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    });

                const summarizeTx = (tx) => {
                    if (!tx) return '—';
                    if (tx.mode === 'opening') {
                        const c1 = this.getCurrency(tx.curr1);
                        const dir = tx.side === 'credit' ? 'طلبکار (شما بدهکارید)' : 'بدهکار (او بدهکار است)';
                        return `مانده اولیه: ${formatNum(tx.amt1, 6)} ${c1.name} — ${dir}`;
                    }
                    if (tx.mode === 'deal') {
                        const c1 = this.getCurrency(tx.curr1);
                        const c2 = this.getCurrency(tx.curr2);
                        const cFee = this.getCurrency(tx.feeCurr || tx.curr2);
                        const v = tx.side === 'sell' ? 'فروش' : 'خرید';
                        const op = tx.op === 'div' ? '÷' : '×';
                        return `${v} ${formatNum(tx.amt1, 6)} ${c1.name} ${op} ${formatNum(tx.rate, 6)} = ${formatNum(tx.finalExact, 6)} ${c2.name}${tx.fee > 0 ? ` (کارمزد ${formatNum(tx.fee)} ${cFee.name})` : ''}`;
                    } else {
                        const c1 = this.getCurrency(tx.curr1);
                        const v = tx.side === 'receive' ? 'دریافت' : 'پرداخت';
                        return `${v} ${formatNum(tx.amt1, 6)} ${c1.name}${tx.fee > 0 ? ` (کارمزد ${formatNum(tx.fee)})` : ''}`;
                    }
                };

                const actionMeta = (log) => {
                    const isOb = log.before?.mode === 'opening' || log.after?.mode === 'opening';
                    if (log.action === 'cp_create') return { label: 'تعریف طرف حساب', cls: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' };
                    if (log.action === 'cp_edit') return { label: 'ویرایش طرف حساب', cls: 'bg-amber-500/15 text-amber-300 border-amber-500/30' };
                    if (log.action === 'cp_delete') return { label: 'حذف طرف حساب', cls: 'bg-rose-500/15 text-rose-300 border-rose-500/30' };
                    if (log.action === 'create') return { label: isOb ? 'ثبت مانده اولیه' : 'ثبت تراکنش', cls: isOb ? 'bg-cyan-500/15 text-cyan-200 border-cyan-500/30' : 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' };
                    if (log.action === 'edit') return { label: isOb ? 'ویرایش مانده اولیه' : 'ویرایش تراکنش', cls: 'bg-amber-500/15 text-amber-300 border-amber-500/30' };
                    return { label: isOb ? 'حذف مانده اولیه' : 'حذف تراکنش', cls: 'bg-rose-500/15 text-rose-300 border-rose-500/30' };
                };

                let logsHtml = '';
                if (this.state.auditLogs.length === 0) {
                    logsHtml = `
                        <div class="bg-navy-900/80 border border-slate-800 rounded-3xl p-8 text-center text-slate-400 text-sm">
                            تاکنون رویدادی ثبت نشده است. تمامی ثبت‌ها، ویرایش‌ها و حذف‌ها به‌صورت خودکار اینجا ثبت می‌شوند.
                        </div>
                    `;
                } else if (logs.length === 0) {
                    logsHtml = `
                        <div class="bg-navy-900/80 border border-slate-800 rounded-3xl p-6 text-center text-slate-400 text-sm">
                            موردی مطابق جستجو یافت نشد.
                        </div>
                    `;
                } else {
                    logsHtml = `<div class="space-y-3">` + logs.map(log => {
                        const meta = actionMeta(log);
                        const isDel = log.action === 'delete';
                        const isCreate = log.action === 'create';
                        const isCpLog = log.action.startsWith('cp_');
                        const isRestored = !!log.restored;
                        const cpExists = !!this.getCounterparty(log.counterpartyId);
                        const txAlreadyExists = log.txId && this.state.transactions.some(t => t.id === log.txId);

                        let bodyHtml = '';
                        if (isCpLog) {
                            bodyHtml = `<div class="p-3 rounded-2xl bg-navy-950/70 border border-slate-800 text-xs text-slate-200 leading-relaxed">${escapeHtml(log.summaryText || log.counterpartyName)}</div>`;
                        } else if (isCreate && log.after) {
                            bodyHtml = `
                                <div class="p-3 rounded-2xl bg-emerald-950/30 border border-emerald-500/20 text-xs">
                                    <div class="text-[11px] text-emerald-300 font-semibold mb-1">جزئیات ثبت‌شده:</div>
                                    <div class="text-slate-200 leading-relaxed">${escapeHtml(summarizeTx(log.after))}</div>
                                    ${log.after?.description ? `<div class="text-slate-400 mt-1">توضیح: ${escapeHtml(log.after.description)}</div>` : ''}
                                </div>
                            `;
                        } else {
                            bodyHtml = `
                                <div class="space-y-2 text-xs">
                                    <div class="p-3 rounded-2xl bg-rose-950/30 border border-rose-500/20">
                                        <div class="text-[11px] text-rose-300 font-semibold mb-1">وضعیت قبلی:</div>
                                        <div class="text-slate-200 leading-relaxed">${escapeHtml(summarizeTx(log.before))}</div>
                                        ${log.before?.description ? `<div class="text-slate-400 mt-1">توضیح: ${escapeHtml(log.before.description)}</div>` : ''}
                                    </div>
                                    ${!isDel && log.after ? `
                                        <div class="p-3 rounded-2xl bg-emerald-950/30 border border-emerald-500/20">
                                            <div class="text-[11px] text-emerald-300 font-semibold mb-1">وضعیت جدید:</div>
                                            <div class="text-slate-200 leading-relaxed">${escapeHtml(summarizeTx(log.after))}</div>
                                            ${log.after?.description ? `<div class="text-slate-400 mt-1">توضیح: ${escapeHtml(log.after.description)}</div>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }

                        return `
                            <article class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-4 space-y-2.5">
                                <div class="flex items-center justify-between gap-2 flex-wrap">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="px-2.5 py-1 rounded-xl border text-[11px] font-bold ${meta.cls}">${meta.label}</span>
                                        <span class="text-xs font-bold text-white">${escapeHtml(log.counterpartyName)}</span>
                                        ${log.txCode ? `<span dir="ltr" class="font-num text-[11px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-lg">${escapeHtml(log.txCode)}</span>` : ''}
                                    </div>
                                    <span dir="ltr" class="font-num text-[11px] text-slate-400">${escapeHtml(log.timestampJalali)}</span>
                                </div>

                                ${bodyHtml}

                                ${isDel ? `
                                    <div class="pt-1 flex justify-end">
                                        ${(isRestored || txAlreadyExists)
                                            ? `<span class="text-xs text-emerald-400 font-medium px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20">✓ بازیابی شده است</span>`
                                            : (cpExists
                                                ? `<button onclick="app.restoreDeletedTransaction('${log.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-bold transition">↺ بازیابی تراکنش</button>`
                                                : `<span class="text-[11px] text-slate-500">حساب مربوطه حذف شده است</span>`)
                                        }
                                    </div>
                                ` : ''}
                            </article>
                        `;
                    }).join('') + `</div>`;
                }

                return `
                    <div class="space-y-4 animate-fade-in">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm sm:text-base font-bold text-white">تاریخچه تغییرات (لاگ سیستم)</h2>
                            <span class="font-num text-xs text-slate-400">${logs.length} رکورد</span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                            <input type="text" id="auditSearchInput" value="${escapeHtml(this.ui.auditSearch)}"
                                oninput="app.setAuditFilter('auditSearch', this.value)"
                                placeholder="جستجو بر اساس نام طرف حساب یا شناسه..."
                                class="sm:col-span-8 h-10 px-3.5 rounded-xl bg-navy-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:border-emerald-500/50 focus:outline-none">
                            <select onchange="app.setAuditFilter('auditFilterAction', this.value)" class="sm:col-span-4 h-10 px-3 rounded-xl bg-navy-900 border border-slate-800 text-xs text-slate-200 focus:border-emerald-500/50 focus:outline-none">
                                <option value="all" ${this.ui.auditFilterAction === 'all' ? 'selected' : ''}>همه رویدادها</option>
                                <option value="create" ${this.ui.auditFilterAction === 'create' ? 'selected' : ''}>فقط ثبت‌ها</option>
                                <option value="edit" ${this.ui.auditFilterAction === 'edit' ? 'selected' : ''}>فقط ویرایش‌ها</option>
                                <option value="delete" ${this.ui.auditFilterAction === 'delete' ? 'selected' : ''}>فقط حذف‌ها</option>
                            </select>
                        </div>

                        ${logsHtml}
                    </div>
                `;
            }

            setAuditFilter(key, val) {
                this.ui[key] = val;
                this.render();
                if (key === 'auditSearch') {
                    const el = document.getElementById('auditSearchInput');
                    if (el) {
                        el.focus();
                        el.setSelectionRange(val.length, val.length);
                    }
                }
            }

            restoreDeletedTransaction(logId) {
                const log = this.state.auditLogs.find(l => l.id === logId);
                if (!log || !log.before) return;
                if (!this.getCounterparty(log.counterpartyId)) {
                    showToast('طرف حساب این تراکنش وجود ندارد.', 'error');
                    return;
                }
                if (this.state.transactions.some(t => t.id === log.txId)) {
                    showToast('این تراکنش قبلاً بازیابی شده است.', 'info');
                    return;
                }
                this.state.transactions.push(structuredClone(log.before));
                log.restored = true;
                this.saveState();
                this.render();
                showToast(`تراکنش ${log.txCode} با موفقیت بازیابی و به بالانس اضافه شد.`, 'success');
            }

            // -------------------------------------------------------------------------
            // صفحه ۵: تنظیمات (مدیریت ارزها، ترتیب نمایش، آستانه گرد کردن، پشتیبان‌گیری JSON)
            // -------------------------------------------------------------------------
            renderSettings() {
                const currenciesHtml = this.state.currencies.map((c, idx) => {
                    const isFirst = idx === 0;
                    const isLast = idx === this.state.currencies.length - 1;
                    return `
                        <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-navy-950/80 border border-slate-800/80">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center font-num text-xs font-bold text-emerald-400 shrink-0">${escapeHtml(c.symbol)}</span>
                                <div class="min-w-0">
                                    <div class="text-sm font-bold text-white flex items-center gap-1.5 flex-wrap">
                                        <span>${escapeHtml(c.name)}</span>
                                        <span dir="ltr" class="font-num text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">${escapeHtml(c.code)}</span>
                                    </div>
                                    <div class="text-[11px] text-slate-400 mt-0.5">
                                        ${c.exactNoRound ? 'محاسبه دقیق (بدون گرد کردن)' : 'گرد کردن هوشمند به نفع طرف حساب'}
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="app.moveCurrency(${idx}, -1)" ${isFirst ? 'disabled' : ''} title="انتقال به بالا"
                                    class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 flex items-center justify-center transition">
                                    ▲
                                </button>
                                <button onclick="app.moveCurrency(${idx}, 1)" ${isLast ? 'disabled' : ''} title="انتقال به پایین"
                                    class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 flex items-center justify-center transition">
                                    ▼
                                </button>
                                <button onclick="app.toggleCurrencyExact('${c.id}')" title="تغییر حالت گرد کردن"
                                    class="px-2.5 h-9 rounded-xl border text-[11px] font-semibold transition ${
                                        c.exactNoRound
                                            ? 'bg-sky-500/15 border-sky-500/30 text-sky-300'
                                            : 'bg-slate-800 border-slate-700 text-slate-300'
                                    }">
                                    ${c.exactNoRound ? 'دقیق' : 'گرد'}
                                </button>
                                <button onclick="app.confirmDeleteCurrency('${c.id}')" title="حذف ارز"
                                    class="w-9 h-9 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition">
                                    ✕
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-5 animate-fade-in">
                        <!-- مدیریت ارزها و ترتیب سفارشی -->
                        <section class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-4 sm:p-5 space-y-4">
                            <div class="flex items-center justify-between gap-2">
                                <div>
                                    <h2 class="text-sm sm:text-base font-bold text-white">مدیریت و ترتیب ارزها</h2>
                                    <p class="text-xs text-slate-400 mt-0.5">ترتیب انتخابی شما در لیست‌ها، کارت بالانس، تراز کل و خروجی‌ها اعمال می‌شود.</p>
                                </div>
                            </div>

                            <div class="space-y-2">
                                ${currenciesHtml}
                            </div>

                            <!-- فرم افزودن ارز جدید -->
                            <form onsubmit="app.addNewCurrency(event)" class="pt-3 border-t border-slate-800/80 space-y-3">
                                <div class="text-xs font-bold text-emerald-400">+ افزودن ارز جدید</div>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <input type="text" id="newCurrName" required placeholder="نام ارز (مثلاً پوند)" class="h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-800 text-xs text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
                                    <input type="text" id="newCurrCode" required placeholder="کد انگلیسی (مثلاً GBP)" dir="ltr" class="h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-800 text-xs font-num text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
                                    <input type="text" id="newCurrSymbol" required placeholder="نماد (مثلاً £)" class="h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-800 text-xs text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
                                </div>
                                <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
                                    <input type="checkbox" id="newCurrExact" class="w-4 h-4 rounded accent-emerald-500">
                                    <span>بدون گرد کردن / محاسبه کاملاً دقیق (مثل تومان)</span>
                                </label>
                                <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-bold text-xs transition">
                                    افزودن به لیست ارزها
                                </button>
                            </form>
                        </section>

                        <!-- تنظیم آستانه گرد کردن -->
                        <section class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-4 sm:p-5 space-y-3">
                            <h2 class="text-sm sm:text-base font-bold text-white">تنظیمات گرد کردن هوشمند</h2>
                            <p class="text-xs text-slate-400 leading-relaxed">
                                برای ارزهای غیرتومانی، خرده اعداد به نفع طرف حساب گرد می‌شود مگر اینکه مقدار خرده کمتر یا مساوی این آستانه باشد (پیش‌فرض <span class="font-num text-white">0.1</span>).
                            </p>
                            <div class="flex items-center gap-2.5">
                                <input type="text" inputmode="decimal" id="roundingThresholdInput" dir="ltr"
                                    value="${this.state.settings.roundingThreshold}"
                                    class="w-32 h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-800 font-num text-sm text-white text-center focus:border-emerald-500 focus:outline-none">
                                <button onclick="app.saveRoundingThreshold()" class="h-11 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold transition">
                                    ذخیره آستانه
                                </button>
                            </div>
                        </section>

                        <!-- پشتیبان‌گیری و بازیابی JSON -->
                        <section class="bg-navy-900/90 border border-slate-800/90 rounded-3xl p-4 sm:p-5 space-y-3">
                            <h2 class="text-sm sm:text-base font-bold text-white">پشتیبان‌گیری و بازیابی اطلاعات</h2>
                            <p class="text-xs text-slate-400 leading-relaxed">
                                تمام اطلاعات شما به‌طور خودکار در حافظه دستگاه ذخیره می‌شود. برای انتقال به گوشی دیگر یا نگهداری نسخه امن، فایل پشتیبان دانلود کنید.
                            </p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                                <button onclick="app.downloadBackupJson()" class="min-h-[46px] px-4 py-3 rounded-2xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-bold flex items-center justify-center gap-2 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                    </svg>
                                    <span>پشتیبان‌گیری (دانلود فایل JSON)</span>
                                </button>
                                <label class="cursor-pointer min-h-[46px] px-4 py-3 rounded-2xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 text-xs font-bold flex items-center justify-center gap-2 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                    </svg>
                                    <span>بازیابی نسخه پشتیبان (آپلود JSON)</span>
                                    <input type="file" accept=".json,application/json" onchange="app.handleBackupUpload(event)" class="hidden">
                                </label>
                            </div>
                        </section>
                    </div>
                `;
            }

            moveCurrency(idx, dir) {
                const target = idx + dir;
                if (target < 0 || target >= this.state.currencies.length) return;
                const arr = this.state.currencies;
                [arr[idx], arr[target]] = [arr[target], arr[idx]];
                this.saveState();
                this.render();
            }

            toggleCurrencyExact(currId) {
                const c = this.state.currencies.find(x => x.id === currId);
                if (!c) return;
                c.exactNoRound = !c.exactNoRound;
                this.saveState();
                this.render();
                showToast(`حالت ارز ${c.name} به «${c.exactNoRound ? 'دقیق بدون گرد کردن' : 'گرد کردن هوشمند'}» تغییر کرد.`, 'info');
            }

            addNewCurrency(e) {
                e.preventDefault();
                const name = document.getElementById('newCurrName').value.trim();
                const code = normalizeDigits(document.getElementById('newCurrCode').value).trim().toUpperCase().replace(/[^A-Z0-9_]/g, '');
                const symbol = document.getElementById('newCurrSymbol').value.trim();
                const exactNoRound = document.getElementById('newCurrExact').checked;

                if (!name || !code || !symbol) {
                    showToast('لطفاً تمام فیلدهای ارز جدید را تکمیل کنید.', 'error');
                    return;
                }
                if (this.state.currencies.some(c => c.id === code || c.code === code)) {
                    showToast('ارزی با این کد انگلیسی قبلاً ثبت شده است.', 'error');
                    return;
                }

                this.state.currencies.push({ id: code, code, name, symbol, exactNoRound });
                this.saveState();
                this.render();
                showToast(`ارز ${name} (${code}) اضافه شد.`, 'success');
            }

            confirmDeleteCurrency(currId) {
                const c = this.state.currencies.find(x => x.id === currId);
                if (!c) return;
                const used = this.state.transactions.some(t => t.legs.some(l => l.currencyId === currId));
                if (used) {
                    showToast(`ارز «${c.name}» در تراکنش‌های ثبت‌شده استفاده شده و قابل حذف نیست.`, 'error');
                    return;
                }
                if (this.state.currencies.length <= 2) {
                    showToast('حداقل دو ارز باید در سیستم باقی بماند.', 'error');
                    return;
                }
                this.openConfirmModal({
                    title: 'حذف ارز',
                    message: `آیا از حذف ارز «${c.name}» از لیست اطمینان دارید؟`,
                    confirmText: 'حذف ارز',
                    danger: true,
                    onConfirm: () => {
                        this.state.currencies = this.state.currencies.filter(x => x.id !== currId);
                        this.saveState();
                        this.render();
                        showToast(`ارز ${c.name} حذف شد.`, 'info');
                    }
                });
            }

            saveRoundingThreshold() {
                const raw = document.getElementById('roundingThresholdInput').value;
                const num = parseNumericInput(raw);
                if (isNaN(num) || num < 0 || num >= 0.5) {
                    showToast('آستانه گرد کردن باید عددی بین 0 تا 0.49 باشد.', 'error');
                    return;
                }
                this.state.settings.roundingThreshold = cleanFloat(num);
                this.saveState();
                showToast(`آستانه گرد کردن روی ${this.state.settings.roundingThreshold} ذخیره شد.`, 'success');
            }

            // =========================================================================
            // 7. مودال‌ها (تعریف/ویرایش طرف حساب، ثبت/ویرایش تراکنش، تأیید حذف، پیش‌نمایش PNG)
            // =========================================================================
            closeModal() {
                document.getElementById('modal-root').innerHTML = '';
            }

            openConfirmModal({ title, message, confirmText = 'تأیید', danger = false, onConfirm }) {
                const root = document.getElementById('modal-root');
                this._pendingConfirm = onConfirm;
                root.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onclick="if(event.target===this) app.closeModal()">
                        <div class="w-full max-w-sm bg-navy-900 border border-slate-700/80 rounded-3xl p-5 shadow-2xl animate-slide-up">
                            <h3 class="text-base font-bold text-white mb-2">${escapeHtml(title)}</h3>
                            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-5">${escapeHtml(message)}</p>
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="app.closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition">انصراف</button>
                                <button onclick="app.executeConfirm()" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${danger ? 'bg-rose-500 hover:bg-rose-400 text-white' : 'bg-emerald-500 hover:bg-emerald-400 text-navy-950'}">${escapeHtml(confirmText)}</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            executeConfirm() {
                const fn = this._pendingConfirm;
                this._pendingConfirm = null;
                this.closeModal();
                if (typeof fn === 'function') fn();
            }

            openCounterpartyModal(editId = null) {
                const existing = editId ? this.getCounterparty(editId) : null;
                this._cpDraft = {
                    editId: editId || null,
                    name: existing?.name || '',
                    note: existing?.note || '',
                    openingRows: existing ? [] : [this.createEmptyOpeningRow([])]
                };
                this.renderCounterpartyModal();
            }

            createEmptyOpeningRow(existingRows = []) {
                const used = new Set(existingRows.map(r => r.currId));
                const nextCurr = this.state.currencies.find(c => !used.has(c.id)) || this.state.currencies[0];
                return {
                    uid: generateId('obrow'),
                    currId: nextCurr?.id || 'USD',
                    amount: '',
                    direction: 'credit', // 'credit': طلبکار (+) شما به او بدهکارید | 'debit': بدهکار (-) او به شما بدهکار است
                    dateJalali: JalaliDate.nowDateStr(),
                    note: 'مانده اولیه / انتقال از قبل'
                };
            }

            renderOpeningRowsListHtml(rows, handlerPrefix) {
                if (!rows.length) {
                    return `<div class="text-xs text-slate-500 text-center py-3 rounded-2xl border border-dashed border-slate-800">هیچ ردیف مانده اولیه‌ای اضافه نشده است.</div>`;
                }
                return rows.map((row, idx) => {
                    const currOptions = this.state.currencies.map(c =>
                        `<option value="${c.id}" ${c.id === row.currId ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.code)})</option>`
                    ).join('');
                    const isCredit = row.direction === 'credit';
                    return `
                        <div class="p-3 rounded-2xl bg-navy-950/90 border border-slate-800/90 space-y-2.5">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[11px] font-bold text-cyan-300">ردیف مانده اولیه #${idx + 1}</span>
                                <button type="button" onclick="app.${handlerPrefix}RemoveRow('${row.uid}')" class="px-2 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-[11px] font-bold transition">✕ حذف</button>
                            </div>

                            <div class="grid grid-cols-12 gap-2">
                                <div class="col-span-5">
                                    <label class="block text-[10px] text-slate-400 mb-1">ارز</label>
                                    <select onchange="app.${handlerPrefix}UpdateRow('${row.uid}', 'currId', this.value)"
                                        class="w-full h-10 px-2 rounded-xl bg-navy-900 border border-slate-700 text-xs font-semibold text-white focus:border-cyan-400 focus:outline-none">
                                        ${currOptions}
                                    </select>
                                </div>
                                <div class="col-span-7">
                                    <label class="block text-[10px] text-slate-400 mb-1">مبلغ مانده اولیه</label>
                                    <input type="text" inputmode="decimal" dir="ltr" value="${escapeHtml(row.amount)}"
                                        oninput="app.${handlerPrefix}UpdateRowAmount('${row.uid}', this)"
                                        placeholder="مثلاً 1,000"
                                        class="w-full h-10 px-3 rounded-xl bg-navy-900 border border-slate-700 font-num text-sm font-bold text-white text-left focus:border-cyan-400 focus:outline-none">
                                </div>
                            </div>

                            <!-- انتخاب جهت مانده اولیه از دید طرف حساب -->
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="app.${handlerPrefix}SetRowDirection('${row.uid}', 'credit')"
                                    class="p-2 rounded-xl border text-center transition ${
                                        isCredit
                                            ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200 shadow-sm'
                                            : 'bg-navy-900 border-slate-800 text-slate-400 hover:text-slate-200'
                                    }">
                                    <div class="text-xs font-extrabold">طلبکار (+)</div>
                                    <div class="text-[10px] opacity-85 mt-0.5">شما به او بدهکارید</div>
                                </button>
                                <button type="button" onclick="app.${handlerPrefix}SetRowDirection('${row.uid}', 'debit')"
                                    class="p-2 rounded-xl border text-center transition ${
                                        !isCredit
                                            ? 'bg-rose-500/20 border-rose-400 text-rose-200 shadow-sm'
                                            : 'bg-navy-900 border-slate-800 text-slate-400 hover:text-slate-200'
                                    }">
                                    <div class="text-xs font-extrabold">بدهکار (-)</div>
                                    <div class="text-[10px] opacity-85 mt-0.5">او به شما بدهکار است</div>
                                </button>
                            </div>

                            <div class="grid grid-cols-12 gap-2">
                                <div class="col-span-5">
                                    <label class="block text-[10px] text-slate-400 mb-1">تاریخ شمسی</label>
                                    <input type="text" dir="ltr" value="${escapeHtml(row.dateJalali)}"
                                        oninput="app.${handlerPrefix}UpdateRow('${row.uid}', 'dateJalali', this.value)"
                                        placeholder="1405/08/28"
                                        class="w-full h-9 px-2.5 rounded-xl bg-navy-900 border border-slate-800 font-num text-xs text-white text-center focus:border-cyan-400 focus:outline-none">
                                </div>
                                <div class="col-span-7">
                                    <label class="block text-[10px] text-slate-400 mb-1">توضیح (اختیاری)</label>
                                    <input type="text" value="${escapeHtml(row.note)}"
                                        oninput="app.${handlerPrefix}UpdateRow('${row.uid}', 'note', this.value)"
                                        placeholder="مانده اولیه / انتقال از قبل"
                                        class="w-full h-9 px-2.5 rounded-xl bg-navy-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:border-cyan-400 focus:outline-none">
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderCounterpartyModal() {
                const d = this._cpDraft;
                const isEdit = !!d.editId;
                const root = document.getElementById('modal-root');

                root.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" onclick="if(event.target===this) app.closeModal()">
                        <div class="w-full sm:max-w-lg max-h-[92vh] overflow-y-auto bg-navy-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-slide-up">
                            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                                <h3 class="text-base font-extrabold text-white">${isEdit ? 'ویرایش مشخصات طرف حساب' : 'تعریف طرف حساب جدید'}</h3>
                                <button onclick="app.closeModal()" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
                            </div>
                            <form onsubmit="app.saveCounterparty(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">نام طرف حساب *</label>
                                    <input type="text" id="cpNameInput" required value="${escapeHtml(d.name)}"
                                        oninput="app._cpDraft.name = this.value"
                                        placeholder="مثلاً محمود، رسولی، ابراهیم..."
                                        class="w-full h-12 px-4 rounded-2xl bg-navy-950 border border-slate-700 text-sm text-white focus:border-emerald-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">شماره تماس / توضیحات (اختیاری)</label>
                                    <input type="text" id="cpNoteInput" value="${escapeHtml(d.note)}"
                                        oninput="app._cpDraft.note = this.value"
                                        placeholder="مثلاً صرافی بازار یا شماره تماس..."
                                        class="w-full h-12 px-4 rounded-2xl bg-navy-950 border border-slate-700 text-sm text-white focus:border-emerald-500 focus:outline-none">
                                </div>

                                ${!isEdit ? `
                                    <!-- بخش اختصاصی مانده اولیه (نقطه شروع) -->
                                    <div class="pt-3 border-t border-slate-800 space-y-3">
                                        <div class="flex items-center justify-between gap-2">
                                            <div>
                                                <div class="text-xs font-extrabold text-cyan-300 flex items-center gap-1.5">
                                                    <span>مانده اولیه (نقطه شروع)</span>
                                                    <span class="text-[10px] font-medium text-slate-400 bg-slate-800 px-2 py-0.5 rounded-lg">اختیاری</span>
                                                </div>
                                                <p class="text-[11px] text-slate-400 mt-0.5">اگر حساب از قبل مانده دارد وارد کنید (ردیف‌های خالی نادیده گرفته می‌شوند).</p>
                                            </div>
                                        </div>

                                        <div id="cpOpeningRowsContainer" class="space-y-2.5">
                                            ${this.renderOpeningRowsListHtml(d.openingRows, 'cpOb')}
                                        </div>

                                        <button type="button" onclick="app.cpObAddRow()" class="w-full py-2.5 px-3 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 border border-dashed border-cyan-500/40 text-cyan-300 text-xs font-bold transition">
                                            + افزودن ارز به مانده اولیه
                                        </button>
                                    </div>
                                ` : ''}

                                <div class="flex items-center gap-2 pt-2">
                                    <button type="submit" class="flex-1 h-12 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-extrabold text-sm transition shadow-lg shadow-emerald-500/20">
                                        ${isEdit ? 'ذخیره تغییرات' : 'ایجاد طرف حساب'}
                                    </button>
                                    <button type="button" onclick="app.closeModal()" class="h-12 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition">انصراف</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                if (!d.name) setTimeout(() => document.getElementById('cpNameInput')?.focus(), 60);
            }

            // توابع کنترل ردیف‌های مانده اولیه داخل مودال تعریف طرف حساب جدید
            cpObAddRow() {
                this._cpDraft.openingRows.push(this.createEmptyOpeningRow(this._cpDraft.openingRows));
                const el = document.getElementById('cpOpeningRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._cpDraft.openingRows, 'cpOb');
            }

            cpObRemoveRow(uid) {
                this._cpDraft.openingRows = this._cpDraft.openingRows.filter(r => r.uid !== uid);
                const el = document.getElementById('cpOpeningRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._cpDraft.openingRows, 'cpOb');
            }

            cpObUpdateRow(uid, field, val) {
                const row = this._cpDraft.openingRows.find(r => r.uid === uid);
                if (row) row[field] = val;
            }

            cpObUpdateRowAmount(uid, inputEl) {
                const formatted = applyLiveThousandSeparator(inputEl);
                const row = this._cpDraft.openingRows.find(r => r.uid === uid);
                if (row) row.amount = formatted;
            }

            cpObSetRowDirection(uid, dir) {
                const row = this._cpDraft.openingRows.find(r => r.uid === uid);
                if (!row) return;
                row.direction = dir;
                const el = document.getElementById('cpOpeningRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._cpDraft.openingRows, 'cpOb');
            }

            buildOpeningTransaction(cpId, row) {
                const amt = parseNumericInput(row.amount);
                const calc = calculateTransactionEffects({
                    mode: 'opening',
                    side: row.direction,
                    curr1: row.currId,
                    amt1: amt
                }, this.state.currencies, this.state.settings.roundingThreshold);
                if (calc.error) return { error: calc.error };

                if (!JalaliDate.isValidJalaliString(row.dateJalali)) {
                    return { error: 'فرمت تاریخ شمسی در مانده اولیه نامعتبر است (مثال: 1405/08/28).' };
                }

                const code = `OB-${this.state.nextObSeq++}`;
                return {
                    error: null,
                    tx: {
                        id: generateId('tx'),
                        code,
                        counterpartyId: cpId,
                        mode: 'opening',
                        side: row.direction,
                        curr1: row.currId,
                        amt1: cleanFloat(amt),
                        op: null,
                        rate: null,
                        curr2: null,
                        fee: 0,
                        feeCurr: row.currId,
                        feeMode: null,
                        baseTotal: calc.baseTotal,
                        finalExact: calc.finalExact,
                        applyRounding: false,
                        legs: calc.legs,
                        roundingNotes: [],
                        dateJalali: JalaliDate.formatJalaliNormalized(row.dateJalali),
                        timeStr: JalaliDate.nowTimeStr(),
                        description: (row.note || '').trim() || 'مانده اولیه / انتقال از قبل',
                        createdAt: Date.now()
                    }
                };
            }

            saveCounterparty(e) {
                e.preventDefault();
                const d = this._cpDraft;
                const name = (d.name || '').trim();
                const note = (d.note || '').trim();
                if (!name) return;

                if (d.editId) {
                    const cp = this.getCounterparty(d.editId);
                    if (cp) {
                        const prevName = cp.name;
                        cp.name = name;
                        cp.note = note;
                        this.state.auditLogs.push({
                            id: generateId('log'),
                            timestampJalali: JalaliDate.nowDateTimeStr(),
                            timestampMs: Date.now(),
                            counterpartyId: cp.id,
                            counterpartyName: name,
                            txId: null,
                            txCode: '',
                            action: 'cp_edit',
                            summaryText: `ویرایش مشخصات طرف حساب: «${prevName}» ← «${name}»${note ? ` (${note})` : ''}`
                        });
                    }
                    showToast('مشخصات طرف حساب به‌روزرسانی شد.', 'success');
                } else {
                    // اعتبارسنجی ردیف‌های مانده اولیه پرشده پیش از ایجاد حساب
                    const nonEmptyRows = d.openingRows.filter(r => r.amount.trim() !== '');
                    for (const r of nonEmptyRows) {
                        const amt = parseNumericInput(r.amount);
                        if (isNaN(amt) || amt <= 0) {
                            showToast('مبلغ مانده اولیه باید عددی بزرگ‌تر از صفر باشد.', 'error');
                            return;
                        }
                        if (!JalaliDate.isValidJalaliString(r.dateJalali)) {
                            showToast('فرمت تاریخ شمسی در یکی از ردیف‌های مانده اولیه نامعتبر است.', 'error');
                            return;
                        }
                    }

                    const newCp = {
                        id: generateId('cp'),
                        name,
                        note,
                        createdAt: Date.now(),
                        lastActivityAt: Date.now()
                    };
                    this.state.counterparties.unshift(newCp);
                    this.state.auditLogs.push({
                        id: generateId('log'),
                        timestampJalali: JalaliDate.nowDateTimeStr(),
                        timestampMs: Date.now(),
                        counterpartyId: newCp.id,
                        counterpartyName: newCp.name,
                        txId: null,
                        txCode: '',
                        action: 'cp_create',
                        summaryText: `ایجاد طرف حساب جدید «${newCp.name}»${nonEmptyRows.length ? ` با ${nonEmptyRows.length} ردیف مانده اولیه` : ''}`
                    });

                    // ثبت ردیف‌های مانده اولیه
                    for (const row of nonEmptyRows) {
                        const built = this.buildOpeningTransaction(newCp.id, row);
                        if (built.tx) {
                            this.state.transactions.push(built.tx);
                            this.state.auditLogs.push({
                                id: generateId('log'),
                                timestampJalali: JalaliDate.nowDateTimeStr(),
                                timestampMs: Date.now(),
                                counterpartyId: newCp.id,
                                counterpartyName: newCp.name,
                                txId: built.tx.id,
                                txCode: built.tx.code,
                                action: 'create',
                                before: null,
                                after: structuredClone(built.tx)
                            });
                        }
                    }

                    this.ui.selectedCounterpartyId = newCp.id;
                    showToast(nonEmptyRows.length
                        ? `حساب «${name}» با ${nonEmptyRows.length} ردیف مانده اولیه ایجاد شد.`
                        : `حساب «${name}» ایجاد شد.`, 'success');
                }
                this.saveState();
                this.closeModal();
                this.render();
            }

            confirmDeleteCounterparty(cpId) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const txCount = this.state.transactions.filter(t => t.counterpartyId === cpId).length;
                this.openConfirmModal({
                    title: `حذف حساب «${cp.name}»`,
                    message: txCount > 0
                        ? `این طرف حساب دارای ${txCount} تراکنش ثبت‌شده است. با حذف حساب، تمام تراکنش‌های آن نیز حذف می‌شوند. آیا مطمئن هستید؟`
                        : `آیا از حذف طرف حساب «${cp.name}» اطمینان دارید؟`,
                    confirmText: 'حذف کامل حساب',
                    danger: true,
                    onConfirm: () => {
                        this.state.counterparties = this.state.counterparties.filter(c => c.id !== cpId);
                        this.state.transactions = this.state.transactions.filter(t => t.counterpartyId !== cpId);
                        this.state.auditLogs.push({
                            id: generateId('log'),
                            timestampJalali: JalaliDate.nowDateTimeStr(),
                            timestampMs: Date.now(),
                            counterpartyId: cpId,
                            counterpartyName: cp.name,
                            txId: null,
                            txCode: '',
                            action: 'cp_delete',
                            summaryText: `حذف کامل طرف حساب «${cp.name}» (${txCount} تراکنش مرتبط)`
                        });
                        this.ui.selectedCounterpartyId = null;
                        this.saveState();
                        this.render();
                        showToast(`حساب «${cp.name}» حذف شد.`, 'info');
                    }
                });
            }

            // -------------------------------------------------------------------------
            // مودال اختصاصی ثبت یا ویرایش مانده اولیه از داخل پنل طرف حساب
            // -------------------------------------------------------------------------
            openOpeningBalanceModal(cpId, editTxId = null) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const existingTx = editTxId ? this.state.transactions.find(t => t.id === editTxId && t.mode === 'opening') : null;

                this._obDraft = {
                    cpId,
                    editTxId: existingTx ? existingTx.id : null,
                    rows: existingTx ? [{
                        uid: 'edit_single',
                        currId: existingTx.curr1,
                        amount: formatInputNumberString(String(existingTx.amt1)),
                        direction: existingTx.side,
                        dateJalali: existingTx.dateJalali,
                        note: existingTx.description || 'مانده اولیه / انتقال از قبل'
                    }] : [this.createEmptyOpeningRow([])]
                };
                this.renderOpeningBalanceModal();
            }

            renderOpeningBalanceModal() {
                const d = this._obDraft;
                const cp = this.getCounterparty(d.cpId);
                const isEdit = !!d.editTxId;
                const existingObs = this.state.transactions.filter(t => t.counterpartyId === d.cpId && t.mode === 'opening');
                const root = document.getElementById('modal-root');

                const existingListHtml = (!isEdit && existingObs.length > 0) ? `
                    <div class="space-y-2 pb-3 border-b border-slate-800">
                        <div class="text-[11px] font-bold text-slate-400">مانده‌های اولیه ثبت‌شده فعلی (${existingObs.length} مورد):</div>
                        ${existingObs.map(ob => {
                            const c = this.getCurrency(ob.curr1);
                            const isPos = ob.side === 'credit';
                            return `
                                <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-navy-950/80 border border-slate-800 text-xs">
                                    <div class="min-w-0">
                                        <span dir="ltr" class="font-num font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'}">${isPos ? '+' : '-'}${formatNum(ob.amt1, 6)}</span>
                                        <span class="text-white font-semibold mr-1">${escapeHtml(c.name)}</span>
                                        <span class="text-[10px] text-slate-400 mr-1">(${isPos ? 'طلبکار' : 'بدهکار'})</span>
                                    </div>
                                    <div class="flex items-center gap-1 shrink-0">
                                        <button type="button" onclick="app.openOpeningBalanceModal('${d.cpId}', '${ob.id}')" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px]">ویرایش</button>
                                        <button type="button" onclick="app.confirmDeleteTransaction('${ob.id}')" class="px-2 py-1 rounded-lg bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 text-[11px]">حذف</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : '';

                root.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" onclick="if(event.target===this) app.closeModal()">
                        <div class="w-full sm:max-w-lg max-h-[92vh] overflow-y-auto bg-navy-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-3xl p-4 sm:p-5 shadow-2xl animate-slide-up space-y-4">
                            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                                <div>
                                    <h3 class="text-base font-extrabold text-white">${isEdit ? 'ویرایش مانده اولیه' : 'ثبت / مدیریت مانده اولیه'}</h3>
                                    <p class="text-xs text-slate-400 mt-0.5">طرف حساب: <strong class="text-cyan-300">${escapeHtml(cp?.name || '')}</strong></p>
                                </div>
                                <button onclick="app.closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">✕</button>
                            </div>

                            ${existingListHtml}

                            <form onsubmit="app.submitOpeningBalanceModal(event)" class="space-y-3">
                                <div class="text-xs font-bold text-cyan-300">${isEdit ? 'مشخصات مانده اولیه:' : 'افزودن مانده اولیه جدید:'}</div>
                                <div id="obModalRowsContainer" class="space-y-2.5">
                                    ${this.renderOpeningRowsListHtml(d.rows, 'obModal')}
                                </div>

                                ${!isEdit ? `
                                    <button type="button" onclick="app.obModalAddRow()" class="w-full py-2.5 px-3 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 border border-dashed border-cyan-500/40 text-cyan-300 text-xs font-bold transition">
                                        + افزودن ارز دیگر به مانده اولیه
                                    </button>
                                ` : ''}

                                <div class="flex items-center gap-2 pt-2">
                                    <button type="submit" class="flex-1 h-12 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-navy-950 font-extrabold text-sm shadow-lg shadow-cyan-500/20 transition">
                                        ${isEdit ? 'ذخیره ویرایش مانده اولیه' : 'ثبت مانده اولیه'}
                                    </button>
                                    <button type="button" onclick="app.closeModal()" class="h-12 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition">انصراف</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }

            obModalAddRow() {
                this._obDraft.rows.push(this.createEmptyOpeningRow(this._obDraft.rows));
                const el = document.getElementById('obModalRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._obDraft.rows, 'obModal');
            }

            obModalRemoveRow(uid) {
                if (this._obDraft.editTxId) return;
                this._obDraft.rows = this._obDraft.rows.filter(r => r.uid !== uid);
                const el = document.getElementById('obModalRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._obDraft.rows, 'obModal');
            }

            obModalUpdateRow(uid, field, val) {
                const row = this._obDraft.rows.find(r => r.uid === uid);
                if (row) row[field] = val;
            }

            obModalUpdateRowAmount(uid, inputEl) {
                const formatted = applyLiveThousandSeparator(inputEl);
                const row = this._obDraft.rows.find(r => r.uid === uid);
                if (row) row.amount = formatted;
            }

            obModalSetRowDirection(uid, dir) {
                const row = this._obDraft.rows.find(r => r.uid === uid);
                if (!row) return;
                row.direction = dir;
                const el = document.getElementById('obModalRowsContainer');
                if (el) el.innerHTML = this.renderOpeningRowsListHtml(this._obDraft.rows, 'obModal');
            }

            submitOpeningBalanceModal(e) {
                e.preventDefault();
                const d = this._obDraft;
                const cp = this.getCounterparty(d.cpId);
                if (!cp) return;

                if (d.editTxId) {
                    const row = d.rows[0];
                    const idx = this.state.transactions.findIndex(t => t.id === d.editTxId);
                    if (idx === -1 || !row) return;

                    const amt = parseNumericInput(row.amount);
                    const calc = calculateTransactionEffects({
                        mode: 'opening',
                        side: row.direction,
                        curr1: row.currId,
                        amt1: amt
                    }, this.state.currencies, this.state.settings.roundingThreshold);
                    if (calc.error) { showToast(calc.error, 'error'); return; }
                    if (!JalaliDate.isValidJalaliString(row.dateJalali)) {
                        showToast('فرمت تاریخ شمسی نامعتبر است.', 'error');
                        return;
                    }

                    const oldTx = structuredClone(this.state.transactions[idx]);
                    const updatedTx = {
                        ...oldTx,
                        side: row.direction,
                        curr1: row.currId,
                        amt1: cleanFloat(amt),
                        feeCurr: row.currId,
                        baseTotal: calc.baseTotal,
                        finalExact: calc.finalExact,
                        legs: calc.legs,
                        dateJalali: JalaliDate.formatJalaliNormalized(row.dateJalali),
                        description: (row.note || '').trim() || 'مانده اولیه / انتقال از قبل',
                        updatedAt: Date.now()
                    };
                    this.state.transactions[idx] = updatedTx;
                    this.state.auditLogs.push({
                        id: generateId('log'),
                        timestampJalali: JalaliDate.nowDateTimeStr(),
                        timestampMs: Date.now(),
                        counterpartyId: cp.id,
                        counterpartyName: cp.name,
                        txId: oldTx.id,
                        txCode: oldTx.code,
                        action: 'edit',
                        before: oldTx,
                        after: structuredClone(updatedTx)
                    });
                    showToast(`مانده اولیه ${oldTx.code} ویرایش و در لاگ ثبت شد.`, 'success');
                } else {
                    const validRows = d.rows.filter(r => r.amount.trim() !== '');
                    if (!validRows.length) {
                        showToast('لطفاً حداقل یک مبلغ مانده اولیه وارد کنید.', 'error');
                        return;
                    }
                    const createdTxs = [];
                    for (const row of validRows) {
                        const built = this.buildOpeningTransaction(cp.id, row);
                        if (built.error) {
                            showToast(built.error, 'error');
                            return;
                        }
                        createdTxs.push(built.tx);
                    }
                    for (const tx of createdTxs) {
                        this.state.transactions.push(tx);
                        this.state.auditLogs.push({
                            id: generateId('log'),
                            timestampJalali: JalaliDate.nowDateTimeStr(),
                            timestampMs: Date.now(),
                            counterpartyId: cp.id,
                            counterpartyName: cp.name,
                            txId: tx.id,
                            txCode: tx.code,
                            action: 'create',
                            before: null,
                            after: structuredClone(tx)
                        });
                    }
                    cp.lastActivityAt = Date.now();
                    showToast(`${createdTxs.length} ردیف مانده اولیه با موفقیت ثبت شد.`, 'success');
                }

                this.saveState();
                this.closeModal();
                this.render();
            }

            // -------------------------------------------------------------------------
            // مودال ثبت / ویرایش معامله (دو ارزی) یا انتقال (تک ارزی)
            // -------------------------------------------------------------------------
            openTransactionModal(cpId, editTxId = null) {
                const cp = this.getCounterparty(cpId);
                if (!cp) return;
                const existing = editTxId ? this.state.transactions.find(t => t.id === editTxId) : null;
                if (existing && existing.mode === 'opening') {
                    this.openOpeningBalanceModal(cpId, editTxId);
                    return;
                }

                const defaultCurr1 = this.state.currencies[0]?.id || 'USD';
                const defaultCurr2 = this.state.currencies[1]?.id || 'IRT';

                this._txDraft = existing ? {
                    editTxId: existing.id,
                    counterpartyId: cpId,
                    mode: existing.mode,
                    side: existing.side,
                    curr1: existing.curr1,
                    amt1: formatInputNumberString(String(existing.amt1)),
                    op: existing.op || 'mul',
                    rate: existing.rate ? formatInputNumberString(String(existing.rate)) : '',
                    curr2: existing.curr2 || defaultCurr2,
                    fee: existing.fee ? formatInputNumberString(String(existing.fee)) : '0',
                    feeCurr: existing.feeCurr || existing.curr2 || defaultCurr2,
                    feeMode: existing.feeMode || 'add',
                    applyRounding: existing.applyRounding !== false,
                    dateJalali: existing.dateJalali || JalaliDate.nowDateStr(),
                    description: existing.description || ''
                } : {
                    editTxId: null,
                    counterpartyId: cpId,
                    mode: 'deal',          // 'deal' | 'transfer'
                    side: 'sell',          // deal: 'sell'|'buy', transfer: 'receive'|'pay'
                    curr1: defaultCurr1,
                    amt1: '',
                    op: 'mul',
                    rate: '',
                    curr2: defaultCurr2,
                    fee: '0',
                    feeCurr: defaultCurr2,
                    feeMode: 'add',
                    applyRounding: true,
                    dateJalali: JalaliDate.nowDateStr(),
                    description: ''
                };

                this.renderTransactionModal();
            }

            renderTransactionModal() {
                const d = this._txDraft;
                const cp = this.getCounterparty(d.counterpartyId);
                const root = document.getElementById('modal-root');

                const currOptions = (selectedId) => this.state.currencies.map(c =>
                    `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.code)})</option>`
                ).join('');

                const c1Obj = this.getCurrency(d.curr1);
                const c2Obj = this.getCurrency(d.curr2);
                const feeCurrObj = this.getCurrency(isDealOrFeeCurr(d));

                function isDealOrFeeCurr(draft) {
                    return draft.mode === 'deal' ? (draft.feeCurr || draft.curr2) : draft.curr1;
                }

                const isDeal = d.mode === 'deal';

                root.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" onclick="if(event.target===this) app.closeModal()">
                        <div class="w-full sm:max-w-lg max-h-[93vh] overflow-y-auto bg-navy-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-3xl p-4 sm:p-5 shadow-2xl animate-slide-up">
                            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                                <div>
                                    <h3 class="text-base font-extrabold text-white">${d.editTxId ? 'ویرایش تراکنش' : 'ثبت تراکنش جدید'}</h3>
                                    <p class="text-xs text-slate-400 mt-0.5">طرف حساب: <strong class="text-emerald-400">${escapeHtml(cp?.name || '')}</strong> (ثبت از دید شما)</p>
                                </div>
                                <button onclick="app.closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">✕</button>
                            </div>

                            <!-- انتخاب نوع: معامله (دو ارزی) یا انتقال (تک ارزی) -->

                                            ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200'

                            <form onsubmit="app.submitTransactionForm(event)" class="space-y-3.5">

                                        </select>

                                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">مبلغ (${escapeHtml(c1Obj.name)})</label>

                                            value="${escapeHtml(d.amt1)}"
                                            oninput="app.updateTxDraftNumericField('amt1', this)"

                                            class="w-full h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-700 font-num text-sm font-bold text-white text-left focus:border-emerald-500 focus:outline-none">
                                    </div>
                                </div>

                                ${isDeal ? `
                                    <!-- عملگر، نرخ تبدیل و ارز دوم -->
                                    <div class="grid grid-cols-12 gap-2.5">
                                        <div class="col-span-3">
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">عملیات</label>
                                            <div class="grid grid-cols-2 gap-1 h-11 p-1 rounded-xl bg-navy-950 border border-slate-700">
                                                <button type="button" onclick="app.updateTxDraftField('op', 'mul', true)" class="rounded-lg font-num font-bold text-sm transition ${d.op === 'mul' ? 'bg-emerald-500 text-navy-950' : 'text-slate-400'}">×</button>
                                                <button type="button" onclick="app.updateTxDraftField('op', 'div', true)" class="rounded-lg font-num font-bold text-sm transition ${d.op === 'div' ? 'bg-emerald-500 text-navy-950' : 'text-slate-400'}">÷</button>
                                            </div>
                                        </div>
                                        <div class="col-span-4">
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">نرخ تبدیل</label>
                                            <input type="text" inputmode="decimal" id="txRate" dir="ltr" required
                                                value="${escapeHtml(d.rate)}"
                                                oninput="app.updateTxDraftNumericField('rate', this)"
                                                placeholder="270,000"
                                                class="w-full h-11 px-3 rounded-xl bg-navy-950 border border-slate-700 font-num text-sm font-bold text-white text-left focus:border-emerald-500 focus:outline-none">
                                        </div>
                                        <div class="col-span-5">
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">ارز دوم (مقصد)</label>
                                            <select id="txCurr2" onchange="app.updateTxDraftCurr2(this.value)"
                                                class="w-full h-11 px-2.5 rounded-xl bg-navy-950 border border-slate-700 text-xs font-semibold text-white focus:border-emerald-500 focus:outline-none">
                                                ${currOptions(d.curr2)}
                                            </select>
                                        </div>
                                    </div>
                                ` : ''}

                                <!-- کارمزد ثابت، ارز کارمزد و تاریخ شمسی -->
                                <div class="grid grid-cols-12 gap-2.5">
                                    <div class="${isDeal ? 'col-span-4' : 'col-span-6'}">
                                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">کارمزد ثابت (${escapeHtml(feeCurrObj.symbol)})</label>
                                        <input type="text" inputmode="decimal" id="txFee" dir="ltr"
                                            value="${escapeHtml(d.fee)}"
                                            oninput="app.updateTxDraftNumericField('fee', this)"
                                            placeholder="0"
                                            class="w-full h-11 px-3 rounded-xl bg-navy-950 border border-slate-700 font-num text-sm text-white text-left focus:border-emerald-500 focus:outline-none">
                                    </div>
                                    ${isDeal ? `
                                        <div class="col-span-4">
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">ارز کارمزد</label>
                                            <select id="txFeeCurr" onchange="app.updateTxDraftField('feeCurr', this.value, true)"
                                                class="w-full h-11 px-2 rounded-xl bg-navy-950 border border-slate-700 text-xs font-semibold text-white focus:border-emerald-500 focus:outline-none">
                                                ${currOptions(d.feeCurr || d.curr2)}
                                            </select>
                                        </div>
                                    ` : ''}
                                    <div class="${isDeal ? 'col-span-4' : 'col-span-6'}">
                                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">تاریخ شمسی</label>
                                        <input type="text" id="txDateJalali" dir="ltr" required
                                            value="${escapeHtml(d.dateJalali)}"
                                            oninput="app.updateTxDraftField('dateJalali', this.value)"
                                            placeholder="1405/08/28"
                                            class="w-full h-11 px-2.5 rounded-xl bg-navy-950 border border-slate-700 font-num text-xs sm:text-sm text-white text-center focus:border-emerald-500 focus:outline-none">
                                    </div>
                                </div>

                                <!-- تیک گرد کردن هوشمند -->
                                <label class="flex items-center gap-2.5 px-3 py-2.5 rounded-2xl bg-navy-950/70 border border-slate-800/80 cursor-pointer select-none">
                                    <input type="checkbox" id="txApplyRounding" ${d.applyRounding ? 'checked' : ''}
                                        onchange="app.updateTxDraftField('applyRounding', this.checked)"
                                        class="w-4 h-4 rounded accent-emerald-500 shrink-0">
                                    <span class="text-xs text-slate-200">اعمال گرد کردن هوشمند به نفع طرف حساب (ارزهای غیرتومانی)</span>
                                </label>

                                <!-- شرح و توضیحات -->
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">شرح / توضیحات (اختیاری)</label>

                                        oninput="app.updateTxDraftField('description', this.value)"
                                        placeholder="مثلاً حواله دبی، شماره پیگیری..."
                                        class="w-full h-11 px-3.5 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
                                </div>

                                <!-- باکس پیش‌نمایش زنده اثر روی بالانس طرف حساب -->
                                <div id="txLivePreview" class="rounded-2xl p-3.5 bg-navy-950 border border-slate-800 space-y-2">
                                    <!-- رندر توسط updateLivePreview -->
                                </div>

                                <div class="flex items-center gap-2 pt-1">
                                    <button type="submit" id="txSubmitBtn" class="flex-1 h-12 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-navy-950 font-extrabold text-sm shadow-lg shadow-emerald-500/20 transition">
                                        ${d.editTxId ? 'ثبت ویرایش تراکنش' : 'ثبت نهایی تراکنش'}
                                    </button>
                                    <button type="button" onclick="app.closeModal()" class="h-12 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition">انصراف</button>

                        </div>
